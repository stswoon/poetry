<template><style>@import url('assets/style.css');</style><div id="root" data-composition-id="captions" data-width="1920" data-height="1080"><div class="caption-band" data-layout-ignore></div><div id="line1" class="clip caption" data-start="0.020000" data-duration="3.777000" data-track-index="1" style="top:823px"><span>Ветер на море гуляет</span></div><div id="line2" class="clip caption" data-start="2.058000" data-duration="1.739000" data-track-index="1" style="top:905px"><span>И кораблик подгоняет;</span></div><div id="line3" class="clip caption" data-start="3.797000" data-duration="3.829000" data-track-index="1" style="top:823px"><span>Он бежит себе в волнах</span></div><div id="line4" class="clip caption" data-start="5.676000" data-duration="1.950000" data-track-index="1" style="top:905px"><span>На раздутых парусах.</span></div><div id="line5" class="clip caption" data-start="7.626000" data-duration="3.433000" data-track-index="1" style="top:823px"><span>Корабельщики дивятся,</span></div><div id="line6" class="clip caption" data-start="9.151000" data-duration="1.908000" data-track-index="1" style="top:905px"><span>На кораблике толпятся,</span></div><div id="line7" class="clip caption" data-start="11.059000" data-duration="3.362000" data-track-index="1" style="top:823px"><span>На знакомом острову</span></div><div id="line8" class="clip caption" data-start="12.627000" data-duration="1.794000" data-track-index="1" style="top:905px"><span>Чудо видят наяву:</span></div><div id="line9" class="clip caption" data-start="14.421000" data-duration="4.381000" data-track-index="1" style="top:823px"><span>Город новый златоглавый,</span></div><div id="line10" class="clip caption" data-start="16.609000" data-duration="2.193000" data-track-index="1" style="top:905px"><span>Пристань с крепкою заставой —</span></div><div id="line11" class="clip caption" data-start="18.802000" data-duration="3.620000" data-track-index="1" style="top:823px"><span>Пушки с пристани палят,</span></div><div id="line12" class="clip caption" data-start="20.500000" data-duration="1.922000" data-track-index="1" style="top:905px"><span>Кораблю пристать велят.</span></div><div id="line13" class="clip caption" data-start="22.422000" data-duration="4.353000" data-track-index="1" style="top:823px"><span>Пристают к заставе гости;</span></div><div id="line14" class="clip caption" data-start="24.537000" data-duration="2.238000" data-track-index="1" style="top:905px"><span>Князь Гвидон зовёт их в гости,</span></div><div id="line15" class="clip caption" data-start="26.775000" data-duration="3.577000" data-track-index="1" style="top:823px"><span>Их он кормит и поит</span></div><div id="line16" class="clip caption" data-start="28.674000" data-duration="1.678000" data-track-index="1" style="top:905px"><span>И ответ держать велит:</span></div><div id="line17" class="clip caption" data-start="30.352000" data-duration="3.849000" data-track-index="1" style="top:823px"><span>«Чем вы, гости, торг ведёте</span></div><div id="line18" class="clip caption" data-start="32.502000" data-duration="1.699000" data-track-index="1" style="top:905px"><span>И куда теперь плывёте?»</span></div><div id="line19" class="clip caption" data-start="34.201000" data-duration="3.739000" data-track-index="1" style="top:823px"><span>Корабельщики в ответ:</span></div><div id="line20" class="clip caption" data-start="35.848000" data-duration="2.092000" data-track-index="1" style="top:905px"><span>«Мы объехали весь свет,</span></div><div id="line21" class="clip caption" data-start="37.940000" data-duration="3.068000" data-track-index="1" style="top:823px"><span>Торговали соболями,</span></div><div id="line22" class="clip caption" data-start="39.344000" data-duration="1.664000" data-track-index="1" style="top:905px"><span>Чернобурыми лисами;</span></div><div id="line23" class="clip caption" data-start="41.008000" data-duration="3.641000" data-track-index="1" style="top:823px"><span>А теперь нам вышел срок,</span></div><div id="line24" class="clip caption" data-start="42.881000" data-duration="1.768000" data-track-index="1" style="top:905px"><span>Едем прямо на восток,</span></div><div id="line25" class="clip caption" data-start="44.649000" data-duration="4.691000" data-track-index="1" style="top:823px"><span>Мимо острова Буяна,</span></div><div id="line26" class="clip caption" data-start="46.372000" data-duration="2.968000" data-track-index="1" style="top:905px"><span>В царство славного Салтана…»</span></div></div><script>const c=gsap.timeline({paused:true});c.to({p:0},{p:1,duration:49.34,ease:'none'},0);window.__timelines.captions=c;</script></template>
