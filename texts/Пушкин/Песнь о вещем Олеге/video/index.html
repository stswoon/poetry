const FONT = {};
for (const ch in GLYPHS) {
  const parts = GLYPHS[ch].split("|");
  const y0 = +parts[0], rows = parts.slice(1);
  const px = [];
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) if (r[i] === "#") px.push(i, y0 + j); });
  FONT[ch] = { w: Math.max(...rows.map((r) => r.length)), px };
}
const SPACE = 3, GAP = 1;

function textWidth(s, bold) {
  let w = 0;
  for (const ch of s) {
    if (ch === "\u0301") continue;
    const g = FONT[ch];
    w += (g ? g.w + GAP : SPACE) + (g && bold ? 1 : 0);
  }
  return Math.max(0, w - GAP);
}

// Кладёт текст в контекст по целым координатам; (x, y) — верх прописной буквы.
function drawText(c, s, x, y, color, opt) {
  opt = opt || {};
  const scale = opt.scale || 1, bold = opt.bold;
  const shadow = opt.shadow;
  const put = (col, dx, dy) => {
    c.fillStyle = col;
    let cx = x + dx, pw = 0;
    for (const ch of s) {
      if (ch === "\u0301") { // ударение над предыдущей буквой
        const ax = cx - (pw + GAP) * scale + Math.floor(pw / 2) * scale;
        c.fillRect(ax, y + dy, scale, scale); c.fillRect(ax + scale, y + dy - scale, scale, scale);
        continue;
      }
      const g = FONT[ch];
      if (!g) { cx += SPACE * scale; continue; }
      pw = g.w;
      for (let i = 0; i < g.px.length; i += 2) {
        c.fillRect(cx + g.px[i] * scale, y + dy + g.px[i + 1] * scale, scale * (bold ? 2 : 1), scale);
      }
      cx += (g.w + GAP + (bold ? 1 : 0)) * scale;
    }
  };
  if (shadow) put(shadow, scale, scale);
  put(color, 0, 0);
}

// Из «Ильи Муромца» (пересказ). v2 «Песни о вещем Олеге»: низкое разрешение 384×216, масштаб ×5 в CSS (8-бит).
const LW = 384, LH = 216;

function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const smooth = (u) => { u = clamp(u); return u * u * (3 - 2 * u); };
const R = Math.round;

// пружина Framer Motion как функция времени: 0 → 1 с перелётом
function makeSpring(o) {
  const g = Motion.spring(Object.assign({ keyframes: [0, 1] }, o));
  const pts = [];
  for (let i = 0; i <= 300; i++) pts.push(g.next(i * 10).value);
  return (s) => { if (s <= 0) return 0; const f = s * 100; if (f >= 300) return 1; const i = Math.floor(f); return lerp(pts[i], pts[i + 1], f - i); };
}
const springPop = makeSpring({ stiffness: 240, damping: 14, mass: 1 });
const springSoft = makeSpring({ stiffness: 90, damping: 16, mass: 1 });

function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(R(x), R(y), R(w), R(h)); }
function poly(c, pts, col) {
  let y0 = Infinity, y1 = -Infinity;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  c.fillStyle = col;
  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
    const xs = [];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      if ((a[1] <= y + 0.5 && b[1] > y + 0.5) || (b[1] <= y + 0.5 && a[1] > y + 0.5)) {
        xs.push(a[0] + (y + 0.5 - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
    }
    xs.sort((p, q) => p - q);
    for (let i = 0; i + 1 < xs.length; i += 2) {
      const l = R(xs[i]), r = R(xs[i + 1]);
      if (r > l) c.fillRect(l, y, r - l, 1);
    }
  }
}
function disc(c, x, y, r, col) {
  c.fillStyle = col;
  for (let j = -Math.ceil(r); j <= Math.ceil(r); j++) {
    const h = Math.sqrt(Math.max(0, r * r - j * j));
    if (h > 0) c.fillRect(R(x - h), R(y + j), Math.max(1, R(2 * h)), 1);
  }
}
function ell(c, x, y, rx, ry, col) {
  c.fillStyle = col;
  for (let j = -Math.ceil(ry); j <= Math.ceil(ry); j++) {
    const h = rx * Math.sqrt(Math.max(0, 1 - (j * j) / (ry * ry)));
    if (h > 0) c.fillRect(R(x - h), R(y + j), Math.max(1, R(2 * h)), 1);
  }
}
function line(c, x0, y0, x1, y1, col, w = 1) {
  c.fillStyle = col;
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
  for (let i = 0; i <= n; i++) c.fillRect(R(lerp(x0, x1, i / n) - (w - 1) / 2), R(lerp(y0, y1, i / n) - (w - 1) / 2), w, w);
}

// Спрайт в кэше: рисует fn, по желанию обводит тёмным контуром.
const spriteCache = new Map();
function sprite(key, w, h, fn, outline = "#120c14") {
  let s = spriteCache.get(key);
  if (s) return s;
  s = document.createElement("canvas");
  s.width = w; s.height = h;
  const c = s.getContext("2d");
  c.imageSmoothingEnabled = false;
  fn(c);
  if (outline) {
    const id = c.getImageData(0, 0, w, h), d = id.data;
    const op = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 40;
    const edge = [];
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!op(x, y) && (op(x - 1, y) || op(x + 1, y) || op(x, y - 1) || op(x, y + 1))) edge.push(x, y);
    }
    c.fillStyle = outline;
    for (let i = 0; i < edge.length; i += 2) c.fillRect(edge[i], edge[i + 1], 1, 1);
  }
  spriteCache.set(key, s);
  return s;
}
function blit(c, s, x, y, flip) {
  x = R(x); y = R(y);
  if (!flip) { c.drawImage(s, x, y); return; }
  c.save(); c.translate(x + s.width, y); c.scale(-1, 1); c.drawImage(s, 0, 0); c.restore();
}
// Масштаб и поворот спрайта без сглаживания (поворот стиля Mode 7)
function blitRot(c, s, cx, cy, ang, scale = 1) {
  c.save(); c.translate(R(cx), R(cy)); c.rotate(ang); c.scale(scale, scale);
  c.drawImage(s, -s.width / 2, -s.height / 2); c.restore();
}

// Небо из полос с шахматным переходом: фирменный градиент 16-бит.
function mixHex(a, b, u) {
  const p = (s, i) => parseInt(s.substr(i, 2), 16);
  const m = (i) => R(lerp(p(a, i), p(b, i), u)).toString(16).padStart(2, "0");
  return "#" + m(1) + m(3) + m(5);
}
function skyBands(c, src, h = LH) {
  const bands = [];
  src.forEach((col, i) => { bands.push(col); if (i + 1 < src.length) bands.push(mixHex(col, src[i + 1], 0.5)); });
  const n = bands.length, bh = h / n;
  for (let i = 0; i < n; i++) {
    const y = Math.floor(i * bh), y2 = Math.floor((i + 1) * bh);
    rect(c, 0, y, LW, y2 - y, bands[i]);
    if (i + 1 < n) {
      c.fillStyle = bands[i + 1];
      for (let yy = y2 - 2; yy < y2; yy++) for (let x = (yy & 1) * 1; x < LW; x += 2) c.fillRect(x, yy, 1, 1);
    }
  }
}

function hillsLayer(c, base, amp, period, seed, col, scroll, topCol) {
  for (let x = 0; x < LW; x++) {
    const u = (x + scroll) / period;
    const n = Math.sin(u * 2 + seed) * 0.55 + Math.sin(u * 5.3 + seed * 2.1) * 0.25 + Math.sin(u * 11.7 + seed * 0.7) * 0.2;
    const y = R(base - (n + 1) * amp);
    if (topCol) { c.fillStyle = topCol; c.fillRect(x, y, 1, 2); c.fillStyle = col; c.fillRect(x, y + 2, 1, LH - y); }
    else { c.fillStyle = col; c.fillRect(x, y, 1, LH - y); }
  }
}

// Зубчатая кромка хвойного леса
function forestLayer(c, base, h, period, seed, col, scroll, tipCol) {
  const ox = Math.floor(scroll / period);
  for (let i = -2; i < LW / period + 3; i++) {
    const k = i + ox, x = k * period - scroll;
    const th = h * (0.55 + hash(k * 3.1 + seed) * 0.6), tx = x + hash(k + seed) * period * 0.6;
    const hw = period * (0.75 + hash(k * 7.7 + seed) * 0.35);
    poly(c, [[tx, base - th], [tx + hw, base + 2], [tx - hw, base + 2]], col);
    if (tipCol) poly(c, [[tx, base - th], [tx + hw * 0.32, base - th * 0.68], [tx - hw * 0.1, base - th * 0.64]], tipCol);
  }
  rect(c, 0, base, LW, LH - base, col);
}

function cloudsLayer(c, y, scroll, seed, col, shade) {
  const P = 150, ox = Math.floor(scroll / P);
  for (let i = -1; i < LW / P + 2; i++) {
    const k = i + ox, x = k * P - scroll + hash(k * 9.1 + seed) * 70, yy = y + hash(k * 2.3 + seed) * 26;
    const w = 14 + hash(k + seed) * 18;
    ell(c, x, yy, w, 5, col); ell(c, x - w * 0.5, yy + 2, w * 0.6, 4, col); ell(c, x + w * 0.6, yy + 2, w * 0.55, 3, col); ell(c, x + w * 0.1, yy - 3, w * 0.5, 4, col);
    rect(c, x - w * 0.9, yy + 4, w * 1.8, 1, shade);
  }
}

// Плоская земля с полосами-тайлами, бегущими вбок
function groundLayer(c, y, scroll, cols, tuft) {
  const [a, b, d] = cols;
  rect(c, 0, y, LW, LH - y, a);
  rect(c, 0, y, LW, 2, b);
  for (let i = 0; i < 90; i++) {
    const row = hash(i * 1.7);
    const yy = y + 4 + row * (LH - y - 6);
    const sp = 0.6 + row * 1.6;
    const P = LW + 40;
    let x = (hash(i * 3.3) * P - scroll * sp) % P; if (x < 0) x += P;
    x -= 20;
    rect(c, x, yy, 4 + hash(i) * 8, 1, i % 3 ? d : b);
  }
  if (tuft) {
    const P = 37, ox = Math.floor(scroll * 1.2 / P);
    for (let i = -1; i < LW / P + 2; i++) {
      const k = i + ox, x = k * P - scroll * 1.2 + hash(k) * 20, yy = y + 1 + hash(k * 1.3) * 3;
      rect(c, x, yy - 3, 1, 3, tuft); rect(c, x + 2, yy - 2, 1, 2, tuft);
    }
  }
}

function wash(c, col, a) {
  c.save(); c.globalAlpha = a; c.fillStyle = col; c.fillRect(0, 0, LW, LH); c.restore();
}

// Шахматное затемнение: 4 уровня, как у консоли без альфы
function ditherFade(c, level, col = "#0b0710") {
  level = clamp(level);
  if (level <= 0) return;
  if (level >= 1) { rect(c, 0, 0, LW, LH, col); return; }
  c.fillStyle = col;
  const n = Math.floor(level * 4);
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) {
    const m = ((x & 1) * 2 + (y & 1) * 3 + ((x >> 1) & 1) + ((y >> 1) & 1) * 2) % 4;
    if (m < n + (level * 4 - n > 0.5 ? 1 : 0)) c.fillRect(x, y, 1, 1);
  }
}

// Диафрагма: чёрный круг, закрывающий экран
function iris(c, cx, cy, r, col = "#0b0710") {
  c.fillStyle = col;
  if (r <= 0) { c.fillRect(0, 0, LW, LH); return; }
  for (let y = 0; y < LH; y++) {
    const d = y - cy, h = r * r - d * d;
    if (h <= 0) { c.fillRect(0, y, LW, 1); continue; }
    const s = Math.sqrt(h), l = R(cx - s), rr = R(cx + s);
    if (l > 0) c.fillRect(0, y, l, 1);
    if (rr < LW) c.fillRect(rr, y, LW - rr, 1);
  }
}

// Пиксельная рамка окна в стиле консольной RPG
function panel(c, x, y, w, h, fill = "#141a3c") {
  rect(c, x + 2, y, w - 4, h, "#e8e0c0");
  rect(c, x, y + 2, w, h - 4, "#e8e0c0");
  rect(c, x + 1, y + 1, w - 2, h - 2, "#e8e0c0");
  rect(c, x + 2, y + 2, w - 4, h - 4, "#7a6a3c");
  rect(c, x + 3, y + 3, w - 6, h - 6, fill);
  c.fillStyle = "#1c2450";
  for (let j = y + 3; j < y + h - 3; j += 2) c.fillRect(x + 3, j, w - 6, 1);
}

function leg(c, hx, hy, a1, a2, l1, l2, col, hoof, w = 3) {
  const kx = hx + Math.sin(a1) * l1, ky = hy + Math.cos(a1) * l1;
  const fx = kx + Math.sin(a2) * l2, fy = ky + Math.cos(a2) * l2;

  line(c, kx, ky, fx, fy, col, w);
  rect(c, fx - 1, fy, 4, 2, hoof);

// Конь с Ильёй. frame 0..7. opt: walk, idle (стоит, но дышит), kneel, spear, bow, noRider, talk, hand: [x, y] — кисть правой руки
function riderSprite(frame, opt = {}) {
  const key = "rider" + frame + JSON.stringify(opt);
  return sprite(key, 84, 80, (c) => {
    const p = (frame / 8) * Math.PI * 2;
    const still = opt.idle || opt.kneel;
    const amp = still ? 0 : opt.walk ? 0.42 : 0.82;
    const bob = still ? 0 : opt.walk ? R(Math.sin(p * 2) * 0.6) : R(Math.sin(p * 2) * 1.2);
    const ox = 6, oy = 18 + bob;
    const X = (x) => x + ox, Y = (y) => y + oy;
    const dark = COL.bayD, mid = COL.bay, light = COL.bayL;

// перекраска готового спрайта по таблице цветов
function recolor(key, src, map) {
  return sprite(key, src.width, src.height, (c) => {
    c.drawImage(src, 0, 0);
    const id = c.getImageData(0, 0, src.width, src.height), d = id.data;
    const M = Object.entries(map).map(([a, b]) => [parseInt(a.slice(1), 16), parseInt(b.slice(1), 16)]);
    for (let i = 0; i < d.length; i += 4) {
      if (!d[i + 3]) continue;
      const v = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
      for (const [a, b] of M) if (v === a) { d[i] = (b >> 16) & 255; d[i + 1] = (b >> 8) & 255; d[i + 2] = b & 255; break; }
    }
    c.putImageData(id, 0, 0);
  }, null);
}

function fire(c, x, y, w, h, t) {
  const f = Math.floor(t * 10);
  for (let i = 0; i < w; i++) {
    const hh = h * (0.45 + 0.55 * hash(i * 3.1 + f * 0.7)) * (1 - Math.abs(i / w - 0.5) * 1.2);
    rect(c, x + i, y - hh, 1, hh, "#e8302c"); rect(c, x + i, y - hh * 0.7, 1, hh * 0.7, "#f08a20"); rect(c, x + i, y - hh * 0.35, 1, hh * 0.35, "#ffe680");
  }
}
// змея из «Ильи», дополнена размером
function snake(c, x, y, t, dir = 1, n = 26, s = 1) {
  for (let i = 0; i < n; i++) {
    const px = x - dir * i * 3 * s, py = y + Math.sin(i * 0.65 - t * 7 * dir) * 3 * s;
    rect(c, px, py, 4 * s, (3 + (i < n - 6 ? 1 : 0)) * s, i % 4 === 0 ? "#6a7a50" : "#1e2a1a");
    rect(c, px, py + 3 * s, 3 * s, s, "#0e140c");
  }
  const hy = y + Math.sin(-t * 7 * dir) * 3 * s;
  ell(c, x + dir * 3 * s, hy + s, 5 * s, 3 * s, "#1e2a1a");
  rect(c, x + dir * 4 * s, hy, 2 * s, 2 * s, "#ffe060");
  if (Math.floor(t * 4) % 2) rect(c, x + dir * 8 * s - (dir < 0 ? 3 * s : 0), hy + 2 * s, 4 * s, s, "#d82020");
}

    ell(c, 192, 190, 200, 70, "#1a1420");
    blit(c, igor(), 160, 84); blit(c, olga(), 196, 86, true); // сидят на бревне
    rect(c, 150, 118, 86, 10, "#3a2414"); rect(c, 150, 118, 86, 2, "#5a3a20"); disc(c, 150, 123, 5, "#5a3a20"); disc(c, 150, 123, 2, "#3a2414");
    return;
  }
  if (t < L(101) - 0.1) { // дружина у брега
    skyBands(c, DUSK); rect(c, 0, 112, LW, 16, "#3a5a8a"); groundLayer(c, 128, 0, ["#2a2418", "#3a3420", "#1e1a10"]);
    firePit(c, 192, t);
    [0, 64, 256, 320].forEach((x, i) => druzhAt(c, x, t + i, i % 2 ? "talk" : "idle", i > 1, COL.white));
    return;
  }
  skyBands(c, NIGHT); stars(c, 33, 80, t); groundLayer(c, 128, 0, ["#1a1810", "#2a2618", "#12100a"]); // поминают: пузырь-воспоминание
  firePit(c, 192, t);
  [0, 64, 256, 320].forEach((x, i) => druzhAt(c, x, t + i, "idle", i > 1, COL.white));
  bubble(c, 96, 16, 192, 66, 192, 100);
  c.save(); c.beginPath(); c.rect(100, 20, 184, 58); c.clip();
  skyBands(c, ["#5a2010", "#8a3a18", "#c86a28"], 84); groundLayer(c, 76, (t - L(101)) * 60, ["#4a3018", "#6a4a28", "#3a2410"]);
  rider(c, 120, 80, t, { speed: 14, spear: true }); rider(c, 40, 80, t + 0.3, { speed: 14, spear: true }, false, druzhSprite);
  c.restore();
}

function scFinal(c, t) {
  skyBands(c, NIGHT); stars(c, 41, 70, t); moon(c, 330, 104, 14);
  ell(c, 230, 216, 230, 60, "#0e0e20");
  rider(c, 200, 172, t, { spear: true });
  const k = springPop((t - W("fin")) * 1.2);
  centerText(c, "ПЕСНЬ О ВЕЩЕМ ОЛЕГЕ", R(30 - (1 - k) * 30), "#ffe680", 2);
  if (t > W("fin") + 0.5) centerText(c, "Александр Сергеевич Пушкин", 60, "#e8ecf8");
}

// ---------- v3. Склейка: таблица сцен, HUD, окно диалога, квест, переходы ----------
const cv = document.getElementById("scene");
const g = cv.getContext("2d", { alpha: false });
g.imageSmoothingEnabled = false;
const TOTAL = CFG.total, LINES = CFG.lines;
const BOX_Y = 166;

// [функция сцены, время начала, переход на входе]
const TABLE = [
  [scTitle, 0], [sc1, L(1) - 0.3, "flash"], [sc2, L(7) - 0.3, "mos"], [sc3, L(13) - 0.3, "none"], [sc4, L(19) - 0.6, "iris"],
  [sc5, L(25) - 0.3, "none"], [sc6, L(31) - 0.3, "mos"], [sc7, L(37) - 0.3, "mos"], [sc8, L(43) - 0.4, "iris"], [sc9, L(49) - 0.3, "mos"],
  [sc10, L(55) - 0.3, "none"], [null, W("years"), "none"], [sc11, L(61) - 0.15, "iris"], [sc12, L(67) - 0.3, "none"], [sc13, L(73) - 0.3, "mos"],
  [sc14, L(79) - 0.3, "iris"], [sc15, L(85) - 0.4, "mos"], [sc16, L(91) - 0.4, "none"], [scGameOver, W("w_vskr") + 0.7, "none"],
  [sc17, L(97) - 0.15, "none"], [scFinal, W("fin") - 0.3, "iris"],
];
function yearsCard(c, t) {
  rect(c, 0, 0, LW, LH, "#0b0710");
  const k = clamp((t - W("years")) / 0.3);
  if (k > 0) centerText(c, "ПРОШЛО МНОГО ЛЕТ…", 96, "#ffe680", 2);
}

// ---------- HUD ----------
const HEART_T = (i) => W("w_vskr") + 0.15 + i * 0.12;
function hud(c, t) {
  if (t < L(1) - 0.3 || t > W("fin") - 0.3 || (t > W("years") && t < L(61) - 0.15) || t > W("w_vskr") + 0.7 && t < L(97) - 0.15) return;
  rect(c, 0, 0, LW, TOP, "#0b0710"); rect(c, 0, TOP - 1, LW, 1, "#3a3060");
  drawText(c, "ОЛЕГ", 4, 3, "#ffffff");
  const hl = heartsLeft(t);
  for (let i = 0; i < 5; i++) blit(c, heartIcon(i < hl), 34 + i * 10, 2);
  const on = t > W("w_kon1") && t < W("leave");
  const questBlink = t > W("quest") && t < LE(42) + 1.1 && Math.floor(t * 6) % 2;
  blit(c, horseIcon(on), 92, 1); if (questBlink) rect(c, 91, 0, 15, 12, "rgba(232,48,44,0.6)");
  const glory = ["w_pozh", "w_slava", "w_shchit", "w_volny"].filter((k) => t > W(k) + 0.2).length * 100;
  blit(c, coinIcon(), 290, 2); drawText(c, "СЛАВА " + glory, 300, 3, "#ffe680");
  if (t > W("boss") && t < W("w_vskr") + 0.7) { drawText(c, "ЗМИЯ", 130, 3, "#e8302c"); rect(c, 160, 3, 82, 7, "#120c14"); rect(c, 161, 4, 80, 5, "#e8302c"); }
}

// ---------- окно диалога: портрет, имя, две строки, слова печатаются под голос ----------
const ROLE = { oleg: ["ОЛЕГ", "oleg"], kud: ["КУДЕСНИК", "kud"], chron: ["ЛЕТОПИСЬ", "chron"] };
function curLine(t) { let k = -1; for (let i = 0; i < LINES.length; i++) if (LINES[i].s - 0.1 <= t) k = i; return k; }
function drawWords(c, L0, x, y, t, dim) {
  for (const w of L0.words) {
    if (t < w.s - 0.06) break;
    const col = dim ? "#9ea4cc" : t < w.e ? "#ffffff" : "#ffe680";
    drawText(c, w.w, x, y, col, { shadow: "#0a0c20" });
    x += textWidth(w.w) + SPACE + 1;
  }
}
function drawBox(c, t) {
  const i = curLine(t);
  if (i < 0 || t > W("fin") - 0.4) return; // на «КОНЕЦ ИГРЫ» строка 96 остаётся внизу до строки 97
  let Lc = LINES[i];
  if (Lc.n === CFG.quest) return; // строка квеста — в своём окне
  const pairStart = Lc.n % 2 === 1 ? Lc.n : Lc.n - 1;
  const r = ROLE[Lc.role];
  const k = springSoft((t - LINES[0].s + 0.4) * 1.2);
  const by = R(lerp(LH, BOX_Y, k));
  panel(c, 4, by, LW - 8, LH - by - 3);
  const speaking = t < Lc.e && Math.floor(t * 9) % 3 !== 0;
  rect(c, 8, by + 4, 40, 40, "#e8e0c0");
  const mood = r[1] === "oleg" && Lc.n >= 91 ? "laugh" : r[1] === "oleg" && Lc.n >= 74 && Lc.n <= 77 ? "angry" : r[1] === "kud" ? "glow" : "";
  blit(c, portrait2(r[1], speaking ? 1 : 0, (t * 0.31 + i * 0.13) % 1 < 0.03, mood), 8, by + 4);
  const nw = textWidth(r[0]);
  rect(c, 54, by - 5, nw + 8, 11, "#7a2c2c"); rect(c, 55, by - 4, nw + 6, 9, "#a03c34");
  drawText(c, r[0], 58, by - 3, "#fff3c0");
  const rows = [];
  for (let n = pairStart; n <= Lc.n; n++) if (n !== CFG.quest && LINES[n - 1].role === Lc.role) rows.push(LINES[n - 1]); // сменился говорящий — новая страница
  let y = by + 12;
  for (const M of rows) { drawWords(c, M, 56, y, t, M.n !== Lc.n); y += 14; }
  if (t > Lc.e + 0.15 && Math.floor(t * 3) % 2) { rect(c, LW - 16, by + 38, 5, 1, "#ffe680"); rect(c, LW - 15, by + 39, 3, 1, "#ffe680"); rect(c, LW - 14, by + 40, 1, 1, "#ffe680"); }
}
// окно «НОВЫЙ КВЕСТ» со строкой 42
function questBox(c, t) {
  const q = LINES[CFG.quest - 1], t0 = W("quest"), t1 = LE(CFG.quest) + 1.1;
  if (t < t0 || t > t1) return;
  const k = springPop((t - t0) * 1.6), w = 300, h = 54, x = R((LW - w) / 2), y = R(26 - (1 - k) * 60);
  panel(c, x, y, w, h, "#3a1020");
  centerText(c, "НОВЫЙ КВЕСТ", y + 7, "#ffe680");
  rect(c, x + 20, y + 19, w - 40, 1, "#7a6a3c");
  const tw = textWidth(q.text); drawWords(c, q, R((LW - tw) / 2), y + 30, t, false);
}

// ---------- переходы ----------
const tmp = document.createElement("canvas"); tmp.width = LW; tmp.height = LH;
const tg = tmp.getContext("2d"); tg.imageSmoothingEnabled = false;
function mosaic(level) {
  const sc = Math.max(1, R(level)); if (sc <= 1) return;
  const w = Math.ceil(LW / sc), h = Math.ceil(LH / sc);
  tg.drawImage(cv, 0, 0, LW, LH, 0, 0, w, h); g.drawImage(tmp, 0, 0, w, h, 0, 0, w * sc, h * sc);
}
function render(t) {
  let i = 0;
  while (i + 1 < TABLE.length && t >= TABLE[i + 1][1]) i++;
  const [fn, start, kind] = TABLE[i], u = t - start;
  g.setTransform(1, 0, 0, 1, 0, 0);
  rect(g, 0, 0, LW, LH, "#0b0710");
  if (fn) fn(g, t); else yearsCard(g, t);
  const next = TABLE[i + 1], till = next ? next[1] - t : 99, nk = next && next[2];
  if (kind === "mos" && u < 0.35) mosaic(lerp(14, 1, u / 0.35));
  if (nk === "mos" && till < 0.35) mosaic(lerp(1, 14, 1 - till / 0.35));
  if (kind === "iris" && u < 0.5) iris(g, LW / 2, 90, lerp(0, 260, smooth(u / 0.5)));
  if (nk === "iris" && till < 0.5) iris(g, LW / 2, 90, lerp(260, 0, smooth(1 - till / 0.5)));
  if (kind === "flash" && u < 0.25) wash(g, "#ffffff", 1 - u / 0.25);
  hud(g, t);
  questBox(g, t);
  drawBox(g, t);
  if (t > TOTAL - 1.0) wash(g, "#000000", clamp((t - TOTAL + 1.0) / 0.9));
}

window.addEventListener("hf-seek", (e) => render(e.detail.time));
render(0);

      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, CFG.total);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
