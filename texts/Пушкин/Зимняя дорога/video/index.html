// ---------- Строки стиха золотом ----------
const FONT = (px, w = 700) => `${w} ${px}px "Doroga", serif`;
const TXT = { size: 46, base: [796, 852, 908, 964] };
let LAYOUT = null;
function layoutText(c) {
  c.font = FONT(TXT.size);
  const sp = c.measureText(" ").width;
  LAYOUT = CFG.lines.map((l) => {
    const ws = l.words.map((w) => ({ ...w, wd: c.measureText(w.text).width }));
    const tot = ws.reduce((s, w) => s + w.wd, 0) + sp * (ws.length - 1);
    let x = 960 - tot / 2;
    for (const w of ws) { w.x = x; x += w.wd + sp; }

}
// слово пишется золотом слева направо, впереди светлое перо; строфа рассыпается золотой пылью
function goldText(c, t) {
  if (!LAYOUT) layoutText(c);
  c.save(); c.font = FONT(TXT.size); c.textBaseline = "alphabetic";
  for (const l of LAYOUT) {
    const st = Math.floor((l.n - 1) / 4) + 1, out0 = EV[`tx${st}`], out1 = out0 + 0.62;
    if (t < l.ws[0].at - 0.05 || t >= out1) continue;
    for (const w of l.ws) {
      const a = t - w.at; if (a < 0) continue;
      const u = sstep(a / Math.min(0.42, Math.max(0.2, w.dur)));
      const sw = t > out0 ? sstep(((t - out0) / 0.45) * 1.5 - (w.x - 400) / 1100) : 0;
      if (sw >= 1) continue;
      const X = w.x - 4 + (w.wd + 8) * u;
      c.save(); c.globalAlpha = 1 - sw;
      c.beginPath(); c.rect(w.x - 6, l.y - 52, X - w.x + 6, 72); c.clip();
      c.fillStyle = w.key ? GOLD_L : goldGrad(c, 0, l.y - 36, 0, l.y + 8);
      c.fillText(w.text, w.x, l.y);
      c.restore();
      if (u < 1) { c.save(); c.beginPath(); c.rect(X - 18, l.y - 52, 18, 72); c.clip(); c.fillStyle = "#fff6d6"; c.fillText(w.text, w.x, l.y); c.restore(); sparkle(c, X, l.y - 18, 9, 1 - u); }
      if (sw > 0) for (let k = 0; k < 6; k++) { const r = hash(k, l.n * 50 + w.x | 0); sparkle(c, w.x + w.wd * r, l.y - 16 - 50 * sw * (0.5 + hash(k, 3)), 4 + 3 * r, (1 - sw) * 0.9); }
    }
  }
  c.restore();
}

// Смена картины: золотая кромка идёт слева направо, слева уже новая картина
function sweep(c, t, a, b, drawA, drawB, seed = 3) {
  if (t < a) return drawA(c, t);
  if (t >= b) return drawB(c, t);
  const u = sstep(prog(t, a, b)), X = lerp(PIC.x - 120, PIC.x + PIC.w + 120, u);
  const fx = (y) => X + 46 * Math.sin((y - PIC.y) * 0.008 + seed) + 18 * Math.sin(y * 0.021 + seed * 2.1);
  drawA(c, t);
  c.save(); c.beginPath(); c.moveTo(PIC.x - 200, PIC.y - 10);
  for (let y = PIC.y - 10; y <= PIC.y + PIC.h + 10; y += 12) c.lineTo(fx(y), y);
  c.lineTo(PIC.x - 200, PIC.y + PIC.h + 10); c.closePath(); c.clip();
  drawB(c, t); c.restore();
  // кромка: широкое золотое свечение и тонкая яркая линия
  const edge = () => { c.beginPath(); for (let y = PIC.y - 10; y <= PIC.y + PIC.h + 10; y += 12) { const x = fx(y); if (y === PIC.y - 10) c.moveTo(x, y); else c.lineTo(x, y); } };
  c.save(); edge(); c.strokeStyle = "rgba(240,200,110,0.28)"; c.lineWidth = 22; c.stroke(); edge(); c.strokeStyle = GOLD; c.lineWidth = 5; c.stroke(); edge(); c.strokeStyle = "#fff3c4"; c.lineWidth = 1.6; c.stroke(); c.restore();
  particles(t, a, b, 70, (i, bt, r) => { const yy = lerp(PIC.y, PIC.y + PIC.h, r(1)); return { x: fx(yy) + 6, y: yy, vx: 60 + 160 * r(2), vy: -30 + 60 * r(3), life: 0.5 + 0.4 * r(4), s: 5 + 6 * r(5) }; }, seed,
    (x, y, k, p) => sparkle(c, x, y, p.s * (1 - k * 0.6), 1 - k));
}

// Палехские фигуры: ночное небо, луна, туманы-ленты, снега с пробелами, ели, тройка, ямщик, изба, вёрсты, горница, Нина и поэт, часы.
const HOR = 430;               // горизонт
const GROUND = PIC.y + PIC.h;  // низ картины

// ---------- Небо ----------
const STARS = []; { const r = mulberry32(31); for (let i = 0; i < 70; i++) STARS.push({ x: PIC.x + 20 + r() * (PIC.w - 40), y: PIC.y + 14 + r() * (HOR - PIC.y - 70), s: 3 + r() * 6, ph: r() * 6 }); }
function sky(c, t, warm = 0) {
  const g = c.createLinearGradient(0, PIC.y, 0, HOR + 20);
  g.addColorStop(0, "#05060a"); g.addColorStop(0.65, "#0d1222"); g.addColorStop(1, "#1d2a48");
  c.fillStyle = g; c.fillRect(PIC.x, PIC.y, PIC.w, HOR + 20 - PIC.y);
  for (const s of STARS) sparkle(c, s.x, s.y, s.s * (0.75 + 0.25 * Math.sin(t * 2.2 + s.ph)), 0.85);
}
// луна: золотой диск, тонкие лучи и кольца; dim — сколько тумана на ней
function moon(c, x, y, r, t, dim = 0, rays = 1) {
  c.save();

  if (dim > 0) { disk(c, x, y, r * 1.02); c.fillStyle = `rgba(150,165,190,${0.6 * dim})`; c.fill(); }

// туман — плывущая лента: голубовато-белая темпера, золотая кромка, белый блик
function fogRibbon(c, t, y, amp, speed, thick, phase, x0 = PIC.x - 60, x1 = PIC.x + PIC.w + 60, a = 0.9) {

    const w = y + amp * Math.sin(x * 0.0042 + phase + t * speed) + amp * 0.4 * Math.sin(x * 0.011 - t * speed * 1.6);
    const th = thick * (0.55 + 0.45 * Math.sin(x * 0.006 + phase * 1.7 + t * speed * 0.7)) * Math.pow(Math.sin(Math.PI * (x - x0) / (x1 - x0)), 0.7);

  c.restore();
}
function fogs(c, t, n = 3, a = 0.9) {

  for (const b of B) fogRibbon(c, t, ...b, PIC.x - 60, PIC.x + PIC.w + 60, a);
}

// ---------- Снега и ели ----------
const HILLS = [
  { y: HOR + 4, amp: 18, f: 0.0031, ph: 0.4, col: "#c9d3e2" },
  { y: HOR + 70, amp: 26, f: 0.0024, ph: 2.1, col: "#dfe4ec" },
  { y: HOR + 150, amp: 22, f: 0.0036, ph: 4.0, col: SNOW },
];
const hillY = (h, x, off = 0) => h.y + h.amp * Math.sin((x + off) * h.f + h.ph) + h.amp * 0.35 * Math.sin((x + off) * h.f * 2.7 + h.ph * 1.3);

  for (let k = 0; k < 4; k++) { const yy = -12 - k * 22, w = 34 - k * 7; poly(c, [[-w, yy], [w, yy], [0, yy - 34]]); paint(c, k % 2 ? FIR_L : FIR, 1.2); }

  c.restore();
}
// u — насколько проявились поляны (кисть идёт слева направо), off — сдвиг для движения
function glades(c, t, u = 1, off = 0, firs = 1, mx = 1380) {
  c.save();
  // дальний лес на горизонте
  c.beginPath(); c.moveTo(PIC.x - 10, HOR + 14);
  for (let x = PIC.x - 10; x <= PIC.x + PIC.w + 10; x += 12) { const k = Math.floor((x + off * 0.3) / 12), hh = 10 + 22 * hash(k, 11); c.lineTo(x, HOR + 8 - (k % 2 ? hh : hh * 0.35)); }
  c.lineTo(PIC.x + PIC.w + 10, HOR + 16); c.closePath(); paint(c, "#16301f", 1, GOLD_D);
  for (const h of HILLS) {
    const off2 = off * (0.35 + (h.y - HOR) / 400);
    const pts = []; for (let x = PIC.x - 60; x <= PIC.x + PIC.w + 60; x += 30) pts.push([x, hillY(h, x, off2)]);
    curve(c, pts); c.lineTo(PIC.x + PIC.w + 60, GROUND + 10); c.lineTo(PIC.x - 60, GROUND + 10); c.closePath();
    const g = c.createLinearGradient(0, h.y - h.amp, 0, h.y + 120); g.addColorStop(0, h.col); g.addColorStop(1, SNOW_SH);
    c.fillStyle = g; c.fill();
    curve(c, pts); gstroke(c, 1.8, GOLD);
    // пробела: тонкие золотые штрихи вдоль гребня
    for (let k = 1; k <= 3; k++) { curve(c, pts.map(([x, y]) => [x, y + k * 7])); c.globalAlpha = 0.55 - k * 0.13; gstroke(c, 1, GOLD_L); c.globalAlpha = 1; }

  }
  c.restore();

  if (u < 1) {
    const R = sstep(u) * 1900;
    c.save(); c.beginPath(); c.rect(PIC.x - 10, HOR - 40, PIC.w + 20, GROUND - HOR + 60); c.arc(mx, HOR - 20, Math.max(1, R), 0, TAU, true);

    if (R > 1) { c.beginPath(); c.rect(PIC.x - 10, HOR - 30, PIC.w + 20, GROUND - HOR + 40); c.clip(); disk(c, mx, HOR - 20, R); gstroke(c, 2.4, GOLD_L); }
    c.restore();
  }
}
// золотые лучи от луны к полянам
function moonBeams(c, mx, my, u) {

  c.save();
  for (let k = 0; k < 11; k++) {
    const a = lerp(-0.9, 0.6, k / 10), L = (HOR + 60 - my) / Math.cos(a) * sstep(u * 1.4 - k * 0.04);

// ---------- Дорога ----------
const ROAD = [[1520, HOR + 6], [1400, HOR + 40], [1180, HOR + 90], [920, HOR + 140], [640, HOR + 186], [380, HOR + 214], [100, HOR + 226]];
function road(c, u = 1) {

  const n = Math.max(2, Math.round(ROAD.length * u));
  c.save();
  for (const [dy, w] of [[-5, 4], [7, 6]]) { curve(c, ROAD.slice(0, n).map(([x, y], i) => [x, y + dy * (i / ROAD.length)])); gstroke(c, w * 0.6 + 1, "#7d8fb0"); }

// ---------- Конь в «летящем галопе» ----------
// корпус без шеи и шея с головой отдельно: голову можно повернуть вокруг основания шеи
const HORSE_BODY = [[30, -132], [0, -126], [-40, -126], [-72, -132], [-96, -124], [-108, -108], [-110, -90], [-104, -74], [-92, -62], [-70, -62], [-30, -58], [10, -58], [36, -62], [52, -68], [66, -80], [74, -98], [70, -118], [52, -132]];

// нога — плавный штрих: золотой контур под светлой темперой
function hleg(c, hx, hy, ang, bend, col, w = 1) {
  const L1 = 42, L2 = 46, kx = hx + Math.sin(ang) * L1, ky = hy + Math.cos(ang) * L1, a2 = ang + bend, fx = kx + Math.sin(a2) * L2, fy = ky + Math.cos(a2) * L2;

    c.beginPath(); c.moveTo(kx, ky); c.lineTo(fx, fy); gstroke(c, 6.5 * w + lw, cc);
  }
  c.save(); c.translate(fx, fy); c.rotate(-a2); c.fillStyle = INK; c.beginPath(); c.ellipse(0, 2, 5.5, 4, 0, 0, TAU); c.fill(); c.restore();
}
function horse(c, x, y, s, ph, gait = 1, col = WHITE, headTurn = 0) {

      const f = 0.5 + 0.5 * Math.sin(ph + (far ? 0.6 : 0));

  c.save(); curve(c, HORSE_BODY, true); c.clip();
  const g = c.createLinearGradient(0, -130, 0, -56); g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(1, "rgba(110,128,160,0.4)"); c.fillStyle = g; c.fillRect(-120, -140, 200, 90);
  c.restore();
  for (const [x0, y0, x1, y1] of [[-90, -100, -60, -112], [-30, -84, 10, -86], [30, -96, 56, -110]]) { c.beginPath(); c.moveTo(x0, y0); c.quadraticCurveTo((x0 + x1) / 2, (y0 + y1) / 2 - 8, x1, y1); gstroke(c, 1.1, GOLD); }

  for (let k = 0; k < 12; k++) { const a = k / 12 * TAU, r0 = k % 3 ? r - 14 : r - 26; c.beginPath(); c.moveTo(x + Math.sin(a) * r0, y - Math.cos(a) * r0); c.lineTo(x + Math.sin(a) * (r - 6), y - Math.cos(a) * (r - 6)); gstroke(c, k % 3 ? 3 : 6, INK); }
  if (trail > 0) { c.beginPath(); c.arc(x, y, r * 0.62, -Math.PI / 2, -Math.PI / 2 + trail * TAU); gstroke(c, 6, GOLD); }
  c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.sin(hAng) * r * 0.5, y - Math.cos(hAng) * r * 0.5); gstroke(c, 8, INK);
  c.beginPath(); c.moveTo(x, y); c.lineTo(x + Math.sin(mAng) * r * 0.8, y - Math.cos(mAng) * r * 0.8); gstroke(c, 5, INK);
  disk(c, x, y, 8); c.fillStyle = GOLD; c.fill();
}
function guest(c, x, y, s, kind, a) {
  if (a <= 0) return;
  c.save(); c.translate(x, y); c.scale(s, s); c.globalAlpha = a;
  if (kind === "hat") {
    poly(c, [[-14, 0], [-6, -46], [6, -46], [14, 0], [22, 0], [14, -60], [24, -64], [22, -96], [-22, -96], [-26, -60], [-36, -10], [-22, -40], [-22, 0]]); paint(c, INK, 1.4);
    disk(c, 0, -110, 15); paint(c, SKIN, 1.2); poly(c, [[-12, -120], [12, -120], [12, -158], [-12, -158]]); paint(c, INK, 1.2); poly(c, [[-19, -124], [19, -124], [19, -119], [-19, -119]]); paint(c, INK, 1);
  } else {
    poly(c, [[-36, 0], [36, 0], [16, -58], [18, -92], [-18, -92], [-16, -58]]); paint(c, BLUE, 1.4);
    disk(c, 0, -106, 14); paint(c, SKIN, 1.2); c.beginPath(); c.ellipse(-4, -112, 22, 20, 0, Math.PI * 0.9, Math.PI * 2.1); paint(c, OCHRE, 1.2);
  }
  c.restore();
}

// Расписание картин на крышке шкатулки. Времена — из timings.json через EV.
const E = EV;
const ctx = document.getElementById("scene").getContext("2d");

// ---------- 0. Титр: золотом пишется название ----------
const TROWS = [
  { text: "Зимняя дорога", px: 128, y: 330, a: 0.05, b: 2.3 },
  { text: "Александр Сергеевич Пушкин", px: 52, y: 430, a: 2.3, b: 3.7 },
  { text: "1826", px: 46, y: 500, a: 3.5, b: 4.1 },
];
function goldWrite(c, t, text, px, y, a, b, shine = true) {
  c.save(); c.font = FONT(px); const w = c.measureText(text).width, x0 = 960 - w / 2, u = sstep(prog(t, a, b)), X = x0 - 10 + (w + 20) * u;
  if (u <= 0) { c.restore(); return; }
  c.beginPath(); c.rect(x0 - 10, y - px * 1.1, X - x0 + 10, px * 1.5); c.clip();
  c.lineWidth = px * 0.06; c.strokeStyle = "rgba(0,0,0,0.6)"; c.lineJoin = "round"; c.strokeText(text, x0, y);
  c.fillStyle = goldGrad(c, 0, y - px * 0.75, 0, y + px * 0.1); c.fillText(text, x0, y);
  // блик бежит по буквам после написания
  if (shine) { const s = prog(t, b + 0.1, b + 1.1); if (s > 0 && s < 1) { const sx = lerp(x0 - 80, x0 + w + 80, s); const g = c.createLinearGradient(sx - 60, 0, sx + 60, 0); g.addColorStop(0, "rgba(255,248,220,0)"); g.addColorStop(0.5, "rgba(255,248,220,0.85)"); g.addColorStop(1, "rgba(255,248,220,0)"); c.globalCompositeOperation = "source-atop"; c.fillStyle = g; c.fillText(text, x0, y); c.globalCompositeOperation = "source-over"; } }
  c.restore();
  if (u < 1) sparkle(c, X, y - px * 0.35, px * 0.18, 1);
}
function sceneTitle(c, t) {
  for (const r of TROWS) goldWrite(c, t, r.text, r.px, r.y, r.a, r.b);
  const k = sstep(prog(t, 0.9, 2.0));
  if (k > 0) { c.save(); c.globalAlpha = k; c.beginPath(); c.moveTo(960 - 260 * k, 372); c.lineTo(960 + 260 * k, 372); gstroke(c, 2, GOLD); scroll(c, 960 - 260 * k - 16, 372, 14, 0, -1, 1.2, 2); scroll(c, 960 + 260 * k + 16, 372, 14, Math.PI, 1, 1.2, 2); sparkle(c, 960, 372, 10, 1); c.restore(); }
}

// ---------- 1. Сквозь волнистые туманы пробирается луна ----------
const M1 = (t) => ({ x: 1380, y: lerp(360, 170, sstep(prog(t, E.L2 - 0.4, E.E2 + 0.3))), r: 52 });
function scene1(c, t) {
  sky(c, t); const m = M1(t);
  moon(c, m.x, m.y, m.r, t, 0, sstep(prog(t, E.E2 - 0.4, E.E2 + 0.8)));
  fogs(c, t, 3, 0.92);
  glades(c, t, prog(t, E.w_pol - 0.3, E.w_pol + 1.6), 0, 1, M1(t).x);
  moonBeams(c, m.x, m.y, sstep(prog(t, E.w_lyet - 0.2, E.w_lyet + 1.3)));
}

// ---------- 2. По дороге зимней, скучной тройка борзая бежит ----------
const MOON = { x: 1380, y: 170, r: 52 };
const TR2 = (t) => ({ x: lerp(-200, 900, springSoft(prog(t, E.w_troi - 0.5, E.w_troi + 2.0) * 2.5)) + 26 * Math.sin(t * 0.7), y: GROUND - 30, s: 0.82 });
const scroll2 = (t) => (t - E.sw1a) * 200;
function scene2(c, t) {
  sky(c, t); moon(c, MOON.x, MOON.y, MOON.r, t);
  fogs(c, t, 2, 0.85);
  glades(c, t, 1, scroll2(t) * 0.6);
  road(c, sstep(prog(t, E.w_dor - 0.4, E.w_dor + 1.0)));
  if (t > E.w_troi - 0.5) {
    const p = TR2(t), ph = t * TAU * 1.7;
    hoofSnow(c, t, p.x, p.y, p.s, E.w_troi - 0.5, E.tx2 + 2, 51);
    troika(c, p.x, p.y, p.s, ph, 1, 0, sstep(prog(t, E.w_kol - 0.2, E.w_kol + 0.3)), t);
    if (t > E.w_kol - 0.1) soundRings(c, t, p.x + 58 * p.s, p.y - 184 * p.s, E.w_kol - 0.1, E.tx2 + 1.5, 0.55, 120, 1);
  }
}

// ---------- 3. Что-то слышится родное в долгих песнях ямщика ----------
const M3 = { x: 1300, y: 330, r: 100 };
function scene3(c, t) {
  sky(c, t); moon(c, M3.x, M3.y, M3.r, t);
  fogs(c, t, 2, 0.8);
  glades(c, t, 1, scroll2(t) * 0.6);
  const sing = bump(t, E.L9 - 0.2, E.E12 + 0.3, 0.3);
  const u = sstep(prog(t, E.w_pes - 0.5, E.w_pes + 2.2));
  const curl = sstep(prog(t, E.w_raz - 0.25, E.w_raz + 0.7)) * (1 - sstep(prog(t, E.w_tos - 0.6, E.w_tos)));
  const droop = sstep(prog(t, E.w_tos - 0.5, E.w_tos + 1.2));
  songRibbons(c, t, 1250, 410, u, curl, droop);
  if (curl > 0) for (let i = 0; i < 30; i++) { const a = t * (1.6 + hash(i, 3)) + i, rr = 40 + 110 * hash(i, 4); sparkle(c, 420 + 300 * hash(i, 5) + Math.cos(a) * rr, 260 + 80 * hash(i, 6) + Math.sin(a) * rr * 0.6, 6, curl); }
  const hu = sstep(prog(t, E.w_tos - 0.2, E.w_tos + 0.6)), hk = sstep(prog(t, E.E12 + 0.1, E.E12 + 1.2));
  if (hu > 0 && hk < 1) {
    c.save(); c.globalAlpha = hu * (1 - hk); heart(c, 560, 280 + 30 * hk, 110 * (0.6 + 0.4 * hu)); paint(c, RED, 3, GOLD); c.restore();
    if (hk > 0) particles(t, E.E12 + 0.1, E.E12 + 1.2, 120, (i, bt, r) => { const a = r(1) * TAU; return { x: 560 + Math.cos(a) * 70, y: 270 + Math.sin(a) * 55, vx: 20 * (r(2) - 0.5), vy: 30, g: 200, life: 0.9, s: 5 + 4 * r(3) }; }, 33, (x, y, k, p) => sparkle(c, x, y, p.s, 1 - k));
  }
  driverBig(c, 1360, GROUND + 50, 0.86, t, sing);
}

// ---------- 4. Ни огня, ни чёрной хаты… только вёрсты полосаты ----------
const M4 = { x: 1560, y: 150, r: 40 };
function scene4(c, t) {
  sky(c, t); moon(c, M4.x, M4.y, M4.r, t);
  fogs(c, t, 2, 0.75);
  glades(c, t, 1);
  const f = bump(t, E.w_ogn - 0.05, E.w_ogn + 1.05, 0.2);
  if (f > 0) { const g = c.createRadialGradient(600, HOR + 2, 2, 600, HOR + 2, 70 * f); g.addColorStop(0, `rgba(255,214,120,${f})`); g.addColorStop(1, "rgba(255,170,60,0)"); c.fillStyle = g; disk(c, 600, HOR + 2, 70 * f); c.fill(); sparkle(c, 600, HOR + 2, 16 * f, f); }
  const ha = sstep(prog(t, E.w_hat - 0.25, E.w_hat + 0.25)) * (1 - sstep(prog(t, E.w_hat + 0.55, E.w_hat + 1.5)));
  hut(c, 1150, HOR + 120, 0.85, ha);
  if (t > E.w_hat + 0.5) particles(t, E.w_hat + 0.5, E.w_hat + 1.5, 120, (i, bt, r) => ({ x: 1150 - 70 + 140 * r(1), y: HOR + 120 - 120 * r(2), vx: 20 * (r(3) - 0.3), vy: -20, g: -30, life: 0.9, s: 5 + 4 * r(4) }), 44, (x, y, k, p) => sparkle(c, x, y, p.s, 1 - k));
  particles(t, E.w_sneg - 1.5, E.tx4 + 3, 60, (i, bt, r) => ({ x: PIC.x + (PIC.w + 200) * r(1), y: PIC.y - 10, vx: -30 - 30 * r(2), vy: 60 + 60 * r(3), life: 8, s: 3 + 3 * r(4), gold: r(5) > 0.7 }), 45,
    (x, y, k, p) => { if (p.gold) sparkle(c, x, y, p.s * 1.6, 1); else { c.fillStyle = "#ffffff"; disk(c, x, y, p.s * 0.6); c.fill(); } });
  if (t > E.w_vyo - 0.6) for (let k = 0; k < 4; k++) { const x = 2000 - (t - (E.w_vyo - 0.6)) * 520 + k * 900; if (x > PIC.x - 60 && x < PIC.x + PIC.w + 60) verst(c, x, GROUND - 14, 0.9); }
}

// ---------- 5. Завтра, Нина… я забудусь у камина ----------
function scene5(c, t) {
  const lit = sstep(prog(t, E.w_zav - 0.3, E.w_zav + 0.9));
  room(c, t, lit);
  fireplace(c, t, springSoft(prog(t, E.sw4a, E.sw4b + 0.6) * 1.6), bump(t, E.w_kam - 0.1, E.w_kam + 1.8, 0.4), lerp(0.08, 1, lit));
  const n = sstep(prog(t, E.w_nin - 0.1, E.w_nin + 0.7)), p = sstep(prog(t, E.w_zag - 0.1, E.w_zag + 0.7));
  bust(c, 1500, GROUND - 96 + 30 * (1 - n), 1.12, -1, "nina", n);
  bust(c, 420, GROUND - 96 + 30 * (1 - p), 1.12, 1, "poet", p);
}

// ---------- 6. Звучно стрелка часовая мерный круг свой совершит ----------
const CL = { x: 960, y: 160, r: 66 };
function clockAt(t) {
  const loop = sstep(prog(t, E.w_kru - 0.2, E.E22 + 0.2));
  return { m: -TAU * 0.12 - TAU + TAU * loop + TAU * 0.12 * sstep(prog(t, E.L23, E.w_pol2)), h: lerp(-0.42, 0, sstep(prog(t, E.L21, E.w_pol2))), trail: loop * (1 - sstep(prog(t, E.E22 + 0.2, E.E22 + 1.2))) };
}
function scene6(c, t, withClock = true) {
  room(c, t, 1);
  fireplace(c, t, 1, 0, 1);
  bust(c, 1500, GROUND - 96, 1.12, -1, "nina", 1);
  bust(c, 420, GROUND - 96, 1.12, 1, "poet", 1);
  const gu = prog(t, E.w_dok - 0.1, E.w_dok + 1.1);
  for (const [i, x, kind] of [[0, 712, "hat"], [1, 1208, "bon"]]) {
    const k = sstep(gu * 1.3 - i * 0.2); if (k >= 1) continue;
    guest(c, x, GROUND - 60 - 20 * k, 1.1, kind, 1 - k);
  }
  if (gu > 0) particles(t, E.w_dok - 0.1, E.w_dok + 1.1, 160, (j, bt, r) => { const right = r(6) > 0.5, x = right ? 1208 : 712; return { x: x - 30 + 60 * r(1), y: GROUND - 60 - 170 * r(2), vx: (right ? 1 : -1) * (180 + 260 * r(3)), vy: -40 - 70 * r(4), life: 0.9, s: 5 + 5 * r(5) }; }, 61, (x, y, k, p) => sparkle(c, x, y, p.s, 1 - k));
  if (withClock) {
    const k = springPop(prog(t, E.sw5a, E.sw5b + 0.4) * 1.6), s = clockAt(t);
    if (k > 0.01) {
      c.save(); c.translate(CL.x, CL.y + 96); c.scale(k, k); c.translate(-CL.x, -CL.y - 96);
      poly(c, [[CL.x - 96, CL.y + 96], [CL.x + 96, CL.y + 96], [CL.x + 80, CL.y + 30], [CL.x - 80, CL.y + 30]]); c.fillStyle = goldGrad(c, CL.x - 96, CL.y, CL.x + 96, CL.y + 96); c.fill(); gstroke(c, 1.4, GOLD_D);
      clockFace(c, CL.x, CL.y, CL.r, s.m, s.h, s.trail);
      c.restore();
    }
    if (t > E.w_pol2 - 0.1) for (let i = 0; i < 3; i++) { const a = t - E.w_pol2 - i * 0.35; if (a < 0 || a > 1.2) continue; c.save(); c.globalAlpha = 1 - a / 1.2; disk(c, CL.x, CL.y, CL.r + 28 + 140 * a / 1.2); gstroke(c, 3 * (1 - a / 1.2) + 1, GOLD_L); c.restore(); }
  }
}

// ---------- 7. Грустно, Нина: путь мой скучен… отуманен лунный лик ----------
const M7 = { x: 1560, y: 150, r: 48 };
const TR7 = (t) => {
  const f = sstep(prog(t, E.en7 + 0.4, E.total - 0.6));
  return { x: lerp(900, 1330, f) + 20 * Math.sin(t * 0.5), y: lerp(GROUND - 30, HOR + 44, Math.pow(f, 0.8)), s: lerp(0.74, 0.13, Math.pow(f, 0.7)) };
};
function scene7(c, t, withMoon = true) {
  sky(c, t);
  const dim = sstep(prog(t, E.w_otu - 0.2, E.w_otu + 1.4)) * 0.7;
  if (withMoon) moon(c, M7.x, M7.y, M7.r, t, dim, 1 - dim);
  fogs(c, t, 2, 0.8);
  const fz = sstep(prog(t, E.w_otu - 0.4, E.w_otu + 1.6));
  if (fz > 0 && withMoon) { fogRibbon(c, t, M7.y + 64 - 60 * fz, 8, 0.2, 30, 1.1, M7.x - 200, M7.x + 300, 0.9 * fz); fogRibbon(c, t, M7.y + 26 - 44 * fz, 6, -0.15, 22, 2.4, M7.x - 150, M7.x + 260, 0.75 * fz); }
  glades(c, t, 1, (t - E.sw6a) * 60);
  road(c, 1);
  const p = TR7(t), ph = t * TAU * 0.95;
  const nod = sstep(prog(t, E.w_dre - 0.1, E.w_dre + 0.9)) * (0.85 + 0.15 * Math.sin(t * 1.3));
  troika(c, p.x, p.y, p.s, ph, 0, nod, 0.5 * sstep(prog(t, E.w_kol2 - 0.2, E.w_kol2 + 0.3)), t * 0.6);
  if (t > E.w_kol2 - 0.1 && t < E.tx7 + 1.5) soundRings(c, t, p.x + 58 * p.s, p.y - 184 * p.s, E.w_kol2 - 0.1, E.tx7 + 0.3, 0.9, 80, 0.6);
}

// ---------- Финал: название золотом в небе, автор — на плашке ----------
function finalText(c, t) {
  const a = E.en7 + 1.0;
  if (t < a) return;
  c.save(); picPath(c); c.clip(); goldWrite(c, t, "Зимняя дорога", 112, 230, a, a + 1.3); c.restore();
  goldWrite(c, t, "Александр Сергеевич Пушкин · 1826", 46, 880, a + 0.9, a + 2.2, false);
}

// ---------- Кадр ----------
const MORPH = (t) => { const u = sstep(prog(t, E.sw6a, E.sw6b)); return { x: lerp(CL.x, M7.x, u), y: lerp(CL.y, M7.y, u), r: lerp(CL.r, M7.r, u) }; };
function drawScene(c, t) {
  if (t < E.sw1a) return sweep(c, t, E.sw0a, E.sw0b, sceneTitle, scene1, 1);
  if (t < E.sw2a) return sweep(c, t, E.sw1a, E.sw1b, scene1, scene2, 2);
  if (t < E.sw3a) return sweep(c, t, E.sw2a, E.sw2b, scene2, scene3, 3);
  if (t < E.sw4a) return sweep(c, t, E.sw3a, E.sw3b, scene3, scene4, 4);
  if (t < E.sw5a) return sweep(c, t, E.sw4a, E.sw4b, scene4, scene5, 5);
  if (t < E.sw6a) return sweep(c, t, E.sw5a, E.sw5b, scene5, scene6, 6);
  if (t < E.sw6b) {
    sweep(c, t, E.sw6a, E.sw6b, (cc, tt) => scene6(cc, tt, false), (cc, tt) => scene7(cc, tt, false), 7);
    const m = MORPH(t), u = prog(t, E.sw6a, E.sw6b);
    if (u < 0.5) clockFace(c, m.x, m.y, m.r, 0, 0, 0); else moon(c, m.x, m.y, m.r, t, 0, (u - 0.5) * 2);
    return;
  }
  return scene7(c, t);
}
function renderAt(t) {
  t = clamp(t, 0, TOTAL - 1e-3);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(BG, 0, 0);
  ctx.save(); picPath(ctx); ctx.clip(); drawScene(ctx, t); ctx.restore();
  drawFrame(ctx, t);
  goldText(ctx, t);
  finalText(ctx, t);
}

let lastT = 0;
const seek = (t) => { lastT = t; renderAt(t); };
window.addEventListener("hf-seek", (e) => seek(e.detail.time));
seek(0);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { LAYOUT = null; seek(lastT); });

const tl = gsap.timeline({ paused: true });
tl.set({}, {}, TOTAL);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
