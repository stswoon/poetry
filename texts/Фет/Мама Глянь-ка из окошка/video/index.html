const W = 1920, H = 1080, TOTAL = CFG.total, E = CFG.ev, TAU = Math.PI * 2;

function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const sstep = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };
const prog = (t, a, b) => clamp((t - a) / Math.max(1e-6, b - a), 0, 1);
const win = (t, a, b, fi = 0.25, fo = 0.25) => Math.min(sstep(prog(t, a, a + fi)), 1 - sstep(prog(t, b - fo, b)));
const easeOut = (u) => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
const easeIn = (u) => Math.pow(clamp(u, 0, 1), 3);
const easeInOut = (u) => { u = clamp(u, 0, 1); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
// пружины Framer Motion как функции времени: 0 → 1 с перелётом
function makeSpring(opts) {
  const g = Motion.spring({ ...opts, keyframes: [0, 1] });
  const pts = []; for (let i = 0; i <= 400; i++) pts.push(g.next(i * 10).value);
  return (s) => { if (s <= 0) return 0; const f = s * 100; if (f >= 400) return 1; const i = Math.floor(f); return lerp(pts[i], pts[i + 1], f - i); };
}

const ring = (t, a, f = 9, d = 1.2) => { const s = t - a; return s <= 0 ? 0 : Math.sin(s * f) * Math.exp(-s * 3.2 / d); };

// двухзвенная IK: от a к цели b, длины l1, l2; bend = +1/−1 — в какую сторону сгиб
function ik(a, b, l1, l2, bend) {
  let dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy);
  const dd = clamp(d, Math.abs(l1 - l2) + 0.01, l1 + l2 - 0.01);
  if (d < 1e-6) { dx = 0; dy = 1; d = 1; }
  const ux = dx / d, uy = dy / d, ex = a[0] + ux * dd, ey = a[1] + uy * dd;
  const x = (l1 * l1 - l2 * l2 + dd * dd) / (2 * dd), h = Math.sqrt(Math.max(0, l1 * l1 - x * x));
  return { mid: [a[0] + ux * x - uy * h * bend, a[1] + uy * x + ux * h * bend], end: [ex, ey] };

// ---------- мел на доске ----------
// Рисунок кладётся на прозрачный слой обычными штрихами, потом слой умножается на маску зерна (destination-in):
// так у любой линии и буквы рваный меловой край. Мел «дышит»: дрожание точек меняется BOIL_FPS раз в секунду.
const BOIL_FPS = 10;
let BOIL = 0;
let GA = 1;   // общая прозрачность героя: умножается на прозрачность каждого штриха

const BOARD = "#2b4a3d";

function makeCanvas(w, h) { const cv = document.createElement("canvas"); cv.width = w; cv.height = h; return cv; }

// бесшовная плитка: рисуем пятно и его копии через края
function wrapDraw(size, x, y, r, fn) {
  for (const dx of [-size, 0, size]) for (const dy of [-size, 0, size]) {
    if (x + dx + r < 0 || x + dx - r > size || y + dy + r < 0 || y + dy - r > size) continue;
    fn(x + dx, y + dy);
  }
}

let BOARD_TILE = null, GRAIN_W = null, GRAIN_S = null;
function buildBoard() {
  const S = 1024, cv = makeCanvas(S, S), c = cv.getContext("2d"), R = mulberry32(7);
  c.fillStyle = BOARD; c.fillRect(0, 0, S, S);
  // крупные пятна: доска неровно тёмная
  for (let i = 0; i < 46; i++) {
    const x = R() * S, y = R() * S, r = 120 + R() * 300, light = R() < 0.55;
    wrapDraw(S, x, y, r, (px, py) => {
      const g = c.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, light ? "rgba(200,225,210,0.07)" : "rgba(10,25,18,0.12)"); g.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = g; c.fillRect(px - r, py - r, r * 2, r * 2);
    });
  }
  // следы губки: широкие дуги стёртого мела
  c.lineCap = "round";
  for (let i = 0; i < 30; i++) {
    const x = R() * S, y = R() * S, r = 90 + R() * 220, a0 = R() * TAU, da = 0.6 + R() * 1.4;
    wrapDraw(S, x, y, r + 60, (px, py) => {
      c.strokeStyle = `rgba(235,240,232,${0.018 + R() * 0.03})`; c.lineWidth = 40 + R() * 70;
      c.beginPath(); c.arc(px, py, r, a0, a0 + da); c.stroke();
    });
  }
  // призраки старых надписей
  for (let i = 0; i < 70; i++) {
    const x = R() * S, y = R() * S, len = 10 + R() * 40;
    wrapDraw(S, x, y, len, (px, py) => {
      c.strokeStyle = `rgba(240,240,230,${0.03 + R() * 0.04})`; c.lineWidth = 2 + R() * 3;
      c.beginPath(); c.moveTo(px, py); c.quadraticCurveTo(px + len * 0.5, py - 10 + R() * 20, px + len, py + R() * 8 - 4); c.stroke();
    });
  }
  // мелкий шум
  const im = c.getImageData(0, 0, S, S), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (R() - 0.5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  c.putImageData(im, 0, 0);
  BOARD_TILE = cv;
}

// маска зерна: в основном непрозрачная, с продолговатыми «дырками», как мел на шершавой доске
function buildGrain(seed, holes, base, size = 512) {
  const cv = makeCanvas(size, size), c = cv.getContext("2d"), R = mulberry32(seed);
  const im = c.createImageData(size, size), d = im.data, A = new Float32Array(size * size);
  for (let i = 0; i < A.length; i++) A[i] = base + (1 - base) * R();
  for (let k = 0; k < holes; k++) {
    const x0 = R() * size, y0 = R() * size, len = 1.5 + R() * 6, wd = 0.6 + R() * 1.1, ang = -0.35 + (R() - 0.5) * 0.9, depth = 0.25 + R() * 0.65;
    const ca = Math.cos(ang), sa = Math.sin(ang), rr = Math.ceil(len + 2);
    for (let dy = -rr; dy <= rr; dy++) for (let dx = -rr; dx <= rr; dx++) {
      const u = (dx * ca + dy * sa) / len, v = (-dx * sa + dy * ca) / wd, q = u * u + v * v;
      if (q > 1) continue;
      const xi = ((Math.round(x0 + dx) % size) + size) % size, yi = ((Math.round(y0 + dy) % size) + size) % size, j = yi * size + xi;
      A[j] *= 1 - depth * (1 - q);
    }
  }
  for (let i = 0; i < A.length; i++) { d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = 255; d[i * 4 + 3] = Math.round(clamp(A[i], 0, 1) * 255); }
  c.putImageData(im, 0, 0);
  return cv;
}

function buildChalk() {

// ---------- штрих ----------
const jit = (seed, i, amp) => (hash(seed * 13.7 + i * 7.31 + BOIL * 1.913) - 0.5) * 2 * amp;
// обрезать ломаную по доле длины (мел «дописывает» линию)
function trunc(P, u) {
  if (u >= 1) return P; if (u <= 0) return [];
  let L = 0; const seg = [];
  for (let i = 1; i < P.length; i++) { const l = Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]); seg.push(l); L += l; }
  let left = L * u; const out = [P[0]];
  for (let i = 1; i < P.length; i++) {
    if (left >= seg[i - 1]) { out.push(P[i]); left -= seg[i - 1]; continue; }
    const k = left / Math.max(1e-6, seg[i - 1]); out.push([lerp(P[i - 1][0], P[i][0], k), lerp(P[i - 1][1], P[i][1], k)]); break;
  }

    const st = s.steam || 0;
    for (let i = 0; i < 2; i++) {
      const x0 = h[0] + 6 + i * 10, P = [];
      for (let k = 0; k < 6; k++) P.push([x0 + Math.sin(st * 3 + k * 1.2 + i) * 5, h[1] - 32 - k * 9]);
      chalkLine(c, P, 2.5, OUT, { seed: sd + 21 + i, alpha: 0.5 });
    }
  }
  GA = ga0; c.restore();
}

// ===== кошка (сидит боком, лицом вправо) =====
// s: {x, y, sc, face, wash (0…1 фаза умывания), wag, blink, lick (лапа у рта 0/1)}
function drawCat(c, s) {
  const sd = 900;
  c.save(); c.translate(s.x, s.y); c.scale(s.sc * (s.face || 1), s.sc); const ga0 = GA; GA *= s.alpha ?? 1;
  const col = CH.ochre;
  // хвост по полу и вверх
  const wg = s.wag || 0;
  chalkLine(c, curve([[-50, -6], [-90, -4], [-118, -18 + wg * 6], [-122 - wg * 8, -48 + wg * 4]], 5), 15, col, { seed: sd + 1 });
  // туловище-груша и бедро
  const body = [[-56, -4], [-62, -40], [-40, -78], [-6, -98], [26, -96], [36, -70], [30, -30], [24, -4]];
  chalkShape(c, curve(body, 3, true), col, OUT, LWD, { seed: sd + 4, sp: 8, ang: -0.9, base: 0.4 });
  chalkLine(c, curve([[-50, -8], [-56, -38], [-30, -52], [-8, -30], [-6, -6]], 4), 4, OUT, { seed: sd + 5 });
  for (let i = 0; i < 3; i++) chalkLine(c, [[-46 + i * 12, -70 + i * 4], [-36 + i * 12, -58 + i * 4]], 5, CH.brown, { seed: sd + 6 + i });
  chalkShape(c, ellPts(-22, -4, 16, 6, 0, 10), col, OUT, 3, { seed: sd + 9, base: 0.6 });
  // дальняя передняя лапа: от груди к полу, чуть впереди ближней
  const leg = (P0, sd0) => { chalkLine(c, P0, 18, OUT, { seed: sd0, jit: 0.6 }); chalkLine(c, P0, 11, col, { seed: sd0 + 1, jit: 0.6 }); };
  leg([[24, -62], [40, -32], [52, -8]], sd + 2);
  chalkShape(c, ellPts(56, -6, 12, 6, 0, 10), col, OUT, 3, { seed: sd + 3, base: 0.6 });
  // голова: при умывании наклоняется к лапе
  const w = s.wash || 0, lick = s.lick || 0;
  const hc = [30 + lick * 4, -118 + lick * 10], ht = -0.15 + lick * 0.25;
  const hp = (p) => add(hc, rot(p, ht));
  chalkShape(c, [hp([-26, -14]), hp([-20, -48]), hp([-4, -24])], col, OUT, 4, { seed: sd + 10, base: 0.6 });
  chalkShape(c, [hp([6, -26]), hp([22, -50]), hp([26, -16])], col, OUT, 4, { seed: sd + 11, base: 0.6 });
  chalkShape(c, ellPts(hc[0], hc[1], 34, 30, ht, 24), col, OUT, LWD, { seed: sd + 12, sp: 7, base: 0.45 });
  chalkFill(c, [hp([16, -40]), hp([20, -46]), hp([22, -36])], CH.pink, { base: 0.9 });
  const ey = (p) => { const q = hp(p); if (s.blink > 0.5 || lick > 0.5) chalkLine(c, curve([[q[0] - 6, q[1]], [q[0], q[1] + 3], [q[0] + 6, q[1]]], 3), 3, OUT, { seed: sd + 13 }); else chalkDot(c, q[0], q[1], 4.5, CH.green); };
  ey([6, -6]); ey([24, -8]);
  const ns = hp([32, 4]);
  chalkDot(c, ns[0], ns[1], 4, CH.pink);
  for (let i = -1; i <= 1; i += 2) chalkLine(c, [hp([28, 10]), hp([54, 8 + i * 8])], 2, OUT, { seed: sd + 14 + i, alpha: 0.7 });
  if (lick > 0.5) chalkShape(c, ellPts(...hp([30, 16]), 5, 4, 0, 10), CH.pink, CH.pink, 2, { base: 0.9 });
  // ближняя передняя лапа: от плеча к цели (у рта или у носа); локоть смотрит назад-вниз
  // плечо → локоть вниз (не вперёд) → лапа к цели
  const sh = [14, -80], el = [20, -44];
  const paw = s.paw || [34, -8];
  leg([sh, el, paw], sd + 16);
  chalkShape(c, ellPts(paw[0] + 4, paw[1], 11, 7, 0, 12), col, OUT, 3, { seed: sd + 17, base: 0.6 });
  GA = ga0; c.restore();
}

// ===== рука с мелком («кто-то тороватый») =====
// tip — кончик мелка в мировых координатах; ang — наклон руки; рукав уходит за край кадра вверх-вправо
function drawHand(c, tip, ang = 0, sc = 1, holding = "chalk", alpha = 1) {

  else chalkShape(c, cloudPts(0, -8, 46, 38, 7, 3), CH.white, CH.white, 3, { seed: sd + 3, base: 0.8, sp: 5, ang: 0.7 });
  // ладонь и пальцы
  const palm = [[40, -46], [72, -84], [120, -110], [170, -90], [180, -40], [140, -10], [90, -10], [56, -24]];

  chalkLine(c, curve([[64, -78], [40, -64], [28, -46]], 4), 12, CH.skin, { seed: sd + 6 });                        // большой
  chalkLine(c, curve([[54, -40], [30, -38], [22, -22], [38, -14], [70, -22]], 4), 2.5, OUT, { seed: sd + 7, alpha: 0.6 });
  chalkLine(c, curve([[90, -12], [76, 4], [96, 10], [120, -6]], 4), 12, CH.skin, { seed: sd + 8 });
  GA = ga0; c.restore();
}

// ---------- комната и двор ----------
// Комната: мир 1920×1080, пол y = FLOOR. Окно — 16:9, через него виден двор с текущей камерой двора.
const FLOOR = 792;
const WIN = { x: 452, y: 236, w: 544, h: 306 };          // проём окна (16:9)
const DOOR = { x: 1500, y: 300, w: 230, h: FLOOR - 300 };
const GROUND = 690;                                       // земля во дворе

// доля нарисованного: мел дописывает элемент от a до b
const drawn = (t, a, d = 0.6) => sstep(prog(t, a, a + d));

function drawRoom(c, t, R) {
  const p0 = R.sketch;  // 0…1 — комната дорисовывается в начале
  // пол
  chalkLine(c, curve([[-400, FLOOR + 4], [300, FLOOR - 2], [900, FLOOR + 3], [1500, FLOOR - 1], [2400, FLOOR + 2]], 6), 6, CH.white, { seed: 11, prog: p0 });
  for (let i = 0; i < 9; i++) chalkLine(c, [[-200 + i * 260, FLOOR + 10], [-260 + i * 260, FLOOR + 40]], 3, CH.brown, { seed: 12 + i, alpha: 0.6 * p0 });
  // обои: редкие ромбики
  for (let i = 13; i < 26; i++) {   // только нижний ряд: верх стены свободен под заголовок
    const x = 80 + (i % 13) * 150 + (Math.floor(i / 13) % 2) * 75, y = 120 + Math.floor(i / 13) * 300;
    if (x > WIN.x - 40 && x < WIN.x + WIN.w + 40 && y > WIN.y - 40) continue;
    if (x > DOOR.x - 30 && x < DOOR.x + DOOR.w + 30 && y > DOOR.y - 30) continue;
    chalkLine(c, [[x, y - 12], [x + 9, y], [x, y + 12], [x - 9, y], [x, y - 12]], 2.5, CH.violet, { seed: 30 + i, alpha: 0.4 * p0 });
  }
  // дверь
  const d = DOOR;
  chalkShape(c, [[d.x, d.y + d.h], [d.x, d.y], [d.x + d.w, d.y], [d.x + d.w, d.y + d.h]], CH.brown, CH.ochre, 6,
             { seed: 60, sp: 12, ang: -1.5, base: 0.22, hatch: 0.45, prog: p0, alpha: p0 });
  chalkLine(c, [[d.x + 26, d.y + 30], [d.x + d.w - 26, d.y + 30], [d.x + d.w - 26, d.y + 200], [d.x + 26, d.y + 200], [d.x + 26, d.y + 30]], 3, CH.ochre, { seed: 61, alpha: 0.7 * p0 });
  chalkDot(c, d.x + d.w - 30, d.y + 270, 9, CH.yellow, p0);
  // вешалка выше головы мамы: шапка, шарф и пальто девочки (в них она катается на горке)
  chalkLine(c, [[d.x - 170, 236], [d.x - 20, 236]], 6, CH.ochre, { seed: 62, prog: p0 });
  if (!R.hatGone) {
    chalkShape(c, curve([[d.x - 150, 240], [d.x - 156, 300], [d.x - 128, 330], [d.x - 100, 300], [d.x - 104, 240]], 3, true), CH.red, OUT, 3, { seed: 65, alpha: p0, base: 0.5 });
    chalkShape(c, curve([[d.x - 90, 244], [d.x - 86, 270], [d.x - 72, 290], [d.x - 52, 270], [d.x - 50, 244]], 3, true), CH.blue, OUT, 3, { seed: 63, alpha: p0, base: 0.5 });
    chalkLine(c, [[d.x - 40, 240], [d.x - 36, 300], [d.x - 30, 336]], 12, CH.yellow, { seed: 64, prog: p0 });
  }
  // окно: проём, рама, подоконник, занавески
  drawWindowFrame(c, t, R);
}

function drawWindowFrame(c, t, R) {
  const p0 = R.sketch, w = WIN, fa = R.frameAlpha ?? 1;
  const x0 = w.x, y0 = w.y, x1 = w.x + w.w, y1 = w.y + w.h;
  // рама
  chalkLine(c, [[x0 - 14, y1 + 2], [x0 - 14, y0 - 14], [x1 + 14, y0 - 14], [x1 + 14, y1 + 2]], 12, CH.ochre, { seed: 70, prog: p0, alpha: fa });
  chalkLine(c, [[x0, y1], [x0, y0], [x1, y0], [x1, y1], [x0, y1]], 4, CH.white, { seed: 71, prog: p0, alpha: fa });
  // переплёт крестом (бледнеет, когда камера пролетает сквозь окно)
  const ca = fa * (R.crossAlpha ?? 1);
  chalkLine(c, [[(x0 + x1) / 2, y0], [(x0 + x1) / 2, y1]], 7, CH.ochre, { seed: 72, prog: p0, alpha: ca });
  chalkLine(c, [[x0, y0 + w.h * 0.36], [x1, y0 + w.h * 0.36]], 7, CH.ochre, { seed: 73, prog: p0, alpha: ca });
  // подоконник
  chalkShape(c, [[x0 - 40, y1], [x1 + 40, y1], [x1 + 30, y1 + 26], [x0 - 30, y1 + 26]], CH.ochre, CH.white, 4, { seed: 74, sp: 7, base: 0.4, alpha: fa * p0 });
  // горшок с цветком на подоконнике
  const fx = x0 + 70;
  chalkShape(c, [[fx - 26, y1 - 46], [fx + 26, y1 - 46], [fx + 18, y1], [fx - 18, y1]], CH.red, OUT, 3, { seed: 75, base: 0.5, alpha: fa * p0 });
  chalkLine(c, curve([[fx, y1 - 46], [fx - 4, y1 - 80], [fx + 4, y1 - 110]], 4), 4, CH.green, { seed: 76, alpha: fa * p0 });
  chalkShape(c, ellPts(fx + 4, y1 - 120, 16, 14, 0, 12), CH.pink, OUT, 3, { seed: 77, base: 0.6, alpha: fa * p0 });
  chalkShape(c, ellPts(fx + 22, y1 - 84, 16, 7, -0.5, 12), CH.green, null, 3, { seed: 78, base: 0.6, alpha: fa * p0 });
  // занавески, собранные по бокам
  const cur = (sx, s) => {
    const P = [[sx, y0 - 30], [sx + s * 70, y0 - 30], [sx + s * 40, y0 + 120], [sx + s * 64, y1 + 10], [sx, y1 + 20]];
    chalkShape(c, curve(P, 3, true), CH.pink, OUT, 4, { seed: 79 + s, sp: 9, ang: 1.3, base: 0.3, alpha: fa * p0 });
    chalkLine(c, [[sx, y0 + 130], [sx + s * 46, y0 + 120]], 6, CH.yellow, { seed: 81 + s, alpha: fa * p0 });
  };
  cur(x0 - 74, 1); cur(x1 + 74, -1);
  chalkLine(c, [[x0 - 100, y0 - 34], [x1 + 100, y0 - 34]], 6, CH.brown, { seed: 83, prog: p0, alpha: fa });
}

// облачко мысли: кружки-ступеньки от головы и облако
function cloudPts(cx, cy, rx, ry, n = 9, seed = 1) {
  const P = [], Rn = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const a0 = (i / n) * TAU, a1 = ((i + 1) / n) * TAU, bx = cx + Math.cos((a0 + a1) / 2) * rx, by = cy + Math.sin((a0 + a1) / 2) * ry;
    const r = (Math.hypot(Math.cos(a0) * rx - Math.cos(a1) * rx, Math.sin(a0) * ry - Math.sin(a1) * ry) / 2) * (1.05 + Rn() * 0.2);
    const ang = Math.atan2(by - cy, bx - cx);
    for (let k = 0; k <= 6; k++) { const a = ang - Math.PI / 2 - 0.3 + (k / 6) * (Math.PI + 0.6); P.push([bx + Math.cos(a) * r, by + Math.sin(a) * r]); }
  }
  return P;
}

// ===== двор =====
// Y: состояние двора. Длина двора ~8200; камера двора задаётся в main.js.
const PUDDLES = [[300, 760, 120, 22], [760, 742, 150, 26], [1240, 770, 110, 20], [1700, 748, 90, 18]];
const TREE_X = 2900, TREE_TOP = 120;
const BUSHES = [3600, 3950, 4310, 4670, 5030];
const HILL = { x0: 5850, top: [6900, 330], x1: 8050 };
function hillY(x) {
  if (x <= HILL.x0 || x >= HILL.x1) return GROUND;
  if (x <= HILL.top[0]) { const u = (x - HILL.x0) / (HILL.top[0] - HILL.x0); return GROUND - (GROUND - HILL.top[1]) * (0.5 - 0.5 * Math.cos(u * Math.PI)); }
  const u = (x - HILL.top[0]) / (HILL.x1 - HILL.top[0]); return GROUND - (GROUND - HILL.top[1]) * (0.5 + 0.5 * Math.cos(u * Math.PI));
}
// наклон склона (рад)
const hillAng = (x) => Math.atan2(hillY(x + 4) - hillY(x - 4), 8);

function drawYard(c, t, Y, view) {
  // view: [xmin, xmax] — рисуем только то, что видно
  const vis = (a, b) => b > view[0] - 200 && a < view[1] + 200;
  const snow = Y.snow;      // 0…1 — белая волна прошла (доля по x)
  const snowX = lerp(-300, 2300, snow);
  // дальние дома и крыши
  if (vis(-200, 2400)) {
    const houses = [[60, 520, 260, 130], [420, 540, 200, 110], [1180, 510, 300, 140], [1640, 530, 220, 120], [2000, 520, 260, 130]];
    houses.forEach(([x, y, w, h], i) => {
      chalkLine(c, [[x, y + h], [x, y], [x + w, y], [x + w, y + h]], 4, CH.grey, { seed: 200 + i, alpha: 0.75 });
      chalkLine(c, [[x - 16, y + 4], [x + w / 2, y - 64], [x + w + 16, y + 4]], 5, CH.red, { seed: 210 + i, alpha: 0.8 });
      chalkShape(c, [[x + w * 0.4, y + 30], [x + w * 0.6, y + 30], [x + w * 0.6, y + 66], [x + w * 0.4, y + 66]], CH.yellow, CH.yellow, 3, { seed: 220 + i, base: 0.45, alpha: 0.8 });
      // снежная шапка на крыше
      const sx = x + w / 2, sa = sstep((snowX - x + 100) / 260);
      if (sa > 0) chalkShape(c, curve([[x - 14, y + 2], [sx, y - 62], [x + w + 14, y + 2], [x + w - 10, y - 4], [sx, y - 48], [x + 10, y - 2]], 3, true), CH.white, CH.white, 3, { seed: 230 + i, base: 0.75, alpha: sa });
    });
  }
  // забор
  if (vis(-200, 2500)) {
    for (let i = 0; i < 18; i++) {
      const x = -100 + i * 140, top = 588 + (i % 2) * 6;
      chalkShape(c, [[x, GROUND - 4], [x, top + 16], [x + 22, top], [x + 44, top + 16], [x + 44, GROUND - 4]], CH.brown, CH.ochre, 4, { seed: 240 + i, sp: 8, ang: -1.45, base: 0.22, hatch: 0.4 });
      const sa = sstep((snowX - x + 40) / 200);
      if (sa > 0) chalkShape(c, curve([[x - 4, top + 18], [x + 22, top - 8], [x + 48, top + 18], [x + 22, top + 6]], 3, true), CH.white, CH.white, 3, { seed: 260 + i, base: 0.85, alpha: sa });
    }
    chalkLine(c, [[-120, 626], [2420, 630]], 6, CH.ochre, { seed: 280, alpha: 0.8 });
    chalkLine(c, [[-120, 676], [2420, 672]], 6, CH.ochre, { seed: 281, alpha: 0.8 });
  }
  // земля
  chalkLine(c, curve([[view[0] - 300, GROUND + 4], [view[0] + 600, GROUND - 4], [view[0] + 1300, GROUND + 3], [view[1] + 300, GROUND]], 6), 6, CH.white, { seed: 290 });
  // грязь и лужи (под снегом)
  if (vis(-200, 2200)) {
    PUDDLES.forEach(([x, y, rx, ry], i) => {
      chalkShape(c, ellPts(x, y, rx, ry, 0, 26), CH.mud, CH.brown, 4, { seed: 300 + i, sp: 7, ang: 0.1, base: 0.45 });
      chalkLine(c, [[x - rx * 0.5, y - 4], [x - rx * 0.1, y - 6]], 3, CH.blue, { seed: 310 + i, alpha: 0.7 });
    });
    for (let i = 0; i < 14; i++) { const x = 120 + i * 130, y = 712 + (i % 3) * 18; chalkLine(c, [[x, y], [x + 22, y - 4]], 6, CH.mud, { seed: 320 + i, alpha: 0.8 }); }
    // белая волна: мел плашмя закрашивает двор
    if (snow > 0) {
      const top = [];
      for (let x = -300; x <= snowX; x += 60) top.push([x, GROUND - 8 + Math.sin(x * 0.013) * 6]);
      const edge = snowX, front = [];
      for (let k = 0; k <= 12; k++) { const y = lerp(GROUND - 8, 1400, k / 12); front.push([edge + Math.sin(k * 1.9 + edge * 0.01) * 26 + (k < 3 ? 30 - k * 10 : 0) - Math.max(0, y - 860) * 0.6, y]); }
      const P = [...top, ...front, [-300, 1400]];
      chalkShape(c, P, CH.white, null, 0, { seed: 330, sp: 6, ang: -0.5, base: 0.82, hatch: 0.9, lw: 4 });
      // сугробы-бугорки
      for (let i = 0; i < 8; i++) { const x = -100 + i * 280; if (x < snowX - 60) chalkLine(c, curve([[x, GROUND + 2], [x + 60, GROUND - 22], [x + 130, GROUND]], 4), 4, CH.sky, { seed: 340 + i, alpha: 0.8 }); }
      if (snow < 1) dust(c, snowX, GROUND + 40, Y.tSnow + (snow * 1.2) % 0.4, Y.tSnow + (snow * 1.2) % 0.4 + 0.5, 30, 110, CH.white, 31);
    }
  }
  // градусник на столбе
  if (vis(1500, 1800) && Y.thermo > 0) drawThermo(c, 1640, 360, Y.thermo, Y.merc);
  // снежинки
  if (Y.flakes > 0) drawFlakes(c, t, view, Y.flakes);
  // дерево с инеем
  if (vis(TREE_X - 900, TREE_X + 900)) drawTree(c, t, Y);
  // кусты
  if (vis(BUSHES[0] - 300, BUSHES[4] + 300)) BUSHES.forEach((x, i) => drawBush(c, t, x, i, Y.cotton[i]));
  // горка
  if (vis(HILL.x0 - 200, HILL.x1 + 200)) drawHill(c, t, Y);
  // снег по всей земле после волны (кроме первого участка, где идёт волна)
  if (snow >= 1) {
    const x0 = Math.max(2100, view[0] - 200), x1 = view[1] + 200;
    if (x1 > x0) {
      const P = [];
      for (let x = x0; x <= x1; x += 60) P.push([x, Math.min(GROUND, hillY(x)) - 8 + Math.sin(x * 0.013) * 5]);
      P.push([x1, 1400], [x0, 1400]);
      chalkShape(c, P, CH.white, null, 0, { seed: 350, sp: 6, ang: -0.5, base: 0.8, hatch: 0.85, lw: 4 });
    }
  }
}

function drawThermo(c, x, y, a, merc) {
  // столбик-доска с градусником; merc: 1 тепло … 0 мороз
  chalkLine(c, [[x, y + 40], [x, GROUND]], 12, CH.ochre, { seed: 400, alpha: a, prog: a });
  chalkShape(c, curve([[x - 40, y - 140], [x + 40, y - 140], [x + 40, y + 70], [x - 40, y + 70]], 2, true), CH.white, OUT, 4, { seed: 401, base: 0.14, hatch: 0.2, alpha: a });
  chalkLine(c, [[x, y - 118], [x, y + 30]], 16, CH.white, { seed: 402, alpha: a });
  chalkDot(c, x, y + 42, 18, CH.red, a);
  const top = lerp(y + 30, y - 110, merc);
  chalkLine(c, [[x, y + 36], [x, top]], 9, CH.red, { seed: 403, alpha: a, jit: 0.4 });
  for (let i = 0; i < 6; i++) chalkLine(c, [[x + 14, y - 106 + i * 26], [x + 28, y - 106 + i * 26]], 3, OUT, { seed: 404 + i, alpha: a * 0.8 });

// дерево: ветки — ломаные; иней растёт ёлочкой вдоль веток
const TREE = (() => {
  const Rn = mulberry32(77), br = [];
  const grow = (x, y, ang, len, depth) => {
    const pts = [[x, y]]; let cx = x, cy = y, a = ang;

    for (let i = 0; i < n; i++) { a += (Rn() - 0.5) * 0.35; cx += Math.cos(a) * len / n; cy += Math.sin(a) * len / n; pts.push([cx, cy]); }
    br.push({ pts, w: Math.max(3, depth * 5), depth });

      const k = 2 + (depth > 2 ? 1 : 0);
      for (let j = 0; j < k; j++) {
        const at = pts[Math.floor(n * (0.4 + Rn() * 0.5))];
        grow(at[0], at[1], a + (j % 2 ? 1 : -1) * (0.45 + Rn() * 0.5), len * (0.5 + Rn() * 0.2), depth - 1);

    }

})();

  TREE.forEach((b, i) => chalkLine(c, curve(b.pts, 3), b.w, CH.brown, { seed: 600 + i, jit: 1 }));
  TREE.forEach((b, i) => { if (b.depth >= 3) chalkLine(c, curve(b.pts, 3), Math.max(2, b.w * 0.25), CH.ochre, { seed: 640 + i, alpha: 0.6 }); });

  if (fr <= 0) return;
  TREE.forEach((b, i) => {
    if (b.depth > 3) return;
    const P = curve(b.pts, 3), L = P.length;
    for (let k = 1; k < L; k += 1) {
      const u = k / (L - 1), on = clamp((fr * 1.25 - u * 0.6 - (3 - b.depth) * 0.12) * 4, 0, 1);
      if (on <= 0) continue;
      const p = P[k], q = P[k - 1], an = Math.atan2(p[1] - q[1], p[0] - q[0]), len = (9 + (k % 3) * 4) * on;
      for (const s of [-1, 1]) {
        const aa = an + s * 2.3;
        chalkLine(c, [p, [p[0] + Math.cos(aa) * len, p[1] + Math.sin(aa) * len]], 2.4, k % 2 ? CH.blue : CH.white, { seed: 700 + i * 50 + k + s, jit: 0.3 });
      }
    }

      chalkLine(c, [[p[0], p[1] - r], [p[0], p[1] + r]], 2.5, CH.yellow, { seed: 901 + i, jit: 0.2, alpha: tw });

}

    }

}

function V0() { return E.V0; }
const winCam = { x: WIN.x + WIN.w / 2, y: WIN.y + WIN.h / 2, z: W / WIN.w };
// доля пролёта сквозь окно: 0 — комната, 1 — двор во весь кадр
function winZoom(t) {
  if (t < T_IN0) return 0;
  if (t < T_IN1) return easeIn(prog(t, T_IN0, T_IN1)) * 0.35 + 0.65 * sstep(prog(t, T_IN0, T_IN1)) ;

function roomCam(t) {

// ===== ходьба: ступни в точках мира =====
// x0 — откуда пошёл, x — где тело; SL — шаг; dir — направление. Возвращает мировые x ступней и подъём.
function walkFeet(x0, x, dir, SL, lift) {
  const d = Math.max(0, (x - x0) * dir), out = [];
  for (let j = 0; j < 2; j++) {
    const cyc = (d / SL + j) / 2, n = Math.floor(cyc), f = cyc - n;
    const Xp = (m) => x0 + dir * (2 * m + 0.5 - j) * SL;
    if (f < 0.5) out.push([Xp(n), 0]);
    else { const u = (f - 0.5) * 2; out.push([lerp(Xp(n), Xp(n + 1), easeInOut(u)), Math.sin(u * Math.PI) * lift]); }
  }
  return out;  // [far, near]
}

const STOOL_X = 1060, STOOL_TOP = FLOOR - 82;

      s.sway = Math.sin(((MOM_X0 - x) / 52) * Math.PI) * 0.6;
      const bend = sstep(prog(t, E.w_ty + 0.3, E.w_ty + 0.8));
      s.lean = bend * 0.28; s.mouth = bend * 0.7; s.tilt = bend * 0.08;   // «ах!» — наклон и открытый рот, чашка в руках
    }
    return s;
  }
  // дома после губки: мама у двери, слушает дочку
  s.x = 1470; s.face = -1; s.cup = 0;
  s.hands = [[70, -252], [-28, -226]];   // ближняя рука на поясе, дальняя ладонью вперёд — «ну-ну»
  s.tilt = 0.05; s.look = 0.6;
  if (t > L(17) - 0.1) { s.smileEyes = t > E.w_sama; s.hands = [[54, -262], [58, -338]]; s.tilt = -0.05 + Math.sin(t * 2) * 0.03; }  // хитро подпирает щёку
  if (t > E.w_nu - 0.1) { s.mouth = t < EN(18) + 0.1 ? 0.7 : 0; s.hands = [[58, -250], [96, -300 + Math.sin(t * 9) * 14]]; s.smileEyes = 1; }
  if (t > T_EXIT0 + 0.3) {
    s.face = 1;
    const x = lerp(1470, 1640, easeInOut(prog(t, T_EXIT0 + 1.2, T_EXIT1)));
    const f = walkFeet(1470, x, 1, 52, 10);
    s.x = x; s.feet = f.map(([fx]) => fx - x); s.step = Math.sin(((x - 1470) / 52) * Math.PI); s.hat = prog(t, T_EXIT0 + 0.3, T_EXIT0 + 0.9);
    const sw2 = Math.sin(((x - 1470) / 52) * Math.PI); s.hands = [[54 + sw2 * 10, -244], [-36 - sw2 * 10, -244]]; s.farFront = false; s.mouth = 0; s.smileEyes = 1;
    s.alpha = 1 - sstep(prog(t, T_EXIT1 - 0.5, T_EXIT1));
  }
  return s;
}

// ===== кошка: умывается в облачке и в финале на подоконнике =====
function catState(t, x, y, sc, t0) {
  const u = Math.max(0, t - t0), cyc = (u * 1.6) % 1;
  // лизнуть лапу (у рта) → провести по носу → опустить
  let paw = [34, -8], lick = 0;
  if (u > 0) {
    if (cyc < 0.35) { const k = sstep(cyc / 0.25); paw = [lerp(34, 52, k), lerp(-8, -96, k)]; lick = k > 0.8 ? 1 : 0; }
    else if (cyc < 0.75) { const k = sstep((cyc - 0.35) / 0.4); paw = [lerp(52, 58, k), lerp(-96, -124, k)]; }
    else { const k = sstep((cyc - 0.75) / 0.25); paw = [lerp(58, 34, k), lerp(-124, -8, k)]; }
  }
  return { x, y, sc, face: 1, paw, lick, wag: Math.sin(t * 2.4), blink: lick };
}

// ===== девочка на горке =====
const GIRL_X0 = 4380;   // левее левого края кадра (камера 5450, z 0.95): вбегает из-за края
function sledGirl(t) {
  const x0 = GIRL_X0, xTop = HILL.top[0] - 10;
  let x, mode;
  if (t < T_HILL_TOP) { x = lerp(x0, xTop, easeInOut(prog(t, T_RUN0, T_HILL_TOP)) * 0.15 + 0.85 * prog(t, T_RUN0, T_HILL_TOP)); mode = "walk"; }
  else if (t < E.w_veselo + 0.12) { x = xTop; mode = "sit"; }
  else { x = lerp(xTop, HILL.x1 - 120, easeIn(prog(t, E.w_veselo + 0.12, T_RIDE1)) * 0.6 + 0.4 * prog(t, E.w_veselo + 0.12, T_RIDE1)); mode = "ride"; }
  return { x, y: hillY(x), mode };
}
function drawSledScene(c, t) {
  if (t < T_RUN0 || t > T_WIPE1 + 0.05) return;
  const g = sledGirl(t), s = girlDefault();
  s.outfit = "coat"; s.seed = 2; s.sc = 0.95; s.face = 1;
  if (g.mode === "walk") {
    const f = walkFeet(GIRL_X0, g.x, 1, 78, 26);
    const ang = hillAng(g.x);
    s.lean = 0.18 + Math.max(0, -ang) * 0.4;
    s.feet = f.map(([fx, fy]) => [fx - g.x, hillY(fx) - g.y - fy]);
    const ph = ((g.x - GIRL_X0) / 78) * Math.PI;
    s.bob = -Math.abs(Math.sin(ph)) * 7;
    s.hands = [[46 + Math.sin(ph) * 12, -118], [-30, -104]];   // ближняя рука тянет верёвку назад
    s.mouth = 0.4; s.scarf = 0.5 + Math.sin(ph) * 0.2; s.sway = Math.sin(ph) * 0.5;
    s.x = g.x; s.y = g.y;
    // салазки сзади на верёвке
    const sx = g.x - 150, sy = hillY(sx);
    const hand = [g.x + (-30) * s.sc, g.y + (-104 + s.bob) * s.sc];
    drawSled(c, sx, sy, hillAng(sx), 1, [hand, [(hand[0] + sx + 70) / 2, (hand[1] + sy - 30) / 2 + 20], [sx + 72, sy - 28]]);
    drawGirl(c, s);
    return;
  }
  // сидит на салазках и мчит вниз
  const ang = g.mode === "ride" ? hillAng(g.x) : 0, sp = g.mode === "ride" ? prog(t, E.w_veselo + 0.12, T_RIDE1) : 0;
  c.save(); c.translate(g.x, g.y); c.rotate(ang);
  drawSled(c, 0, 0, 0, 1, null);
  s.x = -6; s.y = 10; s.sit = 1; s.lean = -0.08 - sp * 0.12; s.farFront = true;
  s.feet = [[86, -40], [60, -22]];
  s.hands = [[54, -72], [62, -68]];
  chalkLine(c, curve([[62 * s.sc - 6, -68 * s.sc + 10], [72, -40], [80, -30]], 4), 3, CH.white, { seed: 1405 });
  s.mouth = g.mode === "ride" ? 1 : 0.3; s.scarf = g.mode === "ride" ? 1 : 0.2; s.sway = g.mode === "ride" ? 1.4 : 0;
  drawGirl(c, s);
  c.restore();
  if (g.mode === "ride") {
    // линии скорости и снежный хвост
    for (let i = 0; i < 6; i++) {
      const yy = g.y - 30 - i * 26, len = 120 + (i % 3) * 60;
      chalkLine(c, [[g.x - 140 - i * 12, yy], [g.x - 140 - len - i * 12, yy - Math.tan(ang) * len]], 3, CH.white, { seed: 1500 + i, alpha: 0.7 * sstep(sp * 5) });
    }
    dust(c, g.x - 70, g.y - 6, E.w_veselo + 0.15, t, 40, 160, CH.white, 77);
  }
}

// ===== рука с ватой =====
const SLAPS = () => [E.w_svezh, E.w_beloy, E.w_puhl, E.w_vatoy, E.w_vse];
function handState(t) {
  const S = SLAPS(), t0 = E.w_slovno - 0.15, t1 = EN(12) + 0.35;
  if (t < t0 || t > t1 + 0.6) return null;
  // путь: влетает сверху-справа, показывает комок ваты («тороватый»), затем шлёпает по кустам
  let tip = [4500, -200], ang = 0, hold = "cotton";
  const enter = spr(springSoft, t, t0);
  tip = [lerp(4250, BUSHES[0] + 60, enter), lerp(-300, 330 + Math.sin(t * 4) * 12, enter)];
  if (t > E.w_torov - 0.1 && t < S[0] - 0.3) ang = Math.sin((t - E.w_torov) * 10) * 0.08;
  for (let i = 0; i < 5; i++) {
    const a = S[i] - 0.28, b = S[i];
    const prevX = i ? BUSHES[i - 1] + 60 : BUSHES[0] + 60;
    if (t >= a) {
      const u = prog(t, a, b);
      tip = [lerp(prevX, BUSHES[i] + 60, easeInOut(u)), lerp(330, GROUND - 150, easeIn(u))];
      if (t > b) { const r = prog(t, b, b + 0.25); tip = [BUSHES[i] + 60, lerp(GROUND - 150, 330, easeOut(r))]; }
    }
  }
  if (t > t1) tip = [tip[0] + (t - t1) * 1600, tip[1] - (t - t1) * 1800];
  return { tip, ang, hold };
}

// ===== строки мелом =====
const FONT_L = '700 60px "Caveat"', LINE_Y0 = 872, LINE_DY = 66;
const KEYCOL = { pink: CH.pink, yellow: CH.yellow, ochre: CH.ochre, white: "#ffffff", blue: CH.blue, green: CH.green };
function blockOf(n) { return CFG.blocks.findIndex((b) => b.includes(n)); }
function drawCaptions(c, t) {
  const B = CFG.blocks, lines = CFG.lines;
  for (let bi = 0; bi < B.length; bi++) {
    const first = lines[B[bi][0] - 1], nextB = B[bi + 1];
    const tOn = first.s - 0.12;
    const tOff = nextB ? lines[nextB[0] - 1].s - 0.45 : E.fin + 0.3;
    if (t < tOn || t > tOff + 0.3) continue;
    const fade = 1 - sstep(prog(t, tOff, tOff + 0.3)), smear = prog(t, tOff, tOff + 0.3) * 40;
    c.save(); c.font = FONT_L; c.textBaseline = "middle"; c.globalAlpha = fade;
    B[bi].forEach((n, li) => {
      const l = lines[n - 1], y = LINE_Y0 + li * LINE_DY;
      const widths = l.w.map((w) => c.measureText(w.t).width), sp = c.measureText(" ").width;
      const tot = widths.reduce((a, b) => a + b, 0) + sp * (l.w.length - 1);
      let x = W / 2 - tot / 2;
      l.w.forEach((w, k) => {
        const d = clamp(w.e - w.s, 0.16, 0.34), u = prog(t, w.s - 0.08, w.s - 0.08 + d);
        if (u > 0) {
          c.save(); c.beginPath(); c.rect(x - 10, y - 50, (widths[k] + 20) * u, 100); c.clip();
          c.fillStyle = w.k ? KEYCOL[w.k] : CH.white;
          c.fillText(w.t, x + smear, y);
          c.restore();
        }
        x += widths[k] + sp;
      });
    });
    c.restore();
  }
}
// тёмная «вымытая» полоса под строками
function drawBand(c, t) {
  const on = sstep(prog(t, CFG.lines[0].s - 0.5, CFG.lines[0].s)) * (1 - sstep(prog(t, E.fin + 0.2, E.fin + 0.7)));
  if (on <= 0) return;
  const g = c.createLinearGradient(0, 800, 0, 860);
  g.addColorStop(0, "rgba(20,38,30,0)"); g.addColorStop(1, `rgba(20,38,30,${0.86 * on})`);
  c.fillStyle = g; c.fillRect(0, 800, W, 60);
  c.fillStyle = `rgba(20,38,30,${0.86 * on})`; c.fillRect(0, 860, W, H - 860);
}

// заголовок мелом: пишется слева направо (u 0…1)
const TITLE = "Мама! глянь-ка из окошка…";
function drawTitle(c, x, y, size, u, ua, authSize, alpha = 1) {
  c.save(); c.globalAlpha = alpha; c.textAlign = "left"; c.textBaseline = "alphabetic";
  c.font = `700 ${size}px "Amatic SC"`;
  const w = c.measureText(TITLE).width, x0 = x - w / 2;
  c.save(); c.beginPath(); c.rect(x0 - 20, y - size * 1.1, (w + 40) * u, size * 1.5); c.clip();
  c.fillStyle = CH.white; c.fillText(TITLE, x0, y); c.restore();
  // подчёркивание волной
  const ul = []; for (let i = 0; i <= 30; i++) ul.push([x0 + (w * i) / 30, y + size * 0.16 + Math.sin(i * 0.9) * 3]);
  chalkLine(c, ul, size * 0.04, CH.yellow, { prog: sstep((u - 0.6) / 0.4), seed: 33 });
  c.font = `700 ${authSize}px "Caveat"`;
  const AU = "Афанасий Фет · 1887", aw = c.measureText(AU).width;
  c.save(); c.beginPath(); c.rect(x - aw / 2 - 10, y + size * 0.2, (aw + 20) * ua, authSize * 1.6); c.clip();
  c.fillStyle = CH.sky; c.fillText(AU, x - aw / 2, y + size * 0.22 + authSize); c.restore();
  c.restore();

}

// ===== кадр =====
const camMat = (cam) => [cam.z, 0, 0, cam.z, W / 2 - cam.x * cam.z, H / 2 - cam.y * cam.z];
function setCam(c, cam) { c.setTransform(...camMat(cam)); }
function boardFill(c, m) {
  PAT_B.setTransform(new DOMMatrix(m));
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = PAT_B; c.fillRect(0, 0, W, H); c.restore();
}
function grain(c, pat, m) {
  pat.setTransform(new DOMMatrix(m));
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = "destination-in"; c.fillStyle = pat; c.fillRect(0, 0, W, H); c.restore();
}
function composite(layer, a = 1) {
  gl.clearRect(0, 0, 480, 270); gl.drawImage(layer, 0, 0, 480, 270);
  ctx.save(); ctx.globalAlpha = 0.22 * a; ctx.drawImage(GL, 0, 0, W, H); ctx.globalAlpha = a; ctx.drawImage(layer, 0, 0); ctx.restore();
}
const mul = (A, B) => [A[0] * B[0] + A[2] * B[1], A[1] * B[0] + A[3] * B[1], A[0] * B[2] + A[2] * B[3], A[1] * B[2] + A[3] * B[3], A[0] * B[4] + A[2] * B[5] + A[4], A[1] * B[4] + A[3] * B[5] + A[5]];

function yardState(t) {
  return {
    snow: sstep(prog(t, E.w_odelo - 0.1, E.w_pobel + 0.5)), tSnow: t,
    thermo: sstep(prog(t, E.w_vidno - 0.2, E.w_vidno + 0.3)),
    merc: 1 - spr(springSoft, t, E.w_moroz - 0.05),
    flakes: sstep(prog(t, E.w_moroz, E.w_moroz + 0.6)),
    treeSnow: 1,
    frost: sstep(prog(t, L(7) - 0.1, EN(8) + 0.1)),
    sparkle: sstep(prog(t, E.w_iney - 0.2, E.w_iney + 0.3)),
    cotton: SLAPS(),
    track: t > E.w_veselo + 0.12 ? [HILL.top[0], sledGirl(t).x] : null
  };
}
function yardView(cam) { const hw = W / 2 / cam.z; return [cam.x - hw, cam.x + hw]; }
function drawYardAll(c, t, cam) {
  drawYard(c, t, yardState(t), yardView(cam));
  drawSledScene(c, t);
  const h = handState(t);
  if (h) drawHand(c, h.tip, h.ang, 1.7, h.hold);
}

// комната со всем содержимым (в мировых координатах комнаты)
function drawRoomAll(c, t) {
  const R = { sketch: sstep(prog(t, 0.05, 1.5)), crossAlpha: 1 - sstep(prog(winZoom(t), 0.35, 0.8)), hatGone: t > T_EXIT0 + 0.3 };
  drawRoom(c, t, R);
  // дверь открывается на выходе
  const dOpen = sstep(prog(t, T_EXIT0 + 0.5, T_EXIT0 + 0.95)) * (1 - sstep(prog(t, T_EXIT1 + 0.1, T_EXIT1 + 0.5)));
  if (dOpen > 0) {
    const d = DOOR;
    chalkShape(c, [[d.x + 8, d.y + 8], [d.x + d.w - 8, d.y + 8], [d.x + d.w - 8, d.y + d.h], [d.x + 8, d.y + d.h]], CH.cream, null, 0, { seed: 90, base: 0.5 * dOpen, hatch: 0.7 * dOpen, sp: 9 });
    chalkShape(c, [[d.x, d.y], [d.x + d.w * (1 - dOpen * 0.75), d.y + 24 * dOpen], [d.x + d.w * (1 - dOpen * 0.75), d.y + d.h - 10 * dOpen], [d.x, d.y + d.h]], CH.brown, CH.ochre, 5, { seed: 91, base: 0.5, sp: 10, ang: -1.5 });
  }
  // табурет
  const st = sstep(prog(t, 0.4, 1.4));
  chalkShape(c, [[STOOL_X - 60, STOOL_TOP], [STOOL_X + 60, STOOL_TOP], [STOOL_X + 60, STOOL_TOP + 16], [STOOL_X - 60, STOOL_TOP + 16]], CH.ochre, OUT, 4, { seed: 95, base: 0.5, alpha: st });
  chalkLine(c, [[STOOL_X - 48, STOOL_TOP + 16], [STOOL_X - 56, FLOOR]], 9, CH.ochre, { seed: 96, alpha: st });
  chalkLine(c, [[STOOL_X + 48, STOOL_TOP + 16], [STOOL_X + 56, FLOOR]], 9, CH.ochre, { seed: 97, alpha: st });
  // меловая пыль: девочка одевается
  if (t > T_EXIT0 + 0.1 && t < T_EXIT0 + 1.8) { const gx = lerp(1200, 1630, easeInOut(prog(T_EXIT0 + 0.3, T_EXIT0, T_EXIT0 + 1.3))); dust(c, gx, FLOOR - 160, T_EXIT0 + 0.3, t, 34, 120, CH.white, 66); }
  // кошка на подоконнике в финале
  if (t > T_EXIT0) {
    const a = sstep(prog(t, T_EXIT0, T_EXIT0 + 0.6));
    drawCat(c, { ...catState(t, WIN.x + WIN.w - 120, WIN.y + WIN.h, 0.62, T_EXIT0 + 0.3), alpha: a });
  }
  // мама и девочка: появляются в начале
  const pop = spr(springPop, t, 0.9), pop2 = spr(springPop, t, 1.15);
  const m = roomMom(t), g = roomGirl(t);
  if (pop2 > 0.01) { m.sc *= 0.75 + 0.25 * clamp(pop2, 0, 1.2); m.alpha = (m.alpha ?? 1) * clamp(pop2 * 1.6, 0, 1); drawMom(c, m); }
  if (pop > 0.01) { g.sc *= 0.75 + 0.25 * clamp(pop, 0, 1.2); g.alpha = (g.alpha ?? 1) * clamp(pop * 1.6, 0, 1); drawGirl(c, g); }
  // облачко мысли с кошкой («вчера»)
  if (t > T_BUBBLE && t < T_BUBBLE_OUT + 0.4) {
    const k = spr(springPop, t, T_BUBBLE), out = sstep(prog(t, T_BUBBLE_OUT, T_BUBBLE_OUT + 0.3));
    const cx = 1335, cy = 330, sc = k * (1 + out * 0.25), a = 1 - out;
    // кружки-ступеньки от головы
    [[1112, 418, 9], [1140, 392, 13], [1172, 368, 18]].forEach(([x, y, r], i) => chalkShape(c, ellPts(x, y, r * k, r * k, 0, 12), null, CH.white, 3.5, { seed: 120 + i, alpha: a }));
    c.save(); c.translate(cx, cy); c.scale(sc, sc); c.translate(-cx, -cy);
    const P = cloudPts(cx, cy, 180, 118, 10, 4);
    chalkShape(c, P, BOARD, CH.white, 4.5, { seed: 125, base: 0.92 * a, hatch: 0, alpha: a });
    chalkFill(c, P, CH.white, { base: 0.05, hatch: 0.08, sp: 14, alpha: a });
    // «вчера» мелом и подоконник
    c.save(); c.globalAlpha = a; c.font = '700 40px "Caveat"'; c.fillStyle = CH.yellow; c.fillText("вчера", cx - 150, cy - 52); c.restore();
    chalkLine(c, [[cx - 140, cy + 74], [cx + 140, cy + 74]], 6, CH.ochre, { seed: 126, alpha: a });
    drawCat(c, { ...catState(t, cx - 10, cy + 72, 0.82, E.w_umyv - 0.3), alpha: a });
    c.restore();
  }
}

function renderScene(t, kind, clipX0 = 0, clipX1 = W) {
  const clip = (c) => { c.beginPath(); c.rect(clipX0, 0, clipX1 - clipX0, H); c.clip(); };
  if (kind === "yard") {
    const yc = yardCam(t), m = camMat(yc);
    ctx.save(); clip(ctx); boardFill(ctx, m);
    lw.setTransform(1, 0, 0, 1, 0, 0); lw.clearRect(0, 0, W, H);
    lw.save(); clip(lw); lw.setTransform(...m); drawYardAll(lw, t, yc); lw.restore();
    grain(lw, PAT_W, m); composite(LW);
    ctx.restore();
    return;
  }
  const rc = roomCam(t), m = camMat(rc);
  ctx.save(); clip(ctx); boardFill(ctx, m);
  // двор в окне: своя доска и свой мел
  const yc = yardCam(t);
  const wm = mul(m, [WIN.w / W, 0, 0, WIN.h / H, WIN.x, WIN.y]), ym = mul(wm, camMat(yc));
  const wr = [m[4] + WIN.x * m[0], m[5] + WIN.y * m[3], WIN.w * m[0], WIN.h * m[3]];
  ctx.save(); ctx.beginPath(); ctx.rect(...wr); ctx.clip();
  const wa = sstep(prog(t, 0.3, 1.3));
  ctx.globalAlpha = wa; boardFill(ctx, ym); ctx.fillStyle = "rgba(160,200,230,0.06)"; ctx.fillRect(...wr); ctx.globalAlpha = 1;
  ly.setTransform(1, 0, 0, 1, 0, 0); ly.clearRect(0, 0, W, H);
  ly.save(); ly.beginPath(); ly.rect(...wr); ly.clip(); ly.setTransform(...ym); drawYardAll(ly, t, yc); ly.restore();
  grain(ly, PAT_W, ym); composite(LY, sstep(prog(t, 0.6, 1.6)));   // двор в окне проявляется вслед за рамой
  ctx.restore();
  lw.setTransform(1, 0, 0, 1, 0, 0); lw.clearRect(0, 0, W, H);
  lw.save(); clip(lw); lw.setTransform(...m); drawRoomAll(lw, t); lw.restore();
  grain(lw, PAT_W, m); composite(LW);
  ctx.restore();
}

function renderAt(t) {
  BOIL = Math.floor(t * BOIL_FPS);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const wz = winZoom(t);
  if (t >= T_WIPE0 && t < T_WIPE1) {
    // губка: слева уже комната, справа ещё горка
    const u = easeInOut(prog(t, T_WIPE0, T_WIPE1)), xe = lerp(-160, W + 160, u);
    renderScene(t, "room", 0, Math.max(0, xe));
    renderScene(t, "yard", Math.max(0, xe), W);
    drawSponge(xe, t);
  } else renderScene(t, wz >= 1 ? "yard" : "room");
  // строки и заголовок
  drawBand(ctx, t);
  ls.setTransform(1, 0, 0, 1, 0, 0); ls.clearRect(0, 0, W, H);
  drawCaptions(ls, t);
  // заголовок в начале — на стене над окном (в координатах комнаты)
  if (t < E.L1 + 0.6) {
    const rc = roomCam(t); ls.save(); ls.setTransform(...camMat(rc));
    const u = sstep(prog(t, T_TITLE0, T_TITLE1)), ua = sstep(prog(t, T_TITLE1 - 0.1, T_AUTH1));
    const a = 1 - sstep(prog(t, E.L1 - 0.2, E.L1 + 0.5));
    const r = drawTitle(ls, 960, 100, 118, u, ua, 46, a);
    ls.restore();
    // рука пишет заголовок
    if (t < T_AUTH1 + 0.7) {
      const hx = r.x0 + r.w * u, hy = 100 - 30 + Math.sin(t * 22) * 8;
      const away = sstep(prog(t, T_AUTH1, T_AUTH1 + 0.6));
      handOnScreen(rc, [hx + away * 700, hy - away * 600], -0.1);
    }
  }
  // финальный заголовок
  if (t > T_FTITLE0 - 0.1) {
    const rc = roomCam(t); ls.save(); ls.setTransform(...camMat(rc));
    const u = sstep(prog(t, T_FTITLE0, T_FTITLE1)), ua = sstep(prog(t, T_FTITLE1 - 0.1, T_FTITLE1 + 0.6));
    const r = drawTitle(ls, 960, 95, 150, u, ua, 58, 1);
    ls.restore();
    if (t < T_FTITLE1 + 1.4) {
      const hx = r.x0 + r.w * u, away = sstep(prog(t, T_FTITLE1 + 0.6, T_FTITLE1 + 1.3));
      handOnScreen(rc, [hx + away * 800, 65 + Math.sin(t * 22) * 8 - away * 700], -0.1);
    }
  }
  grain(ls, PAT_S, [1, 0, 0, 1, 0, 0]);
  composite(LS);
}
// рука поверх всего — в координатах комнаты
function handOnScreen(rc, tip, ang) {
  lw.setTransform(1, 0, 0, 1, 0, 0); lw.clearRect(0, 0, W, H);
  lw.setTransform(...camMat(rc)); drawHand(lw, tip, ang, 1.0, "chalk");
  grain(lw, PAT_W, camMat(rc));
  ls.save(); ls.setTransform(1, 0, 0, 1, 0, 0); ls.drawImage(LW, 0, 0); ls.restore();
}
// губка
function drawSponge(x, t) {
  lw.setTransform(1, 0, 0, 1, 0, 0); lw.clearRect(0, 0, W, H);
  // меловые разводы за губкой
  for (let i = 0; i < 7; i++) chalkLine(lw, [[x - 40, 120 + i * 120], [x - 300 - (i % 3) * 80, 140 + i * 120 + Math.sin(i) * 20]], 50, CH.white, { seed: 1600 + i, alpha: 0.12 });
  const y = 520 + Math.sin(t * 9) * 160;
  lw.save(); lw.translate(x, y); lw.rotate(0.12 + Math.sin(t * 9) * 0.1);
  chalkShape(lw, [[-70, -150], [70, -150], [70, 150], [-70, 150]], CH.yellow, OUT, 6, { seed: 1610, base: 0.75, sp: 7 });
  chalkShape(lw, [[-70, -150], [70, -150], [70, -90], [-70, -90]], CH.brown, OUT, 5, { seed: 1611, base: 0.6, sp: 6 });
  lw.restore();
  grain(lw, PAT_W, [1, 0, 0, 1, 0, 0]); composite(LW);
  dust(ctx, x, y, T_WIPE0 + 0.2, t, 30, 150, CH.white, 55);
}

// ===== пробы: ?probe=girl|coat|sled|mom|cat|hand|cam =====
const PQ = new URLSearchParams(location.search), PROBE = PQ.get("probe");
function probe(kind) {
  const c = lw; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = BOARD; ctx.fillRect(0, 0, W, H);
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
  const cols = 8, rows = 4, cw = W / cols, chh = H / rows, n = cols * rows;
  const span = { girl: [E.L1 - 0.3, T_WIPE0], girl2: [T_WIPE1, T_EXIT1], sled: [T_RUN0, T_WIPE1], mom: [E.L1, T_EXIT1], cat: [E.w_umyv - 0.3, E.w_umyv + 1.6], hand: [E.w_slovno - 0.1, EN(12) + 0.5] }[kind];
  const labels = [];
  for (let k = 0; k < n; k++) {
    const t = lerp(span[0], span[1], k / (n - 1)), x0 = (k % cols) * cw, y0 = Math.floor(k / cols) * chh;
    BOIL = Math.floor(t * BOIL_FPS);
    c.save(); c.beginPath(); c.rect(x0, y0, cw, chh); c.clip();
    c.strokeStyle = "rgba(255,255,255,0.25)"; c.lineWidth = 2; c.strokeRect(x0, y0, cw, chh);
    if (kind === "girl" || kind === "girl2") {
      const s = roomGirl(t), sc = 0.62;
      c.translate(x0 + cw / 2, y0 + chh - 14); c.scale(sc, sc); s.x = 0; s.y = 0; s.sc = 1; drawGirl(c, s);
      chalkLine(c, [[-140, 0], [140, 0]], 3, CH.grey, { seed: 1 });
    } else if (kind === "mom") {
      const s = roomMom(t), sc = 0.5;
      c.translate(x0 + cw / 2, y0 + chh - 10); c.scale(sc, sc); s.x = 0; s.y = 0; s.sc = 1; s.alpha = 1; drawMom(c, s);
      chalkLine(c, [[-180, 0], [180, 0]], 3, CH.grey, { seed: 1 });
    } else if (kind === "sled") {
      const g = sledGirl(t);
      c.translate(x0 + cw / 2, y0 + chh / 2 + 40); c.scale(0.5, 0.5); c.translate(-g.x, -g.y);
      drawHill(c, t, { track: null }); drawSledScene(c, t);
    } else if (kind === "cat") {
      c.translate(x0 + cw / 2 - 20, y0 + chh - 20); c.scale(1.2, 1.2); drawCat(c, catState(t, 0, 0, 1, span[0]));
    } else if (kind === "hand") {
      const h = handState(t);
      c.translate(x0 + cw / 2, y0 + chh / 2); c.scale(0.16, 0.16); c.translate(-4300, -450);
      BUSHES.forEach((x, i) => drawBush(c, t, x, i, SLAPS()[i]));
      if (h) drawHand(c, h.tip, h.ang, 1.7, h.hold);
    }
    c.restore();
    labels.push([t, x0, y0]);
  }
  grain(c, PAT_W, [1, 0, 0, 1, 0, 0]); composite(LW);
  ctx.fillStyle = "#ff0"; ctx.font = "18px monospace"; labels.forEach(([t, x, y]) => ctx.fillText(t.toFixed(2), x + 6, y + 20));
}
// ?probe=cam — скорость камеры (px экрана за кадр)
function probeCam() {
  const c = ctx; c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = "#fff"; c.fillRect(0, 0, W, H);
  let prev = null, maxV = 0, tv = 0; const vs = [];
  for (let f = 0; f <= TOTAL * 30; f++) {
    const t = f / 30, wz = winZoom(t), cam = wz >= 1 && t < T_WIPE0 ? yardCam(t) : roomCam(t);
    if (prev && prev.kind === (wz >= 1)) { const v = Math.hypot(cam.x - prev.x, cam.y - prev.y) * cam.z + Math.abs(Math.log(cam.z / prev.z)) * 1100; vs.push([t, v]); if (v > maxV) { maxV = v; tv = t; } }
    prev = { ...cam, kind: wz >= 1 };
  }
  c.fillStyle = "#000"; c.font = "40px monospace"; c.fillText(`maxV ${maxV.toFixed(1)} px/frame at ${tv.toFixed(2)}s`, 40, 80);
  c.strokeStyle = "#c00"; c.beginPath(); vs.forEach(([t, v]) => c.lineTo(40 + (t / TOTAL) * (W - 80), 1000 - v * 8)); c.stroke();
  c.fillStyle = "#555"; c.font = "18px monospace"; for (let s = 0; s < TOTAL; s += 2) c.fillText(s, 40 + (s / TOTAL) * (W - 80), 1040);
}

function setup() {
  buildChalk();
  PAT_B = ctx.createPattern(BOARD_TILE, "repeat"); PAT_W = ctx.createPattern(GRAIN_W, "repeat"); PAT_S = ctx.createPattern(GRAIN_S, "repeat");
}
const seek = (t) => (PROBE === "cam" ? probeCam() : PROBE ? probe(PROBE) : renderAt(t));
const T_Q = PQ.has("t") ? +PQ.get("t") : 0;   // ?t=12.3 — кадр для проверки без плеера
let LAST_T = T_Q;
setup();
window.addEventListener("hf-seek", (e) => { LAST_T = e.detail.time; seek(LAST_T); });
seek(T_Q);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => seek(LAST_T));

const tl = gsap.timeline({ paused: true });
tl.set({}, {}, TOTAL);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;

    </script>
