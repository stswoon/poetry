    <script>
// ---------- Пастозная живопись: мазок с гребнем, холст, палитра ----------
const W = 1920, H = 1080, TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const inv = (a, b, v) => clamp((v - a) / (b - a));
const ease = (u) => { u = clamp(u); return u * u * (3 - 2 * u); };
const easeOut = (u) => 1 - Math.pow(1 - clamp(u), 3);
const easeIn = (u) => Math.pow(clamp(u), 3);
const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
// пружина Motion → функция u(0…1) с перелётом
const SPRING = (() => {
  try {
    const gen = Motion.spring({ keyframes: [0, 1], stiffness: 170, damping: 11, mass: 1 });
    const N = 120, arr = [];
    for (let i = 0; i <= N; i++) arr.push(gen.next(i * 1200 / N).value);
    return (u) => { u = clamp(u); const f = u * N, i = Math.floor(f); return i >= N ? arr[N] : lerp(arr[i], arr[i + 1], f - i); };
  } catch (e) { return (u) => { u = clamp(u); return 1 - Math.cos(u * 9) * Math.exp(-u * 6); }; }
})();

// цвет: [r,g,b] 0…255
const mix = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u)];
const shade = (c, k) => k >= 0 ? mix(c, [255, 250, 232], k) : mix(c, [28, 16, 30], -k);
const css = (c, a = 1) => a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a.toFixed(3)})`;
const jit = (c, n, amt) => [c[0] + (hash(n) - 0.5) * amt, c[1] + (hash(n + 7.3) - 0.5) * amt, c[2] + (hash(n + 3.1) - 0.5) * amt * 0.8];
// палитра по ключам: keys = [[t, color], …]
function ramp(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return mix(keys[i - 1][1], keys[i][1], ease(inv(keys[i - 1][0], keys[i][0], t)));
  return keys[keys.length - 1][1];
}

const C = {
  cad: [246, 190, 40], gold: [232, 162, 34], ochre: [196, 128, 40], sienna: [150, 78, 30], umber: [86, 50, 30],
  ultra: [40, 62, 160], cobalt: [62, 104, 196], cerul: [108, 170, 226], cream: [250, 240, 206], white: [255, 250, 236],
  verm: [222, 70, 36], rose: [236, 128, 110], lemon: [250, 240, 150], night: [24, 30, 78], violet: [92, 70, 140],
  shirt: [192, 58, 44], pants: [68, 84, 120], skin: [234, 176, 128], hair: [236, 206, 120], green: [110, 150, 60],
};

// Мазок: тело + тень у нижнего края + гребень краски сверху. dx,dy — направление мазка (единичный вектор)
function dab(g, x, y, len, w, ang, col, a = 1) {
  const c = Math.cos(ang), s = Math.sin(ang);
  g.setTransform(c, s, -s, c, x, y);
  g.globalAlpha = a;
  const h = len / 2, r = w / 2;
  g.fillStyle = css(shade(col, -0.26));
  brush(g, h, r, w * 0.13); g.fill();
  g.fillStyle = css(col);
  brush(g, h, r * 0.92, 0); g.fill();
  g.globalAlpha = a * 0.75;
  g.fillStyle = css(shade(col, 0.36));
  brush(g, h * 0.62, Math.max(0.7, w * 0.09), -r * 0.42); g.fill();
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
}
// форма мазка: тупое начало слева, сужение и рваный кончик справа
function brush(g, h, r, dy) {
  g.beginPath();
  g.moveTo(-h, dy);
  g.quadraticCurveTo(-h, dy - r, -h + r, dy - r);
  g.lineTo(h * 0.45, dy - r * 0.9);
  g.quadraticCurveTo(h, dy - r * 0.55, h, dy - r * 0.05);
  g.quadraticCurveTo(h * 0.8, dy + r * 0.5, h * 0.4, dy + r * 0.85);
  g.lineTo(-h + r, dy + r);
  g.quadraticCurveTo(-h, dy + r, -h, dy);
}
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const reset = (g) => { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; };

// Толстая «живописная» линия (рука, нога, стебель): тень, тело, блик
function limb(g, pts, w, col) {
  reset(g);
  g.lineCap = "round"; g.lineJoin = "round";
  const path = () => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); };
  path(); g.strokeStyle = css(shade(col, -0.45)); g.lineWidth = w + 5; g.stroke();
  path(); g.strokeStyle = css(col); g.lineWidth = w; g.stroke();
  g.save(); g.translate(-w * 0.18, -w * 0.18); path(); g.strokeStyle = css(shade(col, 0.35)); g.lineWidth = Math.max(2, w * 0.22); g.stroke(); g.restore();
}
// пятно-эллипс, покрытое мазками (голова, облако, солнце): заливка + штрихи по форме
function blob(g, x, y, rx, ry, col, seed, n = 14, ang0 = 0.4) {
  reset(g);
  g.fillStyle = css(shade(col, -0.4));
  g.beginPath(); g.ellipse(x + 2, y + 3, rx + 2.5, ry + 2.5, 0, 0, TAU); g.fill();
  g.fillStyle = css(col);
  g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill();
  for (let i = 0; i < n; i++) {
    const a = hash(seed + i) * TAU, rr0 = Math.sqrt(hash(seed + i * 2.1)) * 0.75;
    const px = x + Math.cos(a) * rx * rr0, py = y + Math.sin(a) * ry * rr0;
    dab(g, px, py, Math.min(rx, ry) * 0.7, Math.min(rx, ry) * 0.2, ang0 + (hash(seed + i * 5) - 0.5) * 0.8, jit(shade(col, (0.5 - (py - y + ry) / (2 * ry)) * 0.2), seed + i, 14), 0.45);
  }
  reset(g);
}

// Холст: фактура переплетения и рельеф (один раз), накладывается поверх кадра
const CANVAS_TEX = (() => {
  const c = document.createElement("canvas"); c.width = 512; c.height = 512;
  const x = c.getContext("2d");
  const im = x.createImageData(512, 512), d = im.data;
  for (let j = 0; j < 512; j++) for (let i = 0; i < 512; i++) {
    const w = (Math.sin(i * 1.9) * Math.sin(j * 0.31) + Math.sin(j * 1.9) * Math.sin(i * 0.29)) * 0.5;
    const n = hash(i * 0.913 + j * 7.17) - 0.5;
    const v = 128 + w * 30 + n * 34;
    const k = (j * 512 + i) * 4;
    d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  return c;
})();
let TEX_PAT = null;
function canvasGrain(g, amt = 0.16) {
  reset(g);
  if (!TEX_PAT) TEX_PAT = g.createPattern(CANVAS_TEX, "repeat");
  g.globalCompositeOperation = "overlay";
  g.globalAlpha = amt;
  g.fillStyle = TEX_PAT; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
}

// ---------- Мир: небо из вихрей мазков, нива, солнце, месяц, змей ----------
// Мировые координаты: горизонт на HZ, запад (закат) слева, восток справа. Вид V = {x, y, z}: точка (x, y) в центре кадра.
const HZ = 560;
const P = (V, x, y) => [(x - V.x) * V.z + W / 2, (y - V.y) * V.z + H / 2];
const EV = CFG.ev;

// ---- время суток: 0 — жаркий день, .5 — золотой вечер, .7 — сумерки, .85 — солнце зажмурилось, 1 — рассвет
function todAt(t) {
  return ramp([[0, [0, 0, 0]], [EV.L5 - 1.2, [0, 0, 0]], [EV.L5 + 0.4, [0.5, 0, 0]], [EV.L7, [0.6, 0, 0]], [EV.L9, [0.7, 0, 0]],
    [EV.smezh, [0.72, 0, 0]], [EV.smezh + 0.9, [0.86, 0, 0]], [EV.oko - 0.1, [0.86, 0, 0]], [EV.oko + 0.9, [1, 0, 0]]], t)[0];
}
const ZEN = [[0, C.cobalt], [0.5, [70, 80, 170]], [0.7, [38, 40, 104]], [0.86, [20, 22, 62]], [1, [70, 110, 190]]];
const HOR_W = [[0, [176, 214, 236]], [0.5, [246, 176, 96]], [0.7, [232, 92, 52]], [0.86, [120, 48, 70]], [1, [250, 196, 140]]];
const HOR_E = [[0, [176, 214, 236]], [0.5, [190, 160, 190]], [0.7, [70, 70, 140]], [0.86, [80, 50, 96]], [1, [252, 214, 120]]];
function skyCol(x, y, td) {
  const v = clamp((y + 700) / (HZ + 700)); // 0 — зенит, 1 — горизонт
  const e = clamp((x + 600) / 3200);       // 0 — запад, 1 — восток
  const hor = mix(ramp(HOR_W, td), ramp(HOR_E, td), e);
  let c = mix(ramp(ZEN, td), hor, Math.pow(v, 1.5));
  // заря на востоке: летом закат и восход горят одновременно
  const ke = ramp([[0.55, [0, 0, 0]], [0.7, [0.55, 0, 0]], [0.86, [0.35, 0, 0]], [1, [0.9, 0, 0]]], td)[0];
  if (ke > 0) c = mix(c, [252, 206, 150], ke * Math.exp(-Math.pow((x - 2300) / 800, 2)) * Math.pow(v, 3));
  return c;
}
// солнце: дуга с запада вниз, под горизонтом на север, восход на востоке
function sunPos(t) {
  const td = todAt(t);
  if (t < EV.oko - 0.2) return [lerp(lerp(560, 120, inv(0, 0.5, td)), -260, inv(0.5, 0.86, td)), lerp(lerp(40, 330, inv(0, 0.5, td)), HZ + 90, inv(0.5, 0.86, td))];
  const u = easeOut(inv(EV.oko - 0.2, EV.oko + 1.6, t));
  return [2300, lerp(HZ + 120, HZ - 120, u)];
}

// ---- мазки неба: сетка с дрожанием, направление по полю вихрей
const SKY = [];
(() => {
  const st = 36; let n = 0;
  for (let y = -760; y < HZ + 10; y += st * 0.62) for (let x = -2400; x < 6200; x += st) {
    n++;
    SKY.push([x + (hash(n) - 0.5) * st * 0.9, y + (hash(n * 1.3) - 0.5) * st * 0.5, 40 + hash(n * 2.7) * 34, 11 + hash(n * 3.3) * 6, n]);
  }
})();
const SWIRLS = [[300, -260, 260, 1], [1350, -120, 300, -1], [2500, -300, 280, 1], [-900, -150, 260, -1], [3500, -150, 300, 1]];
function flowAng(x, y, t) {
  let vx = 1, vy = 0.18 * Math.sin(x * 0.003 + y * 0.004 + t * 0.25);
  for (const [cx, cy, r, s] of SWIRLS) {
    const dx = x - cx, dy = y - cy, k = Math.exp(-(dx * dx + dy * dy) / (r * r)) * 2.2;
    vx += -dy / r * k * s; vy += dx / r * k * s;
  }
  return Math.atan2(vy, vx);
}
function drawSky(g, V, t, opt = {}) {
  const td = todAt(t);
  // подложка — сплошной градиент, чтобы между мазками не было дыр
  reset(g);
  const [, y0] = P(V, 0, -760), [, y1] = P(V, 0, HZ);
  const gr = g.createLinearGradient(0, y0, 0, y1 + 40);
  gr.addColorStop(0, css(skyCol(V.x, -700, td))); gr.addColorStop(1, css(skyCol(V.x, HZ, td)));
  g.fillStyle = gr; g.fillRect(0, 0, W, Math.max(0, y1 + 60));
  const x0 = V.x - W / 2 / V.z - 80, x1 = V.x + W / 2 / V.z + 80, ya = V.y - H / 2 / V.z - 60, yb = Math.min(HZ + 10, V.y + H / 2 / V.z + 60);
  const sz = clamp(V.z, 0.55, 2.2);
  for (const [sx, sy, len, w, n] of SKY) {
    if (sy < ya || sy > yb) continue;
    const drift = ((t * 22 + hash(n * 9) * 60) % 60) - 30;
    const a = flowAng(sx, sy, t);
    const x = sx + Math.cos(a) * drift, y = sy + Math.sin(a) * drift;
    if (x < x0 || x > x1) continue;
    let col = jit(skyCol(x, y, td), n, 26);
    // светлые завитки вокруг солнца
    const [sux, suy] = sunPos(t), ds = Math.hypot(x - sux, y - suy);
    if (ds < 520) col = mix(col, td > 0.75 && td < 0.95 ? col : C.lemon, (1 - ds / 520) * 0.55);
    const [px, py] = P(V, x, y);
    const fade = Math.min(1, Math.abs(drift) < 26 ? 1 : (30 - Math.abs(drift)) / 4);
    dab(g, px, py, len * sz, w * sz, a, col, 0.92 * fade);
  }
  reset(g);
  if (td > 0.55) drawStars(g, V, t, td);
}
function drawStars(g, V, t, td) {
  const k = inv(0.6, 0.86, td) * (1 - inv(0.9, 1, td));

// Заголовок: «Зреет рожь» / «над жаркой нивой…»; prog 0…1 — влёт слов на пружине; author 0…1

    const spr = line.map((w) => goldWord(w, size));

    let x = cx - tw / 2;
    const y = cy + (li === 0 ? -size * 0.42 : size * 0.78);
    spr.forEach((S) => {
      const d = clamp(prog * 6 - wi * 0.9);
      const u = d >= 1 ? 1 : SPRING(d);

      if (d > 0) drawSprite(g, S, x + w0 / 2, y - (1 - u) * 90, lerp(0.4, 1, u), clamp(d * 3), (1 - u) * (wi % 2 ? 0.25 : -0.25));

      wi++;
    });
  });

  for (let i = 0; i < L.length; i++) if (t >= L[i].s - 0.05) cur = i;

const camLerp = (a, b, u) => ({ x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), z: Math.exp(lerp(Math.log(a.z), Math.log(b.z), u)) });

// большие колосья у объектива (пролёт)
function nearStalks(g, t, speed, n, a = 1) {
  for (let i = 0; i < n; i++) {
    const x = ((hash(i) * 2600 - t * speed * (0.8 + hash(i * 3) * 0.6)) % 2600 + 2600) % 2600 - 340;
    const h = 380 + hash(i * 5) * 380, bx = x, by = H + 40;
    const bend = Math.sin(t * 2.4 + i) * 0.12 + 0.18;
    const tx = bx + Math.sin(bend) * h, ty = by - Math.cos(bend) * h;
    const col = jit(C.gold, i * 13, 40);
    limb(g, [[bx, by], [lerp(bx, tx, 0.6) - 10, lerp(by, ty, 0.6)], [tx, ty]], 9 + hash(i) * 6, shade(col, -0.15));
    ear(g, tx, ty, 1.1 + hash(i * 7), -Math.PI / 2 + bend, col, 1, i);

}
// колос: зёрна мазками в два ряда и ости. ripe 0…1 — от зелёного к золоту (снизу вверх)
function ear(g, x, y, s, ang, col, ripe, seed) {
  const c = Math.cos(ang), sn = Math.sin(ang);
  for (let i = 0; i < 9; i++) {
    const along = i * 15 * s, k = clamp(ripe * 1.4 - (i / 9) * 0.4);
    const gc = mix([120, 160, 60], col, k);
    for (const sd of [-1, 1]) {
      const ox = x + c * along - sn * sd * 7 * s, oy = y + sn * along + c * sd * 7 * s;
      dab(g, ox, oy, 20 * s, 11 * s, ang + sd * 0.45, jit(gc, seed * 31 + i * 2 + sd, 24));
      // ость
      reset(g); g.strokeStyle = css(shade(gc, 0.25), 0.85); g.lineWidth = 1.6 * s;
      g.beginPath(); g.moveTo(ox, oy); g.lineTo(ox + Math.cos(ang + sd * 0.5) * 46 * s, oy + Math.sin(ang + sd * 0.5) * 46 * s); g.stroke();

}
// светлый вихрь ветра: лента мазков, голова в точке hx
function windRibbon(g, hx, y0, t, a = 1, s = 1) {

// ночь, ползущая с востока: тёмная синь со звёздами правее границы bx (экран)
function nightCurtain(g, bx, t) {

// руки Дня: золотые полосы мазков из солнца, на концах ладони-лучи. p 0…1
function dayArms(g, sx, sy, p, t) {
  if (p <= 0) return;
  for (const sd of [-1, 1]) {
    const L = (sd > 0 ? 860 : 520) * p;
    const N = Math.max(2, Math.floor(L / 22));
    const path = [];
    for (let i = 0; i <= N; i++) {
      const u = i / N, d = u * L;
      path.push([sx + sd * d, sy - Math.sin(u * Math.PI * 0.85) * 210 * p - u * 120 * p + Math.sin(d * 0.015 - t * 4) * 6]);
    }
    // рукав из света: 5 рядов мазков, к кисти уже
    for (let i = 1; i < path.length; i++) {
      const [x, y] = path[i], [x0, y0] = path[i - 1], u = i / N;
      const a = Math.atan2(y - y0, x - x0), nx = -Math.sin(a), ny = Math.cos(a);
      const half = lerp(70, 26, u);
      for (let r = -2; r <= 2; r++) {

        dab(g, x + nx * off, y + ny * off, 60, half * 0.55, a + (hash(i * 7 + r) - 0.5) * 0.15, jit(mix(C.white, C.cad, Math.abs(r) / 2 * 0.8 + u * 0.2), i * 5 + r + sd * 400, 22), (0.55 + 0.35 * (1 - Math.abs(r) / 2)) * clamp(p * 3));

    blob(g, lx, ly, 34, 30, C.lemon, 61, 6);
    for (let f = 0; f < 5; f++) {
      const fa = la + (f - 2) * 0.36 - sd * 0.1;
      for (let j = 1; j <= 3; j++) dab(g, lx + Math.cos(fa) * (20 + j * 22), ly + Math.sin(fa) * (20 + j * 22), 34, 17 - j * 3, fa, jit(C.lemon, f * 10 + j, 16), 0.95);
    }
  }
  reset(g);
}
// веки солнца-ока: облачные мазки вне миндалины; open 0…1
function sunLids(g, cx, cy, r, open, td) {

  const alm = (hh) => { g.moveTo(cx + Rw, cy); g.quadraticCurveTo(cx, cy - hh * 2, cx - Rw, cy); g.quadraticCurveTo(cx, cy + hh * 2, cx + Rw, cy); };

  for (let y = cy - Ho * 1.1; y < cy + Ho * 1.1; y += r * 0.17) for (let x = cx - Rw; x < cx + Rw; x += r * 0.36) {
    n++;

  if (open > 0.15) for (let i = 1; i < 8; i++) {
    const u = i / 8, x = lerp(cx - Rw, cx + Rw, u), y = cy - h * 2 * 2 * u * (1 - u);
    const a = -Math.PI / 2 + (u - 0.5) * 1.6;

  }
  reset(g);
}
// гнездо примятой ржи (вид сверху)
function strawNest(g, cx, cy, t, td) {

const ROW_B = HZ + 330;                 // ряд нивы, по которому он бежит

const RUN_T0 = () => EV.L2 - 0.15;
const XB_AT = (t) => (MEZHA_X - (ROW_B - HZ) * 0.7 - 30) + RUN_V * (t - EV.do);
function boyJump(xb) {
  const dx = xb + (ROW_B - HZ) * 0.7 - MEZHA_X;
  const per = 2600, q = ((dx % per) + per * 1.5) % per - per / 2;
  return Math.abs(q) < 115 ? Math.sin(Math.PI * (q + 115) / 230) * 62 : 0;
}

  const V = { x: lerp(-150, 2450, u), y: HZ - 120, z: 0.62 };
  drawSky(g, V, t);
  const sp = sunPos(t); drawSun(g, ...P(V, sp[0], sp[1]), 70 * V.z, t);
  drawField(g, V, t, { stooks: 1 });
  birds(g, t - EV.L10, 1700, 280, -260, 7, 1.8);
}
function sEyeClose(g, t) {
  const V = { x: -60, y: HZ - 120, z: 1.1 };
  drawSky(g, V, t);
  const [ex, ey] = P(V, -120, HZ - 70);
  const sink = ease(inv(EV.smezh - 0.2, EV.nebo + 0.2, t));
  drawSun(g, ex, ey + sink * 40, 80 * V.z, t, 1 - sink * 0.3);
  // зрачок-искра в центре солнца: око
  reset(g); g.fillStyle = css(C.verm); g.beginPath(); g.arc(ex, ey + sink * 40, 22, 0, TAU); g.fill();
  sunLids(g, ex, ey, 80 * V.z, 1 - ease(inv(EV.smezh - 0.15, EV.smezh + 0.45, t)), todAt(t));
  drawField(g, V, t);
}
function sLie(g, t) {
  const td = todAt(t);
  const zoom = 1 + (t - EV.nebo) * 0.04, rot = Math.sin(t * 0.3) * 0.04;
  g.setTransform(zoom * Math.cos(rot), zoom * Math.sin(rot), -zoom * Math.sin(rot), zoom * Math.cos(rot), W / 2 - W / 2 * zoom, H / 2 - H / 2 * zoom);
  strawNest(g, 960, 400, t, td);
  const eyes = t < EV.oko ? 1 - ease(inv(EV.nebo - 0.1, EV.nebo + 0.3, t)) : ease(inv(EV.oko + 0.15, EV.oko + 0.5, t));
  const pb = 0.85;
  drawBoyFront(g, 960, 660, 2.3, { arms: pb, lie: true, eyes, tilt: -0.08, lit: Math.min(1, fieldLight(td) + 0.38), cool: 0.6 * (1 - ease(inv(EV.oko - 0.1, EV.oko + 0.6, t))), env: mix([80, 80, 150], [236, 180, 80], ease(inv(EV.oko - 0.1, EV.oko + 0.6, t))), warm: ease(inv(EV.oko - 0.1, EV.oko + 0.6, t)) * 0.5, smile: t < EV.oko ? 0.3 : 0.3 + ease(inv(EV.oko + 0.3, EV.oko + 0.8, t)) * 0.7 }, t);
  // тёмная синь ночи / золотой рассвет поверх
  reset(g);
  const dark = clamp((0.95 - fieldLight(td)) * 0.9);
  g.fillStyle = `rgba(20,24,70,${(dark * 0.55).toFixed(3)})`; g.fillRect(0, 0, W, H);
  const dawn = ease(inv(EV.oko - 0.1, EV.oko + 0.6, t));
  if (dawn > 0) {
    const gr = g.createLinearGradient(W, 0, 0, 0);
    gr.addColorStop(0, `rgba(255,200,90,${(0.32 * dawn).toFixed(3)})`); gr.addColorStop(lerp(0.05, 1, dawn), "rgba(255,200,90,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
}
function sOko(g, t) {
  const u = ease(inv(EV.oko2 - 0.1, EV.fin, t));
  const V = camLerp({ x: 2300, y: HZ - 90, z: 1.25 }, { x: 2150, y: HZ - 160, z: 0.8 }, u);
  drawSky(g, V, t);
  const sp = sunPos(t), [sx, sy] = P(V, sp[0], sp[1]);
  // огонь: языки мазков вырываются из ока
  const fire = ease(inv(EV.oko2 - 0.05, EV.oko2 + 0.6, t));
  for (let i = 0; i < 46; i++) {
    const a = i / 46 * TAU, L = (120 + hash(i) * 160) * fire * V.z * (0.8 + 0.2 * Math.sin(t * 9 + i));
    for (let j = 1; j <= 4; j++) dab(g, sx + Math.cos(a) * (70 * V.z + L * j / 4), sy + Math.sin(a) * (70 * V.z + L * j / 4), 40 * V.z, (16 - j * 2) * V.z, a, mix(C.cad, C.verm, j / 4), 0.85 * fire * (1 - j / 5));
  }
  drawSun(g, sx, sy, 78 * V.z, t, 1, 1);
  sunLids(g, sx, sy, 78 * V.z, ease(inv(EV.oko2 - 0.25, EV.oko2 + 0.35, t)), todAt(t));
  drawField(g, V, t, { stooks: 1 });
}
function sOutro(g, t) {
  const u = inv(EV.fin, CFG.total, t);
  const V = { x: 1800 - u * 60, y: HZ - 170, z: 0.8 };
  drawSky(g, V, t);
  const sp = sunPos(t); drawSun(g, ...P(V, sp[0], sp[1]), 78 * V.z, t);
  drawField(g, V, t, { stooks: 1 });
  drawKite(g, 1720 + Math.sin(t * 1.2) * 18, 300 + Math.cos(t * 1.7) * 12, 0.7, 0.15, t, null);
  // тёмная виньетка под заголовком для читаемости
  reset(g);
  const gr = g.createRadialGradient(W / 2, 400, 100, W / 2, 400, 900);
  gr.addColorStop(0, "rgba(30,20,40,0.38)"); gr.addColorStop(1, "rgba(30,20,40,0)");
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  drawTitle(g, W / 2, 380, 150, inv(EV.fin + 0.1, EV.fin + 1.3, t), clamp((t - EV.fin - 1.0) / 0.5), false);
}

// [функция, начало, переход в неё]
const SCENES = [
  [sIntro, 0, ""],
  [sMacro, EV.L1 - 0.1, "gust"],
  [sRun, EV.L2 - 0.15, "gust"],
  [sMoonPeek, EV.L5 - 0.25, "rise"],
  [sFace, EV.ochi - 0.1, "fade"],
  [sMoonSurprise, EV.L6 - 0.1, "fade"],
  [sDayArms, EV.L7 - 0.15, "gust"],
  [sCrane, EV.L9 - 0.15, "gust"],
  [sPan, EV.L10 - 0.1, "fade"],
  [sEyeClose, EV.L11 - 0.1, "cut"],
  [sLie, EV.nebo - 0.05, "cut"],
  [sOko, EV.oko2 - 0.1, "flash"],
  [sOutro, EV.fin, "gust"],
];

// ---------- Склейка: сцена → строки → холст → переходы ----------
const cv = document.getElementById("scene");
const g = cv.getContext("2d", { alpha: false });
const TOTAL = CFG.total;

// переход «порыв»: полоса мазков проносится слева направо и закрывает склейку; u 0…1 (0.5 — склейка)
function gustWipe(g, u, warm) {
  if (u <= 0 || u >= 1) return;
  const cx = lerp(-1300, W + 1300, u);
  for (let i = 0; i < 240; i++) {
    const row = i % 24, k = Math.floor(i / 24);
    const y = row * 48 - 20 + hash(i) * 20;
    const x = cx + (k - 5) * 120 + (hash(i * 3) - 0.5) * 120 + Math.sin(row * 0.7) * 120;
    dab(g, x, y, 260, 64, -0.08 + (hash(i * 5) - 0.5) * 0.2, jit(warm ? mix(C.cad, C.cream, hash(i * 7)) : mix(C.cerul, C.cream, hash(i * 7)), i, 30), 0.97);
  }
  reset(g);
}
// «вверх»: мазки летят снизу вверх (камера за змеем в небо)
function riseWipe(g, u) {
  if (u <= 0 || u >= 1) return;
  const cy = lerp(H + 1200, -1200, u);
  for (let i = 0; i < 240; i++) {
    const col = i % 20, k = Math.floor(i / 20);
    const x = col * 104 - 20 + hash(i) * 30;
    const y = cy + (k - 6) * 110 + (hash(i * 3) - 0.5) * 110 + Math.sin(col * 0.8) * 100;
    dab(g, x, y, 240, 70, -Math.PI / 2 + (hash(i * 5) - 0.5) * 0.2, jit(mix([240, 160, 120], [150, 130, 200], hash(i * 7)), i, 30), 0.97);
  }
  reset(g);
}
function flash(g, a) { if (a <= 0) return; reset(g); g.fillStyle = `rgba(255,236,170,${clamp(a).toFixed(3)})`; g.fillRect(0, 0, W, H); }

// наплыв: соседняя сцена рисуется в отдельный холст и проступает поверх (в момент склейки — 50 %)
const offC = document.createElement("canvas"); offC.width = W; offC.height = H;
const og = offC.getContext("2d", { alpha: false });
const FADE = 0.5;
function blendScene(j, t, a) {
  if (a <= 0 || j < 0 || j >= SCENES.length) return;
  reset(og); og.fillStyle = "#1a1430"; og.fillRect(0, 0, W, H);
  SCENES[j][0](og, t, t - SCENES[j][1]); reset(og);
  reset(g); g.globalAlpha = clamp(a); g.drawImage(offC, 0, 0); reset(g);
}
function wipePart(j, t, region) {
  if (j < 0 || j >= SCENES.length) return;
  reset(og); og.fillStyle = "#1a1430"; og.fillRect(0, 0, W, H);
  SCENES[j][0](og, t, t - SCENES[j][1]); reset(og);
  reset(g); g.save(); g.beginPath(); region(g); g.clip(); g.drawImage(offC, 0, 0); g.restore(); reset(g);
}
function render(t) {
  let i = 0;
  while (i + 1 < SCENES.length && t >= SCENES[i + 1][1]) i++;
  const [fn, start, kind] = SCENES[i];
  reset(g); g.globalCompositeOperation = "source-over";
  g.fillStyle = "#1a1430"; g.fillRect(0, 0, W, H);
  fn(g, t, t - start);
  reset(g);
  // шторка: за полосой мазков уже новая сцена, перед ней — ещё старая (обе рисуются, шов под полосой)
  const D = 0.65, next = SCENES[i + 1], till = next ? next[1] - t : 99, nk = next && next[2], u0 = t - start;
  const gx = (u) => lerp(-1300, W + 1300, u) - 60, ry = (u) => lerp(H + 1200, -1200, u) - 55;
  if (nk === "gust" && till < D / 2) wipePart(i + 1, t, (c) => c.rect(-10, -10, gx(0.5 - till / D) + 10, H + 20));
  if (kind === "gust" && u0 < D / 2) wipePart(i - 1, t, (c) => { const x = gx(0.5 + u0 / D); c.rect(x, -10, W - x + 10, H + 20); });
  if (nk === "rise" && till < D / 2) wipePart(i + 1, t, (c) => { const y = ry(0.5 - till / D); c.rect(-10, y, W + 20, H - y + 10); });
  if (kind === "rise" && u0 < D / 2) wipePart(i - 1, t, (c) => c.rect(-10, -10, W + 20, ry(0.5 + u0 / D) + 10));
  { const nx = SCENES[i + 1], tl = nx ? nx[1] - t : 99, u = t - start;
    if (nx && nx[2] === "fade" && tl < FADE / 2) blendScene(i + 1, t, ease(0.5 - tl / FADE) );
    if (kind === "fade" && u < FADE / 2) blendScene(i - 1, t, ease(0.5 - u / FADE)); }
  canvasGrain(g, 0.22);
  // вспышка — под подписью, чтобы строка не мигала
  if (kind === "flash") flash(g, 0.85 * (1 - (t - start) / 0.35));
  if (SCENES[i + 1] && SCENES[i + 1][2] === "flash" && SCENES[i + 1][1] - t < 0.12) flash(g, 0.85 * (1 - (SCENES[i + 1][1] - t) / 0.12));
  drawVerse(g, t);
  // полоса мазков поверх шва
  if (kind === "gust" && u0 < D / 2) gustWipe(g, 0.5 + u0 / D, i !== 6);
  if (nk === "gust" && till < D / 2) gustWipe(g, 0.5 - till / D, i + 1 !== 6);
  if (kind === "rise" && u0 < D / 2) riseWipe(g, 0.5 + u0 / D);
  if (nk === "rise" && till < D / 2) riseWipe(g, 0.5 - till / D);
  if (t < 0.25) { reset(g); g.fillStyle = `rgba(26,20,48,${(1 - t / 0.25).toFixed(3)})`; g.fillRect(0, 0, W, H); }
  if (t > TOTAL - 0.7) { reset(g); g.fillStyle = `rgba(26,20,48,${clamp((t - TOTAL + 0.7) / 0.6).toFixed(3)})`; g.fillRect(0, 0, W, H); }
  reset(g);
}

// ---------- Проба: все позы мальчика крупно ----------
function probeBoy() {
  reset(g); g.fillStyle = "#e9dcc0"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#333"; g.font = "22px monospace";
  // бег: 8 фаз цикла + прыжок
  for (let k = 0; k < 8; k++) {
    const x = 120 + k * 230, y = 330;
    g.strokeStyle = "#999"; g.beginPath(); g.moveTo(x - 100, y); g.lineTo(x + 100, y); g.stroke();
    drawBoySide(g, x, y, 1, 1, { kind: "run", dist: k / 8 * STRIDE, holdRel: [-50, -30] }, k * 0.1);
    reset(g); g.fillStyle = "#333"; g.font = "22px monospace"; g.fillText(`run ${k}/8`, x - 50, y + 40);
  }
  const extra = [
    ["jump", { kind: "run", dist: STRIDE * 0.3, jump: 62, holdRel: [-50, -30] }],
    ["stand", { kind: "stand", look: 1, holdRel: [-50, -30] }],
  ];
  extra.forEach(([lab, o], k) => {
    const x = 160 + k * 260, y = 720;
    g.strokeStyle = "#999"; g.beginPath(); g.moveTo(x - 100, y); g.lineTo(x + 100, y); g.stroke();
    drawBoySide(g, x, y, 1, 1, o, 0);
    reset(g); g.fillStyle = "#333"; g.font = "22px monospace"; g.fillText(lab, x - 40, y + 40);
  });
  [[0, 1, false], [0.5, 1, false], [1, 1, false], [0.85, 1, true], [0.85, 0, true]].forEach(([arms, eyes, lie], k) => {
    const x = 760 + k * 250, y = 720;
    drawBoyFront(g, x, y, 0.95, { arms, eyes, lie, smile: 1, tilt: lie ? -0.08 : 0.12, lookUp: 1 }, k * 0.7);
    reset(g); g.fillStyle = "#333"; g.font = "22px monospace"; g.fillText(`front a${arms}${lie ? " lie" : ""} e${eyes}`, x - 90, y + 40);
  });
  drawFaceClose(g, 1700, 940, 0.25, 0, { lookY: 1, moon: 1 });
}

const PQ = new URLSearchParams(location.search);
const T_Q = PQ.has("t") ? +PQ.get("t") : 0;
let LAST_T = T_Q;
const seek = (t) => (CFG.probe === "boy" ? probeBoy() : render(t));
window.addEventListener("hf-seek", (e) => { LAST_T = e.detail.time; seek(LAST_T); });
seek(T_Q);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => seek(LAST_T));

const tl = gsap.timeline({ paused: true });
tl.set({}, {}, TOTAL);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;

    </script>
