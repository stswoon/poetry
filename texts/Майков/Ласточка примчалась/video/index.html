        for (const w of WIPES) { const pad = 0.28; if (t < w.a - pad || t > w.b + pad) continue; const inn = sstep(prog(t, w.a - pad, w.a)), out = sstep(prog(t, w.b, w.b + pad)); const x = wipeX(w, t) + 30, y = wipeY(w, t); eraserSprite(ov, lerp(x + 260, x, inn) + out * 260, lerp(y - 720, y, inn) - out * 720, -0.32 + 0.12 * Math.sin(t * 34)); }
        const L = penAt(LJOBS, t); if (L) pencil(ov, L.x, L.y, L.col, ANG_L + 0.05 * Math.sin(t * 13), 300);
        const R = penAt(RJOBS, t); if (R) pencil(ov, R.x, R.y, R.col, ANG - 0.05 * Math.sin(t * 11));

        // ластик стирает текст
        for (const w of WIPES) if (w.host) { const el = document.getElementById(w.host); const x = t <= w.a ? 0 : wipeX(w, t); el.style.clipPath = t <= w.a ? "none" : `inset(0 0 0 ${x}px)`; }
      }

      // ---------- Framer Motion: текст ----------
      const seq = [];
      for (const c of chars) seq.push([c.el, { opacity: [0, 1] }, { at: Math.max(0, c.at), duration: 0.09, ease: "linear" }]);
      for (const w of document.querySelectorAll(".pop")) { const at = parseFloat(w.dataset.word); seq.push([w, { transform: ["translateY(0px) scale(1)", "translateY(-7px) scale(1.1)", "translateY(0px) scale(1)"] }, { at: at + 0.12, duration: 0.42, ease: "easeOut" }]); }
      const main = Motion.animate(seq);
      main.pause();
      const seek = (t) => { renderAt(t); main.time = t; };
      window.addEventListener("hf-seek", (e) => seek(e.detail.time));
      seek(0);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => seek(main.time || 0));

      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, TOTAL);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
