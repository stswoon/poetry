function drawText(c, s, x, y, color, sc, opt) {

// ---------- служебное: время, пружины, примитивы пиксельной графики ----------

// на 1920×900 без сглаживания (×2). Примитивы принимают координаты в единицах и растрируют по мелкой сетке:
// круги, наклоны и детали втрое мельче, чем в v1. Текст и HUD рисуются поверх в полном разрешении.
const LW = 320, LH = 180, SC = 6; // единицы экрана и экранных пикселей на единицу
const K = 3;                        // пикселей буфера на единицу

// пружина Framer Motion как функция времени: 0 → 1 с перелётом
function makeSpring(o) {
  const gen = Motion.spring(Object.assign({ keyframes: [0, 1] }, o));
  const pts = [];
  for (let i = 0; i <= 300; i++) pts.push(gen.next(i * 10).value);
  return (s) => { if (s <= 0) return 0; const f = s * 100; if (f >= 300) return 1; const i = Math.floor(f); return lerp(pts[i], pts[i + 1], f - i); };

const springPop = makeSpring({ stiffness: 260, damping: 13, mass: 1 });
const springSoft = makeSpring({ stiffness: 110, damping: 17, mass: 1 });

// время событий из сборки: L(n) — начало строки n, LE(n) — конец, W(k) — слово или событие
const L = (n) => CFG.lines[n - 1].s;
const LE = (n) => CFG.lines[n - 1].e;
const W = (k) => { const v = CFG.ev[k]; if (v === undefined) throw new Error("нет события " + k); return v; };

// прямоугольник в единицах
function rect(c, x, y, w, h, col) {

}
// «пиксель» в единицу (3×3) и мелкий пиксель буфера n×n в точке (x, y) единиц
function px(c, x, y, col) { rect(c, R(x), R(y), 1, 1, col); }

// круг и эллипс построчно по мелкой сетке

function disc(c, x, y, r, col) { ell(c, x, y, r, r, col); }
// линия толщиной w единиц: круглая кисть по мелкой сетке
const BRUSH = {};

    for (let i = 0; i < P.length; i++) {

// двухзвенная IK: от точки a к цели b, звенья l1/l2; bend = +1/−1 — в какую сторону гнуть сустав

// ---------- Герой: мальчик в синем пальто, красной шапке и жёлтом шарфе ----------
// Рисуется в буфер игры. Скелет в локальных координатах: x — вперёд по взгляду, y — вверх от земли.
// Порядок слоёв: хвост шарфа, дальняя рука, дальняя нога, ближняя нога, пальто, голова, ближняя рука.
// Дальнее плечо вынесено за спину (x = −4.5), чтобы дальняя рука читалась и при опущенной руке.
const HC = {

  pants: "#33385c", pantsD: "#22253f",
  boot: "#4a2a16", bootL: "#7a4a26",
  skin: "#f4c49c", skinD: "#d89a72", cheek: "#ee6a68",
  hat: "#d8323a", hatD: "#9c1f2a", hatBand: "#f6efe0",
  scarf: "#ffc93a", scarfD: "#d89a18",
  mitt: "#d8323a", mittD: "#9c1f2a",
  hair: "#6a3a1c", eye: "#1a1420",

const THIGH = 4.6, SHIN = 4.6, UPARM = 4.2, FOREARM = 4.0;

// поза по умолчанию: стоит, руки опущены
function poseStand(t) {
  const br = Math.sin(t * 2.4) * 0.25;
  return {
    lift: 0, hipY: 10.2 + br * 0.3, lean: 0.02,
    feet: [[-1.6, 0], [1.6, 0]],
    hands: [[-0.6, 7.6 + br], [1.0, 7.6 + br]], elbows: ["back", "back"],
    tilt: 0, mouth: "smile", eyes: "open", blush: 0.5, scarfWave: 0.3,
  };
}

// бег: фаза — функция пройденного пути, ступня в опоре стоит в точке мира (без «лунной походки»)
const STRIDE = 8;
function poseRun(dist, t, speed = 1) {
  const ph = dist / (2 * STRIDE);
  const leg = (u) => {
    u = u - Math.floor(u);
    if (u < 0.5) { const v = u / 0.5; return [STRIDE / 2 - v * STRIDE, 0]; }
    const v = (u - 0.5) / 0.5, s = v * v * (3 - 2 * v);
    return [-STRIDE / 2 + s * STRIDE, Math.sin(Math.PI * v) * 4.2 * speed];
  };

  const sw = Math.sin(ph * TAU); // >0: ближняя нога в опоре и уходит назад
  const bob = Math.abs(Math.cos(ph * TAU * 2)) * 0.7;
  return {
    lift: 0, hipY: 9.0 + bob, lean: 0.22 * speed,
    feet: [far, near],
    // руки вразнобой с ногами: ближняя рука идёт вперёд, когда ближняя нога уходит назад
    hands: [[-2.2 - sw * 3.4, 5.6 - Math.abs(sw) * 0.8], [1.2 + sw * 3.6, 5.6 - Math.abs(sw) * 0.8]], elbows: ["back", "back"],
    tilt: 0, mouth: "smile", eyes: "open", blush: 0.8, scarfWave: 1,
  };
}

// прыжок: k — 0…1 по полёту
function poseJump(k, t) {
  const h = Math.sin(Math.PI * clamp(k)) * 16;
  return {
    lift: h, hipY: 9.0, lean: 0.12,
    feet: [[-2.6, 2.6], [2.4, 3.6]],
    hands: [[-3.6, -2.4], [3.4, -3.0]], elbows: ["down", "down"],
    tilt: -0.4, mouth: "open", eyes: "open", blush: 0.8, scarfWave: 1,
  };
}

function lerpPose(a, b, u) {
  const o = Object.assign({}, u < 0.5 ? a : b);
  const L2 = (p, q) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
  o.lift = lerp(a.lift, b.lift, u); o.hipY = lerp(a.hipY, b.hipY, u); o.lean = lerp(a.lean, b.lean, u);
  o.feet = [L2(a.feet[0], b.feet[0]), L2(a.feet[1], b.feet[1])];
  o.hands = [L2(a.hands[0], b.hands[0]), L2(a.hands[1], b.hands[1])];
  o.tilt = lerp(a.tilt, b.tilt, u); o.blush = lerp(a.blush, b.blush, u); o.scarfWave = lerp(a.scarfWave, b.scarfWave, u);

}

// x, y — точка на земле под героем (в единицах буфера); dir = +1 смотрит вправо, −1 — влево.
// v2: герой рисуется на отдельный холст по мелкой сетке ×3, затем кладётся в мир с тёмным контуром в 1 пиксель.
const HBOX = { w: 52, h: 68, ox: 26, oy: 62 }; // размер холста героя и где на нём точка земли (единицы)
const heroCv = document.createElement("canvas"); heroCv.width = HBOX.w * K; heroCv.height = HBOX.h * K;
const heroCtx = heroCv.getContext("2d");
function drawHero(c, x, y, P, dir, t) {
  heroCtx.clearRect(0, 0, heroCv.width, heroCv.height);
  const gx = Math.round(x * K), gy = Math.round(y * K);
  drawHeroBody(heroCtx, HBOX.ox + (x * K - gx) / K, HBOX.oy + (y * K - gy) / K, P, dir, t);
  outlined(c, heroCv, gx - HBOX.ox * K, gy - HBOX.oy * K, "#1b1226");
}

function drawHeroBody(c, x, y, P, dir, t) {

    line(c, A[0], A[1], kn[0], kn[1], cPants, 2);
    line(c, kn[0], kn[1], kn[2], kn[3], cPants, 2);

    dp(c, kn[0] - 0.3 * dir, kn[1] - 0.2, mix(cPants, "#000000", 0.25), 2);
    // сапог: голенище и носок, подошва темнее, блик сверху
    const sx = kn[2], sy = kn[3];
    const bx0 = dir > 0 ? sx - 1.2 : sx - 2.8;
    if (inked) rect(c, bx0 - 0.34, sy - 0.34, 4.68, 2.68, INK);
    rect(c, bx0, sy, 4, 2, cBoot);
    ell(c, dir > 0 ? bx0 + 3.3 : bx0 + 0.7, sy + 1.1, 0.9, 0.9, cBoot);
    rect(c, bx0, sy + 1.67, 4, 0.34, "#1e120a");
    rect(c, dir > 0 ? bx0 + 0.34 : bx0 + 1.0, sy + 0.34, 2.6, 0.34, cBootL);
    rect(c, bx0, sy - 0.34, 4, 0.34, mix(cBoot, "#ffffff", 0.15)); // отворот голенища
  }
  // ---- рука: от плеча к кисти; варежка с большим пальцем и манжетой ----
  function arm(sh, hand, pref, cSleeve, cMitt, inked) {
    const A = S(sh[0], sh[1]), B = [A[0] + hand[0] * dir, A[1] + hand[1]];
    const e1 = ik(A[0], A[1], B[0], B[1], UPARM, FOREARM, 1), e2 = ik(A[0], A[1], B[0], B[1], UPARM, FOREARM, -1);

    if (inked) { line(c, A[0], A[1], el[0], el[1], INK, 2.7); line(c, el[0], el[1], el[2], el[3], INK, 2.7); }
    line(c, A[0], A[1], el[0], el[1], cSleeve, 2);
    line(c, el[0], el[1], el[2], el[3], cSleeve, 2);
    // манжета у кисти
    const fx = el[2] - el[0], fy = el[3] - el[1], fl = Math.hypot(fx, fy) || 1;
    const cx = el[2] - fx / fl * 0.7, cy = el[3] - fy / fl * 0.7;
    disc(c, cx, cy, 1.05, "#f6efe0");
    // варежка и большой палец
    if (inked) disc(c, el[2], el[3], 1.45, INK);
    disc(c, el[2], el[3], 1.1, cMitt);
    disc(c, el[2] + 0.8 * dir, el[3] - 0.5, 0.5, cMitt);
    dp(c, el[2] - 0.5, el[3] - 0.7, mix(cMitt, "#ffffff", 0.35), 1);
    return [el[2], el[3]];
  }

  // хвост шарфа за спиной (крепится к шее): полоски и бахрома на конце
  const nk = S(neck[0] - 1, neck[1] - 0.5);
  const wv = P.scarfWave || 0;
  let prev = nk;
  for (let i = 1; i <= 5; i++) {
    const sx = nk[0] - i * 1.3 * dir, sy = nk[1] + i * (0.9 - wv * 0.6) + Math.sin(t * 9 + i * 1.3) * wv * 0.7;
    line(c, prev[0], prev[1], sx, sy, i % 2 ? HC.scarf : HC.scarfD, i > 3 ? 1.1 : 1.6);
    if (i === 5) for (let f = -1; f <= 1; f++) line(c, sx, sy, sx - 0.9 * dir, sy + 0.5 + f * 0.45, HC.scarfD, 0.34);
    prev = [sx, sy];
  }

  if (!P.farFront) arm(shF, P.hands[0], P.elbows[0], HC.coatD, HC.mittD, false);
  if (!P.legsFront) {
    leg(hipF, P.feet[0], HC.pantsD, "#2e1a0e", HC.boot, false);
    leg(hipN, P.feet[1], HC.pants, HC.boot, HC.bootL, true);
  }

  // пальто: трапеция от плеч до подола (подол закрывает верх бёдер), тень со спины, блик спереди
  const hem = P.legsFront ? -0.4 : -1.7;
  const cp = [up(-3.6, 8.2), up(2.8, 8.2), up(4.0, hem), up(-4.6, hem)].map((p) => S(p[0], p[1]));
  poly(c, cp, HC.coat);
  poly(c, [up(-3.6, 8.2), up(-2.4, 8.2), up(-3.2, hem), up(-4.6, hem)].map((p) => S(p[0], p[1])), "#2852b8");
  const fr1 = S(...up(2.6, 7.6)), fr2 = S(...up(3.7, hem + 0.3));
  line(c, fr1[0], fr1[1], fr2[0], fr2[1], HC.coatL, 0.34);
  const hemL = S(...up(-4.6, hem)), hemR = S(...up(4.0, hem));
  line(c, hemL[0], hemL[1], hemR[0], hemR[1], HC.coatD, 0.67);
  // пояс с пряжкой, пуговицы, карман
  const belt = [S(...up(-4.2, 0.8)), S(...up(3.6, 0.8))];
  line(c, belt[0][0], belt[0][1], belt[1][0], belt[1][1], "#1c3478", 0.67);
  const bk = S(...up(1.8, 0.8)); rect(c, bk[0] - 0.45, bk[1] - 0.45, 0.9, 0.9, "#f0c840");
  for (const yy of [5.6, 3.4]) { const bt = S(...up(1.9, yy)); disc(c, bt[0], bt[1], 0.42, "#f0c840"); }
  const pk = S(...up(-1.6, -0.6)); rect(c, pk[0] - 1, pk[1] - 0.2, 2, 0.34, HC.coatD);
  // шарф на шее: толстый виток с полоской
  const n1 = S(...up(-3.2, 8.5)), n2 = S(...up(2.7, 8.5));
  line(c, n1[0], n1[1], n2[0], n2[1], HC.scarf, 2.1);
  line(c, n1[0], n1[1] + 0.2, n2[0], n2[1] + 0.2, HC.scarfD, 0.5);
  if (P.legsFront) {
    leg([hipF[0] - 0.6, hipF[1] + 0.6], P.feet[0], HC.pantsD, "#2e1a0e", HC.boot, false);
    leg(hipN, P.feet[1], HC.pants, HC.boot, HC.bootL, true);
  }
  if (P.farFront) arm(shF, P.hands[0], P.elbows[0], HC.coatD, HC.mittD, true);

  // ---- голова ----
  const hc = up(0.6, 12.2);
  const H = S(hc[0], hc[1]);
  const tilt = P.tilt || 0;
  disc(c, H[0], H[1], 3.6, HC.skinD);
  disc(c, H[0] + 0.25 * dir, H[1] - 0.2, 3.35, HC.skin);
  ell(c, H[0] - 2.5 * dir, H[1] + 0.2, 1.5, 2.2, HC.hair);           // волосы на затылке
  ell(c, H[0] - 0.7 * dir, H[1] + 0.5, 0.75, 1.05, HC.skinD);         // ухо
  dp(c, H[0] - 0.7 * dir, H[1] + 0.4, "#c07a5a", 1, 2);
  const fy = H[1] + tilt * 0.5;
  // нос
  disc(c, H[0] + 3.45 * dir, fy + 0.5, 0.6, HC.skin);
  dp(c, H[0] + 3.45 * dir - (dir > 0 ? 0 : 0.34), fy + 0.9, HC.skinD, 1);
  // щека
  if ((P.blush || 0) > 0.2) { c.globalAlpha = clamp(P.blush) * 0.85; ell(c, H[0] + 1.1 * dir, fy + 1.25, 1.0, 0.55, HC.cheek); c.globalAlpha = 1; }
  // рот
  const mx = H[0] + 2.2 * dir, my = fy + 2.1;
  if (P.mouth === "open") { ell(c, mx, my, 0.8, 0.7, "#6a1622"); ell(c, mx, my + 0.35, 0.45, 0.25, "#ee7a86"); }
  else if (P.mouth === "o") { ell(c, mx + 0.2 * dir, my, 0.42, 0.55, "#6a1622"); }
  else if (P.mouth === "sad") { line(c, mx - 0.8 * dir, my + 0.3, mx, my - 0.15, "#7a1e28", 0.34); line(c, mx, my - 0.15, mx + 0.7 * dir, my + 0.3, "#7a1e28", 0.34); }
  else { line(c, mx - 0.8 * dir, my - 0.3, mx, my + 0.2, "#7a1e28", 0.34); line(c, mx, my + 0.2, mx + 0.75 * dir, my - 0.25, "#7a1e28", 0.34); }
  // шапка: купол с резинкой-вязкой, отворот, помпон
  const hx = H[0] - (0.3 - tilt * 0.8) * dir, hy = H[1] - 1.6 + tilt * 0.7;
  ell(c, hx, hy - 1.4, 4.0, 2.6, HC.hat);
  for (let i = -3; i <= 3; i++) {
    const xx = hx + i * 1.05, top = hy - 1.4 - 2.6 * Math.sqrt(Math.max(0, 1 - ((i * 1.05) / 4) ** 2)) + 0.5;
    line(c, xx, top, xx, hy - 0.1, HC.hatD, 0.34);
  }
  dp(c, hx + 1.2 * dir, hy - 3.2, "#f06a70", 2, 1);
  rect(c, hx - 4.1, hy - 0.1, 8.2, 1.2, HC.hatBand);
  for (let i = 0; i < 8; i++) dp(c, hx - 3.7 + i, hy + 0.3, "#d8ccb6", 1);
  rect(c, hx - 4.1, hy + 1.1, 8.2, 0.34, "#c8b8a0");
  // чёлка из-под шапки
  for (let i = 0; i < 3; i++) line(c, hx + (0.6 + i * 0.7) * dir, hy + 1.2, hx + (0.4 + i * 0.7) * dir, hy + 2.0 - i * 0.15, HC.hair, 0.4);
  const ppx = hx - 2.4 * dir, ppy = hy - 4.6;
  disc(c, ppx, ppy, 1.7, "#d8cfc0"); disc(c, ppx - 0.2, ppy - 0.25, 1.4, HC.hatBand);
  dp(c, ppx - 0.7, ppy - 0.9, "#ffffff", 2);
  // глаз — поверх шапки, чтобы отворот его не закрыл: белок, зрачок, блик, бровь
  const ex = H[0] + 1.7 * dir;
  const ey = Math.max(H[1] - 0.6 + tilt * 0.8, hy + 1.6);
  if (P.eyes === "closed" || P.eyes === "happy") {
    line(c, ex - 0.6, ey + 0.35, ex, ey - 0.2, HC.eye, 0.34); line(c, ex, ey - 0.2, ex + 0.6, ey + 0.35, HC.eye, 0.34);
  } else {
    ell(c, ex, ey, 0.7, 0.95, "#ffffff");
    rect(c, ex + (dir > 0 ? -0.05 : -0.45) + tilt * 0, ey - 0.6 + Math.min(0, tilt) * 0.25, 0.5, 1.2, HC.eye);
    dp(c, ex + (dir > 0 ? 0.1 : -0.3), ey - 0.5 + Math.min(0, tilt) * 0.25, "#ffffff", 1);
  }
  const sad = P.mouth === "sad";
  line(c, ex - 0.8 * dir, ey - 1.3 + (sad ? 0.3 : 0), ex + 0.7 * dir, ey - 1.45 - (sad ? 0.35 : 0), HC.hair, 0.4);

  arm(shN, P.hands[1], P.elbows[1], HC.sleeve, HC.mitt, true);
}

// тень под героем: в прыжке сжимается
function heroShadow(c, x, y, lift) {
  const k = clamp(1 - lift / 24);
  c.globalAlpha = 0.35 * k + 0.1;
  ell(c, x, y + 0.5, 5 * k + 1.5, 1.2, "#2a1a10");
  c.globalAlpha = 1;
}

// ---------- Позы героя для сцен ----------
// hands — смещение кисти от плеча (x вперёд, y вниз), feet — ступня от бедра по x и высота подошвы над землёй.
// farFront: дальняя рука перед пальто (обнимает себя) — тогда она рисуется поверх туловища.
// farSh: дальнее плечо по x (по умолчанию −4.5, за спиной); ближе к груди — когда дальняя рука тянется вперёд.
function P0(o) { return Object.assign(poseStand(0), o); }

// топнуть: k 0…1 — нога поднимается, потом бьёт по земле
function poseStomp(k) {
  const up = k < 0.55 ? smooth(k / 0.55) : 1 - smooth((k - 0.55) / 0.12);
  return P0({ hipY: 10.2 - (k > 0.6 && k < 0.8 ? 0.8 : 0), lean: 0.05, feet: [[-1.8, 0], [2.6 + up * 0.8, up * 4.6]],
    hands: [[-2.8, 5.2 - up * 2], [3.2, 5.4 - up * 2.4]], elbows: ["down", "down"], mouth: up > 0.3 ? "open" : "smile", blush: 0.8 });
}
// пинок: замах назад, нога выстреливает вперёд-вверх
function poseKick(k) {
  const wind = k < 0.35 ? smooth(k / 0.35) : 1 - smooth((k - 0.35) / 0.15);
  const out = k < 0.35 ? 0 : k < 0.6 ? smooth((k - 0.35) / 0.25) : 1 - smooth((k - 0.7) / 0.3);
  return P0({ hipY: 9.2, lean: -0.08 * out + 0.06 * wind, feet: [[-1.2, 0], [lerp(-1, -4.5, wind) + out * 7.5, wind * 2.5 + out * 5.5]],
    hands: [[2.8 * out - 1.5, 5.4 - out * 2.5], [-2.6 * out + 0.6, 5.8]], elbows: ["down", "back"], mouth: out > 0.3 ? "open" : "smile", blush: 0.9 });
}
// развёл руками: «нет ничего»
function poseShrug(k) {
  const u = smooth(k);
  return P0({ hipY: 10.2, lean: -0.02, feet: [[-2, 0], [2, 0]],
    hands: [[lerp(-0.6, -4.2, u), lerp(7.6, 3.2, u)], [lerp(1, 4.6, u), lerp(7.6, 3.0, u)]], elbows: ["down", "down"],
    mouth: "sad", blush: 0.4, tilt: 0.2 * u });
}
// присел у кочки, ближняя рука тянется вниз. Дальняя (плечо сдвинуто вперёд) — far: [x, y] от плеча;
// по умолчанию кисть у подбородка («задумался»), она видна между пальто и головой
const CROUCH_CHIN = [7.0, 0.2], CROUCH_TALK = [7.6, 1.6];
function poseCrouch(k, reach, far) {
  const u = smooth(k), r = reach === undefined ? 1 : reach, f = far || CROUCH_CHIN;
  return P0({ hipY: lerp(10.2, 5.6, u), lean: lerp(0.02, 0.55, u), feet: [[-2.6, 0], [2.8, 0]], farSh: lerp(-4.5, -1.5, u),
    hands: [[lerp(-0.6, f[0], u), lerp(7.6, f[1], u)], [lerp(1, 5.6 + r, u), lerp(7.6, 6.6 + r * 1.4, u)]], elbows: ["down", "down"],
    mouth: "o", blush: 0.6, tilt: 0.3 * u });
}
// поскользнулся на инее: нога уезжает вперёд, руки машут
function poseSlip(k, t) {
  const u = Math.sin(Math.PI * clamp(k)), fl = Math.sin(t * 18) * 1.6 * u;
  return P0({ hipY: lerp(10.2, 8.2, u), lean: -0.32 * u, feet: [[-2.2 - u, 0], [2 + u * 4.5, u * 1.4]],
    hands: [[-2 - u * 2, 7.6 - u * 11 + fl], [1 + u * 2.5, 7.6 - u * 12 - fl]], elbows: ["down", "down"], mouth: u > 0.3 ? "o" : "smile", blush: 0.8 });
}
// ёжится от холода: обнял себя, дрожит
function poseShiver(k, t) {
  const u = smooth(k), sh = Math.sin(t * 40) * 0.35 * u;
  return P0({ hipY: 9.2, lean: 0.06 + sh * 0.05, feet: [[-1.2, 0], [1.2, 0]], farFront: u > 0.12,
    hands: [[lerp(-0.6, 7.8, u), lerp(7.6, 3.0, u)], [lerp(1, -3.6, u), lerp(7.6, 4.4, u)]], elbows: ["down", "down"],
    mouth: "sad", blush: 1, tilt: -0.6 * u });
}
// смотрит вверх, на небо
function poseLookUp(k) {
  return P0({ tilt: -1.4 * smooth(k), mouth: "o", blush: 0.9, hands: [[-1.2, 7.4], [1.6, 7.4]] });
}
// поёт: руки вверх, рот открыт, глаза-дуги
function poseSing(k, t) {
  const u = smooth(k), sw = Math.sin(t * 7) * 0.8;
  return P0({ hipY: 10.2, lean: -0.12 * u, feet: [[-2.2, 0], [2.2, 0]],
    hands: [[lerp(-0.6, -2.6 + sw, u), lerp(7.6, -6.4, u)], [lerp(1, 3.2 - sw, u), lerp(7.6, -6.6, u)]], elbows: ["down", "down"],
    mouth: "open", eyes: "happy", blush: 1, tilt: -0.5 * u, scarfWave: 0.8 });
}
// наклонился сорвать цветок
function posePick(k) {
  const u = smooth(k);
  // дальняя рука упирается в колено (плечо сдвинуто вперёд), ближняя тянется к земле
  return P0({ hipY: lerp(10.2, 8.2, u), lean: lerp(0.02, 0.85, u), feet: [[-2.2, 0], [2.4, 0]], farSh: lerp(-4.5, -1.5, u),
    hands: [[lerp(-0.6, 1.1, u), lerp(7.6, 6.4, u)], [lerp(1, 4.2, u), lerp(7.6, 9.6, u)]], elbows: ["back", "back"], mouth: "smile", blush: 0.7, tilt: 0.4 * u });
}
// сидит (на куче листьев, у окна): ноги вперёд, колени вверх
function poseSit(t, book) {
  const br = Math.sin(t * 2.2) * 0.2;
  // с альбомом: ближняя рука держит нижний край, дальняя (плечо сдвинуто вперёд, за туловищем) — левый край повыше
  return P0({ hipY: 2.2, lean: -0.06 + br * 0.05, feet: [[4.4, 0], [7.8, 0]], legsFront: true, farSh: book ? 0.5 : undefined,
    hands: book ? [[5.2, -1.6], [8.2, 3.6]] : [[-2.4, 7.0], [3.8, 5.2 + br]], elbows: ["down", "down"],
    mouth: "smile", eyes: book ? "happy" : "open", blush: 0.8, scarfWave: 0.2, knee: "up" });
}

// ---------- Мир: небо, дальний ельник, деревья, земля с листьями, падающие листья ----------
// Мир в единицах 320×150 (буфер 960×450, сетка ×3; нижние 30 единиц экрана — полоса почвы со строками, она рисуется отдельно).
const WH = 150, GY = 132; // высота мира и линия земли
const PAL = {
  sky: ["#3f86d6", "#5aa0e2", "#79b8ec", "#9bcdf2", "#bfe0f6", "#dff0f8"],
  far: "#2f6470", farD: "#24505b", farL: "#3f7a84",
  hill: "#6f8f5a",
  birch: "#efe9dc", birchD: "#3a3430",
  bark: "#5a3a26", barkD: "#3e2618",
  gold: ["#ffd23f", "#f6b21b", "#e8901a", "#ffe78a"],
  rust: ["#d8661e", "#b84a18", "#8f3414", "#f0904a"],
  crim: ["#d8344a", "#b02638", "#ef6a5a", "#8a1c30"],
  green: ["#5aa844", "#3f8a36", "#86c85a", "#2e6a2c"],
  ground: "#5a3e2a", groundD: "#402a1c", wet: "#3e2c22", puddle: "#9cc8e6", puddleD: "#6aa0c8",
  grass: "#8a8a3a", grassD: "#6a6a2a", moss: "#5e8a3a", mossD: "#46702c",
  frost: "#e6f4ff", frostD: "#b8d8ee",
};
const LEAFC = ["#ffd23f", "#f6b21b", "#e8901a", "#d8661e", "#d8344a", "#ffe78a", "#b84a18"];

// --- небо: полосы с дизерингом на стыках; season меняет цвета ---
function drawSky(c, o) {
  const cols = o.night ? ["#0e1430", "#141c40", "#1a2450", "#202c5c", "#28346a", "#303c74"]
    : o.season === "summer" ? ["#3a8ae0", "#4f9ae6", "#68aeec", "#86c2f0", "#a6d4f4", "#c8e6f8"]
    : o.season === "spring" ? ["#6aa6dc", "#80b6e4", "#98c6ea", "#b0d6f0", "#c8e2f4", "#e2f0f8"] : PAL.sky;
  const top = -40 + (o.camY || 0) * 0.2, bandH = (WH + 40 - 18) / cols.length;
  rect(c, 0, 0, LW, WH, cols[0]);
  for (let i = 1; i < cols.length; i++) {
    const y = R(top + i * bandH);
    rect(c, 0, y, LW, WH - y, cols[i]);
    dither(c, 0, y - 2, LW, 2, cols[i], 0);
  }
  if (o.night) { // звёзды
    for (let i = 0; i < 60; i++) {
      const x = R(hash(i * 3.1) * LW), y = R(hash(i * 7.7) * 90);
      if ((Math.sin(o.t * (2 + hash(i) * 3) + i) > -0.3)) { dp(c, x, y, i % 5 ? "#c8d4ff" : "#ffffff", i % 5 ? 2 : 3); if (i % 7 === 0) { dp(c, x - 0.67, y + 0.33, "#8090c0", 1); dp(c, x + 1, y + 0.33, "#8090c0", 1); } }
    }
    disc(c, 262, 26, 9, "#f4f0d0"); disc(c, 266, 23, 8, cols[1]); // месяц
    return;
  }
  // солнце: бледный диск с лучами-пикселями
  const sx = 258 - (o.cam || 0) * 0.02, sy = 30 + (o.camY || 0) * 0.2;
  disc(c, sx, sy, 12, "#fff0c0"); disc(c, sx, sy, 11, "#fff6d0"); disc(c, sx, sy, 9, "#fffbe8");
  for (let k = 0; k < 16; k++) {
    const a = k * TAU / 16 + (o.t || 0) * 0.2, r1 = 13.5 + (k % 2) * 2;
    line(c, sx + Math.cos(a) * r1, sy + Math.sin(a) * r1, sx + Math.cos(a) * (r1 + 1.5), sy + Math.sin(a) * (r1 + 1.5), "#fff6d0", 0.67);
  }
  // облака
  for (let i = 0; i < 4; i++) {
    const x = ((i * 97 + 30 - (o.cam || 0) * 0.06 + (o.t || 0) * 2) % 400 + 400) % 400 - 40;
    const y = 18 + i * 11 + (o.camY || 0) * 0.25;
    cloud(c, x, y, 10 + (i % 3) * 4);
  }
}
function cloud(c, x, y, w) {
  ell(c, x, y + 0.6, w, 3.0, "#d6e8f6");
  ell(c, x, y, w, 3.2, "#ffffff"); ell(c, x - w * 0.4, y - 2, w * 0.45, 3, "#ffffff"); ell(c, x + w * 0.3, y - 3, w * 0.4, 3.4, "#ffffff");
  ell(c, x + w * 0.2, y - 4.2, w * 0.2, 1.2, "#ffffff");
}

// --- дальний ельник на холме (параллакс 0.15) ---
function drawFar(c, o) {
  const off = (o.cam || 0) * 0.15, cy = (o.camY || 0) * 0.5;
  const winter = o.season === "winter";
  const base = 112 + cy;
  // холм
  const hillC = o.night ? "#1c2a3a" : winter ? "#c8d8e8" : o.season === "summer" ? "#5e9a50" : PAL.hill;
  for (let x = 0; x < LW; x += 1 / K) {
    const wx = x + off, h = Math.sin(wx * 0.021) * 4 + Math.sin(wx * 0.047 + 1) * 2;
    rect(c, x, base + h, 1 / K, WH - base - h, hillC);
    if (hash(Math.floor(wx * K) * 0.37) > 0.93) dp(c, x, base + h + 1 + hash(wx) * 6, mix(hillC, "#000000", 0.12), 1);
  }
  for (let i = -2; i < 26; i++) {

  rows.forEach((M, r) => {
    if (t < M.s - 0.12) return; // вторая строка пары появляется со своим голосом
    const k = springPop((t - (M.s - 0.12)) * 1.8);
    const w = textWidth(M.text) * sc;
    let x = R((1920 - w) / 2 / sc) * sc;
    const y = BAND_Y + 22 + r * lh + R((1 - k) * 30 / sc) * sc;
    g.globalAlpha = clamp(k * 1.5);
    for (const wd of M.words) {
      const said = t >= wd.s - 0.04, now = said && t < wd.e + 0.05;
      const col = now ? "#ffd23f" : said ? "#f8eedc" : "#9a8672";
      drawText(g, wd.w, x, y, col, sc, { shadow: "#120a06" });
      x += (textWidth(wd.w) + SPACE + GAP) * sc;
    }
    g.globalAlpha = 1;
  });
}

// ---------- HUD: листья ×N и четыре «секрета леса» ----------
const SECRETS = ["nut", "flower", "shroom", "berry"];
function icon(g, kind, x, y, s, dead) {

}
function panelBox(g, x, y, w, h, fill) {

function drawHud(g, t, st) {

// ---------- Заголовок «ОСЕНЬ»: свои толстые буквы с объёмом ----------
const TITLE_GLYPHS = {
  О: [".######.", "########", "##....##", "##....##", "##....##", "##....##", "##....##", "########", ".######."],
  С: [".#######", "########", "##......", "##......", "##......", "##......", "##......", "########", ".#######"],
  Е: ["#######", "#######", "##.....", "######.", "######.", "##.....", "##.....", "#######", "#######"],
  Н: ["##...##", "##...##", "##...##", "#######", "#######", "##...##", "##...##", "##...##", "##...##"],
  Ь: ["##.....", "##.....", "##.....", "######.", "#######", "##...##", "##...##", "#######", "######."],
};
const TITLE_FILL = ["#fff2a8", "#ffe066", "#ffd23f", "#ffc22e", "#ffb021", "#f89a1c", "#f08418", "#e86e16", "#d85a14"];
// cx — центр по x, y — верх букв, cell — размер клетки в экранных пикселях, t0 — когда буквы начинают влетать
function drawTitle(g, word, cx, y, cell, t, t0) {
  const letters = [...word];
  const ws = letters.map((ch) => TITLE_GLYPHS[ch][0].length);
  const total = ws.reduce((a, b) => a + b, 0) + (letters.length - 1) * 2;
  let x = R(cx - total * cell / 2);
  letters.forEach((ch, i) => {
    const k = t0 === undefined ? 1 : springPop((t - t0 - i * 0.12) * 1.5);
    if (k <= 0) { x += (ws[i] + 2) * cell; return; }
    const dy = R((1 - k) * -220), rows = TITLE_GLYPHS[ch];
    const bob = t0 === undefined ? 0 : R(Math.sin(t * 2.2 + i * 0.9) * 0.6) * R(cell / 3);
    const yy = y + dy + bob;
    const cellAt = (cx2, cy2, col) => { g.fillStyle = col; g.fillRect(x + cx2 * cell, yy + cy2 * cell, cell, cell); };
    // обводка: тёмная рамка на клетку вокруг
    rows.forEach((r, j) => { for (let q = 0; q < r.length; q++) if (r[q] === "#") { g.fillStyle = "#2a0e06"; g.fillRect(x + q * cell - R(cell / 2), yy + j * cell - R(cell / 2), cell * 2, cell * 2); } });
    // объём: сдвиг вниз-вправо
    rows.forEach((r, j) => { for (let q = 0; q < r.length; q++) if (r[q] === "#") { g.fillStyle = "#8a2c0c"; g.fillRect(x + q * cell + R(cell / 2), yy + j * cell + R(cell * 0.75), cell, cell); } });
    rows.forEach((r, j) => { for (let q = 0; q < r.length; q++) if (r[q] === "#") cellAt(q, j, TITLE_FILL[j]); });
    // блик
    rows.forEach((r, j) => { if (j < 2) for (let q = 0; q < r.length; q++) if (r[q] === "#" && (q + j) % 3 === 0) { g.fillStyle = "#ffffff"; g.fillRect(x + q * cell + 2, yy + j * cell + 2, R(cell / 3), R(cell / 3)); } });
    x += (ws[i] + 2) * cell;
  });
}

// ---------- Сцены «Осени». Время — из сборки: L(n) начало строки, LE(n) конец, W("слово") ----------
const HY = GY + 3; // линия подошв героя в буфере

// --- общие помощники ---
// дорожка героя: ключи [t, x]; между ключами — равномерный бег
function track(t, keys) {
  if (t <= keys[0][0]) return { x: keys[0][1], v: 0 };
  for (let i = 0; i + 1 < keys.length; i++) {
    const [t0, x0] = keys[i], [t1, x1] = keys[i + 1];
    if (t < t1) return { x: lerp(x0, x1, (t - t0) / (t1 - t0)), v: (x1 - x0) / (t1 - t0) };
  }
  return { x: keys[keys.length - 1][1], v: 0 };
}
function forest(b, t, o) {
  o.t = t;
  drawSky(b, o); drawFar(b, o); drawMid(b, o); drawNear(b, o); drawGround(b, o);
}
// вылет листьев из точки (x, y мира) с момента t0: фонтан с гравитацией
function burst(b, x, y, t0, t, n, seed, power) {
  const u = t - t0;
  if (u < 0 || u > 2.4) return;
  const pw = power || 1;
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (hash(seed + i * 1.3) - 0.5) * 2.2, v = (40 + hash(seed + i * 2.9) * 60) * pw;
    const px0 = x + Math.cos(a) * v * u + Math.sin(u * 6 + i) * 3, py = y + Math.sin(a) * v * u + 70 * u * u;
    if (py > y + 2) continue;
    const col = LEAFC[(i + seed) % LEAFC.length];
    if (((u * 8 + i) | 0) % 2) rect(b, px0, py, 2, 1, col); else rect(b, px0, py, 1, 2, col);
  }
}
// нота ♪ (в буфере мира)
function note(b, x, y, col) {
  x = R(x); y = R(y);
  rect(b, x + 2, y, 1, 6, "#2a1a10"); rect(b, x - 1, y + 4, 4, 3, "#2a1a10");
  rect(b, x + 2, y + 1, 1, 4, col); rect(b, x, y + 5, 2, 1, col); px(b, x + 3, y + 1, col); px(b, x + 4, y + 2, col);
}
function heart(b, x, y, col) {
  x = R(x); y = R(y);
  rect(b, x, y, 2, 1, col); rect(b, x + 3, y, 2, 1, col); rect(b, x - 1, y + 1, 7, 1, col); rect(b, x, y + 2, 5, 1, col); rect(b, x + 1, y + 3, 3, 1, col); px(b, x + 2, y + 4, col);
}
function notesFrom(b, x, y, t0, t, n, seed) {
  for (let i = 0; i < n; i++) {
    const st = t0 + i * 0.22, u = t - st;
    if (u < 0 || u > 1.6) continue;
    const side = i % 2 ? 1 : -1;
    note(b, x + side * (6 + u * 26 + hash(seed + i) * 8), y - u * 34 + Math.sin(u * 9 + i) * 2, ["#ffffff", "#ffd23f", "#ff9ad0", "#9ae0ff"][i % 4]);
  }
}
function bubble(b, x, y, w, h, tailX) { // облачко мысли/речи
  rect(b, x - 1, y, w + 2, h, "#2a1a10"); rect(b, x, y - 1, w, h + 2, "#2a1a10");
  rect(b, x, y, w, h, "#ffffff");
  rect(b, tailX, y + h, 2, 2, "#ffffff"); px(b, tailX - 1, y + h + 1, "#2a1a10"); px(b, tailX + 2, y + h, "#2a1a10"); px(b, tailX, y + h + 2, "#2a1a10");
}
// крупная экранная надпись-звук («ХРУСЬ!») над точкой мира
function sfxText(g, word, wx, wy, t0, t, col) {
  const u = t - t0;
  if (u < 0 || u > 0.9) return;
  const k = springPop(u * 2.2), [sx, sy] = scr(wx, wy);
  const sc = R(lerp(2, 5, clamp(k)));
  const w = textWidth(word) * sc;
  g.globalAlpha = clamp((0.9 - u) / 0.25);
  drawText(g, word, R(sx - w / 2), R(sy - 40 - u * 50), col || "#ffffff", sc, { edge: "#2a1206", shadow: "#2a1206" });
  g.globalAlpha = 1;
}
// куча листьев: холмик из листьев-пикселей, k 0…1 — насколько насыпана
function leafPile(b, x, y, w, h, k) {
  if (k <= 0) return;
  const hh = h * k;
  for (let j = 0; j < hh; j++) {
    const half = w * Math.sqrt(Math.max(0, 1 - ((hh - j) / hh) ** 2));
    for (let i = -half; i < half; i += 2) {
      const hs = hash(R(i) * 7.1 + j * 13.3);
      rect(b, x + i, y - j, 2, 1, LEAFC[Math.floor(hs * LEAFC.length)]);
      if (hs > 0.85) px(b, x + i + 1, y - j - 1, "#ffe78a");
    }
  }
}
// облачко-мечта над героем: рисунок внутри, потом красный крест и облачко лопается
// облачко мысли: овал с тёмной каймой и два кружка-«хвоста» к голове героя (hx, hy)
function thought(b, x, y, w, h, hx, hy) {
  const cx = x + w / 2, cy = y + h / 2;
  ell(b, cx, cy, w / 2 + 2, h / 2 + 2, "#2a1a10"); ell(b, cx, cy, w / 2 + 1, h / 2 + 1, "#ffffff");
  for (let k = 0; k < 5; k++) { const a = k * TAU / 5 + 0.3; disc(b, cx + Math.cos(a) * w * 0.42, cy + Math.sin(a) * h * 0.42, 5, "#ffffff"); }
  for (const [u, r] of [[0.45, 2.6], [0.75, 1.8]]) { const qx = lerp(hx, cx, 1 - u), qy = lerp(hy, cy + h / 2, 1 - u); disc(b, qx, qy, r + 1, "#2a1a10"); disc(b, qx, qy, r, "#ffffff"); }
}
function dreamBubble(b, x, y, t, t0, tX, t1, draw, hx, hy) {
  if (t < t0 || t > t1) return;
  const k = springPop((t - t0) * 2.2), pop = prog(t, t1 - 0.25, t1);
  const yy = R(y + (1 - clamp(k)) * 8);
  if (pop > 0) { for (let i = 0; i < 10; i++) { const a = i * TAU / 10; px(b, x + 18 + Math.cos(a) * (8 + pop * 14), yy + 10 + Math.sin(a) * (5 + pop * 8), "#ffffff"); } return; }
  thought(b, x, yy, 36, 22, hx, hy);
  draw(b, x, yy);
  if (t > tX) {
    const u = clamp((t - tX) / 0.25);
    for (let i = 0; i < 18 * u; i++) { rect(b, x + 4 + i * 1.6, yy + 2 + i, 3, 2, "#e8303a"); rect(b, x + 32 - i * 1.6, yy + 2 + i, 3, 2, "#e8303a"); }
  }
}
function heroAt(b, x, P, dir, t) { heroShadow(b, x, HY, P.lift || 0); drawHero(b, x, HY, P, dir, t); }

// счётчик листьев в HUD: копится от ковра, топота, бега и пинка
function leavesAt(t) {
  let n = 0;
  n += R(36 * smooth(prog(t, L(1), LE(2))));
  n += R(14 * prog(t, W("topchu"), W("topchu") + 0.5));
  n += R(30 * prog(t, L(6), LE(7)));
  n += R(84 * prog(t, W("zagreb"), W("zagreb") + 1.2));
  n += R(40 * prog(t, L(21), LE(21))) + R(55 * prog(t, L(33), LE(33))) + R(99 * prog(t, L(36), LE(36)));
  return Math.min(999, n);
}
const GONE = () => [W("oreh") + 0.35, W("cvetok") + 0.15, W("gruzd") + 0.45, W("kistey") + 0.3];
const hudGame = (t, extra) => Object.assign({ leaves: leavesAt(t), secrets: t > L(9) - 0.2, gone: GONE() }, extra || {});

// ===================== 0–1. Титр и первая строфа: лист кроет землю, герой топает =====================
function sc1(b, t) {
  const tStop = L(1) + 0.9;
  const cam = 20 + Math.min(t, tStop) * 9;
  const cover = lerp(0.25, 0.95, smooth(prog(t, L(1), LE(2) + 0.3)));
  const wet = lerp(1, 0.55, prog(t, L(1), LE(2)));
  const glint = between(t, W("veshn") - 0.1, LE(4)) ? Math.sin(Math.PI * prog(t, W("veshn") - 0.1, LE(4))) : 0;
  forest(b, t, { cam, cover, wet, springGlint: glint });
  // герой выбегает слева, тормозит и стоит, на «топчу» — два топота
  const camStop = 20 + tStop * 9;
  const tr = track(t, [[2.0, 20 + 2.0 * 9 - 40], [tStop, camStop + 130], [L(5) + 0.4, camStop + 130]]);
  const hx = tr.x - cam; // после остановки и камера, и герой стоят: земля под ним не едет
  let P, dir = 1;
  if (t < L(1) + 0.9) P = poseRun(tr.x, t);
  else if (between(t, W("topchu") - 0.15, W("topchu") + 1.1)) P = poseStomp(((t - W("topchu") + 0.15) / 0.62) % 1);
  else if (between(t, L(2) - 0.2, LE(2))) P = poseLookUp(prog(t, L(2) - 0.2, L(2) + 0.3) - prog(t, LE(2) - 0.4, LE(2)));
  else P = poseStand(t);
  if (t >= 2.0) heroAt(b, hx, P, dir, t);
  // топот: листья подпрыгивают
  burst(b, hx + 4, HY - 1, W("topchu") + 0.22, t, 18, 11, 0.7);
  burst(b, hx + 4, HY - 1, W("topchu") + 0.84, t, 18, 23, 0.7);
  // «Вешнюю леса красу»: облачко мысли — весенняя ветка зеленеет и желтеет
  const bt0 = W("veshn") - 0.1, bt1 = LE(4) + 0.2;
  if (between(t, bt0, bt1)) {
    const k = springPop((t - bt0) * 2), y0 = R(HY - 58 + (1 - k) * 10);
    thought(b, hx + 10, y0, 34, 20, hx + 4, HY - 30);
    const fade = prog(t, W("krasu"), W("krasu") + 0.6);
    line(b, hx + 13, y0 + 15, hx + 41, y0 + 6, PAL.bark, 1);
    for (let i = 0; i < 6; i++) {
      const lx = hx + 16 + i * 4.4, ly = y0 + 12 - i * 1.4 + (i % 2 ? -2 : 2);
      const col = mix(i % 2 ? "#5aa844" : "#86c85a", i % 2 ? "#e8901a" : "#ffd23f", fade);
      const drop = fade > 0.6 ? (fade - 0.6) * 30 * (0.5 + hash(i)) : 0;
      if (y0 + drop < y0 + 18) rect(b, lx, ly + drop, 3, 2, col);
    }
  }
  drawFalling(b, { t, cam }, lerp(10, 46, prog(t, 0.2, L(1) + 0.5)) | 0, { yOff: 0 });
  const zoomIn = smooth(prog(t, L(2) - 0.3, L(2) + 0.6)), punch = between(t, W("topchu"), W("topchu") + 1.4) ? 0.25 * springSoft((t - W("topchu")) * 2) : 0;
  return {
    zoom: 1 + smooth(prog(t, L(1) - 0.3, L(1) + 0.6)) * 0.3 + zoomIn * 0.25 + punch, fx: hx + 10, fy: HY - 26, shake: (between(t, W("topchu") + 0.22, W("topchu") + 0.32) || between(t, W("topchu") + 0.84, W("topchu") + 0.94)) ? 0.5 : 0,
    hud: t > L(1) - 0.3 ? hudGame(t) : { hidden: true }, band: { cam },
    screen: (g, tt) => {
      sfxText(g, "ТОП!", hx + 18, HY - 18, W("topchu") + 0.22, tt, "#ffd23f");
      sfxText(g, "ТОП!", hx + 24, HY - 30, W("topchu") + 0.84, tt, "#ffd23f");
    },
    over: (g, tt) => { // титр
      if (tt > L(1) + 0.4) return;
      const out = smooth(prog(tt, L(1) - 0.35, L(1) + 0.4));
      const y = R(130 - out * 700);
      drawTitle(g, "ОСЕНЬ", 960, y, 18, tt, 0.25);
      const ka = springPop((tt - 1.1) * 1.4);
      if (ka > 0) {
        const s = "Аполлон Николаевич Майков", w = textWidth(s) * 5;
        g.globalAlpha = clamp(ka);
        drawText(g, s, R((1920 - w) / 2), y + 230 + R((1 - ka) * 40), "#fff6e0", 5, { edge: "#2a1206", shadow: "#2a1206" });
        const yr = "1856", w2 = textWidth(yr) * 4;
        drawText(g, yr, R((1920 - w2) / 2), y + 310, "#ffd23f", 4, { edge: "#2a1206", shadow: "#2a1206" });
        g.globalAlpha = 1;
      }
    },
  };
}

// ===================== 2. «С холоду щёки горят… Листья ногой загребать!» =====================
function sc2(b, t) {
  const t0 = L(5) - 0.15;
  // герой стоит (крупно лицо), потом разгоняется
  const runStart = L(6) - 0.1;
  const hxW = 400 + (t > runStart ? (t - runStart) * 55 : 0);
  const kickT = W("zagreb") - 0.1;
  const stopT = kickT - 0.25;
  const xStop = 400 + (stopT - runStart) * 55;
  const hx = t < stopT ? hxW : xStop;
  const cam = hx - 120;
  // ветки под ногами на «сучья» и «трещат»: положены туда, куда наступит герой
  const twigs = [W("suchya"), W("treshch"), W("treshch") + 0.35].map((tw) => 400 + (tw - runStart) * 55 + 3);
  forest(b, t, { cam, cover: 0.95, wet: 0.5 });
  twigs.forEach((x, i) => twig(b, x - cam, HY - 1, t > [W("suchya"), W("treshch"), W("treshch") + 0.35][i]));
  let P;
  if (t < runStart) P = poseStand(t), P.blush = 1, P.mouth = "o";
  else if (t < stopT) P = poseRun(hx, t, 1.1);
  else if (t < kickT + 1.0) P = poseKick(prog(t, kickT - 0.1, kickT + 0.7));
  else P = poseStand(t);
  heroAt(b, hx - cam, P, 1, t);
  // пар изо рта и румянец
  if (t < runStart + 0.3) {
    for (let i = 0; i < 3; i++) {
      const u = ((t - t0) * 1.2 + i / 3) % 1;

  const kz = between(t, kickT, kickT + 1.4) ? 0.35 * Math.sin(Math.PI * prog(t, kickT, kickT + 1.4)) : 0;
  return {

// ===================== 3. «Нет мне здесь прежних утех!… Свянул последний цветок» =====================

  // цветок вянет

  let P;

  else if (between(t, L(10), LE(10) + 0.2)) P = poseLookUp(prog(t, L(10), L(10) + 0.4));

  else P = poseStand(t);

  const look = between(t, W("net") + 0.8, LE(9) + 0.2) ? (Math.floor((t - W("net") - 0.8) / 0.45) % 2 ? -1 : 1) : 1;
  heroAt(b, tr.x - cam, P, look, t);

// ===================== 5. «Долго на листьях лежит ночи мороз… Ясность прозрачных небес» =====================
function sc5(b, t) {
  const frost = smooth(prog(t, L(17) - 0.2, LE(18)));
  const slipT = W("moroz") - 0.05;
  const tr = track(t, [[L(17) - 0.2, 60], [slipT, 120], [slipT + 0.9, 132], [99, 132]]);
  const tilt = smooth(prog(t, W("skvoz"), W("glyadit"))) * (1 - smooth(prog(t, LE(20) - 0.3, LE(20) + 0.3)));
  const camY = R(tilt * 90);
  const cam = 40 + t * 2;
  forest(b, t, { cam, cover: 0.95, bare: 0.92, frost, camY });
  b.globalAlpha = 0.18 * frost; rect(b, 0, 0, LW, WH, "#cfe6ff"); b.globalAlpha = 1;
  // солнце «глядит»: глаза на бледном диске
  if (camY > 20) {
    const sx = 258 - cam * 0.02, sy = 30 + camY * 0.2;
    const look = Math.sin(t * 1.5) > 0 ? 1 : 0;
    rect(b, sx - 4 + look, sy - 1, 2, 2, "#5a6a8a"); rect(b, sx + 2 + look, sy - 1, 2, 2, "#5a6a8a");
    rect(b, sx - 2, sy + 4, 4, 1, "#9aa8c0");

  if (t > L(20)) for (let i = 0; i < 24; i++) { const u = (t * 0.7 + hash(i)) % 1; if (u < 0.3) px(b, hash(i * 3.3) * LW, hash(i * 5.1) * 80 + camY * 0.2 - 20, "#ffffff"); }
  let P;
  if (t < slipT) P = tr.v > 1 ? poseRun(tr.x, t, 0.7) : poseStand(t);
  else if (t < slipT + 0.9) P = poseSlip(prog(t, slipT, slipT + 0.9), t);
  else P = poseShiver(prog(t, slipT + 0.9, slipT + 1.3), t);
  const hx = tr.x - (t < slipT ? 0 : 0);
  b.save(); b.translate(0, camY * K); heroAt(b, hx, P, 1, t); b.restore();
  return {

    screen: (g, tt) => { sfxText(g, "ОЙ!", hx + 6, HY - 30 + camY, slipT + 0.15, tt, "#cfe8ff"); sfxText(g, "БРРР!", hx + 6, HY - 30 + camY, slipT + 1.1, tt, "#cfe8ff"); },
  };
}

// ===================== 6. «Листья шумят под ногой… И, как безумный, пою!» (и 9 — то же громче) =====================
function scRun(b, t, a) {
  // a: { l1: первая строка строфы, big: финальная версия }
  const n = a.l1, runT0 = L(n) - 0.3, smT = W(a.smert), toT = W(a.tolko), poT = L(n + 3);
  const dullK = smooth(prog(t, smT - 0.1, smT + 0.6)) * (1 - smooth(prog(t, toT - 0.05, toT + 0.25)));
  const speed = t < smT ? 60 : t < toT ? (a.big ? 52 : 34) : 0;
  const xRun = (tt) => 40 + Math.min(tt, smT) * 0 + (Math.min(tt, toT) - runT0) * 0;
  // путь: бег до «Только», потом прыжок и пение на месте
  const keys = [[runT0, 60], [smT, 60 + (smT - runT0) * 60], [toT, 60 + (smT - runT0) * 60 + (toT - smT) * (a.big ? 52 : 34)]];
  const tr = track(t, keys);
  const cam = tr.x - 120;
  forest(b, t, { cam, cover: 1, bare: 0.75, dull: dullK });
  // ветер «стелет жатву»: ряды листьев летят над землёй и ложатся
  if (between(t, smT - 0.1, toT + 0.2)) {
    for (let r = 0; r < 4; r++) for (let i = 0; i < 26; i++) {
      const u = prog(t, smT - 0.1 + r * 0.18, smT + 0.9 + r * 0.18);
      const x = R(lerp(330, 10 + i * 12, smooth(u)) + hash(i + r * 9) * 6), y = R(HY - 3 - r * 3 + Math.sin(i + t * 9) * (1 - u) * 3);
      rect(b, x, y, 3, 1, mix(LEAFC[(i + r) % LEAFC.length], "#8a7a68", dullK));
    }
  }
  const jumpT = toT + 0.02, jk = prog(t, jumpT, jumpT + 0.6);
  let P, dir = 1;
  if (t < toT) { P = poseRun(tr.x, t, t < smT ? 1.1 : 0.7); if (t > smT) { P.mouth = "sad"; P.lean = 0.35; } }
  else if (t < jumpT + 0.6) P = poseJump(jk, t);
  else {
    P = poseSing(prog(t, jumpT + 0.6, jumpT + 0.9), t);
    // «как безумный»: прыжки-развороты на месте
    const hu = (t - jumpT - 0.6) / 0.42;
    dir = Math.floor(hu + 0.5) % 2 ? -1 : 1; // разворот в воздухе, на вершине прыжка
    P.lift = Math.abs(Math.sin(hu * Math.PI)) * (a.big ? 7 : 4);
  }
  const hx = tr.x - cam;
  // финальная версия: куча листьев под героем и вихрь вокруг
  if (a.big && t > jumpT) {
    const k = smooth(prog(t, jumpT, jumpT + 0.8));
    leafPile(b, hx, HY + 1, 22, 7, k);
    for (let i = 0; i < 40; i++) {
      const a2 = t * 3 + i * TAU / 40, r = 16 + (i % 5) * 6 + Math.sin(t * 2 + i) * 3;
      rect(b, hx + Math.cos(a2) * r * 1.4, HY - 18 + Math.sin(a2) * r * 0.55 - (i % 7) * 2, 2, 1, LEAFC[i % LEAFC.length]);
    }
  }
  heroAt(b, hx, P, dir, t);
  if (t < toT) burst(b, hx - 4, HY - 1, Math.floor(t * 3.5) / 3.5, t, 10, Math.floor(t * 3.5), 0.5);
  if (t > jumpT + 0.45) notesFrom(b, hx, HY - 30, jumpT + 0.45, t, a.big ? 14 : 9, n);
  drawFalling(b, { t, cam }, a.big && t > toT ? 60 : 26, { wind: t > smT && t < toT ? 0.6 : 0 });
  // вспышка радости
  const flash = between(t, toT, toT + 0.25) ? 1 - prog(t, toT, toT + 0.25) : 0;
  const zoom = t < smT ? 1.6 : t < toT ? lerp(1.6, 1.3, smooth(prog(t, smT, smT + 0.6))) : lerp(1.3, a.big ? 1.45 : 1.9, smooth(prog(t, toT, toT + 0.7)));
  return {
    zoom, fx: hx + 6, fy: HY - (t > toT ? 34 : 28), dull: dullK, hud: hudGame(t), band: { cam },
    screen: (g, tt) => {
      if (flash > 0) { g.fillStyle = "#fff6c0"; g.globalAlpha = flash * 0.7; g.fillRect(0, 0, 1920, BAND_Y); g.globalAlpha = 1; }
      sfxText(g, "ШУРШ-ШУРШ!", hx + 4, HY - 40, W(a.shum) + 0.05, tt, "#ffd23f");
    },
  };
}
function sc6(b, t) { return scRun(b, t, { l1: 21, smert: "smert", tolko: "tolko", shum: "shumyat" }); }
function sc9(b, t) { return scRun(b, t, { l1: 33, smert: "smert2", tolko: "tolko2", shum: "shumyat2", big: true }); }

// ===================== 7. Воспоминание: подснежник → лето → осенние цветы =====================
const MEM_FLOWERS = [["snow", 0], ["bell", 1], ["daisy", 1], ["poppy", 1], ["camomile", 2], ["aster", 2]];
function sc7(b, t) {
  const t0 = L(25) - 0.3, pickT = W("rval") - 0.35, runT = W("vplot") - 0.2, endRun = LE(28) - 0.2;
  // сезон по ходу бега: весна → лето → осень
  const sp = prog(t, runT, endRun);
  const season = sp < 0.34 ? "spring" : sp < 0.72 ? "summer" : "autumn";
  const snowX0 = 136, baseX = snowX0 - 8.5;
  const tr = track(t, [[t0, 70], [pickT - 0.4, baseX], [runT, baseX], [endRun, baseX + (endRun - runT) * 70], [99, baseX + (endRun - runT) * 70]]);
  const cam = tr.x - 112;
  forest(b, t, { cam, season, cover: season === "autumn" ? 0.7 : 0, bare: season === "spring" ? 0.45 : 0, wet: season === "spring" ? 0.6 : 0 });
  // весной — снежные пятна
  if (season === "spring") for (let k = 0; k < 6; k++) { const x = k * 70 - (cam % 70) - 20; ell(b, x, HY - 1, 10, 2, "#f4f8ff"); }
  // подснежник у мха
  const snowX = 136;
  if (t < runT + 0.4) {
    mossMound(b, snowX - cam + 9, HY - 1, 0);
    const grow = smooth(prog(t, W("mhov") - 0.2, W("mhov") + 0.4));
    if (t < pickT && grow > 0) flower(b, snowX - cam, HY - 1 - (1 - grow) * 6, "snow", 0, grow);
  }
  // цветы вдоль пути: каждый встречен
  const flowersX = MEM_FLOWERS.slice(1).map((f, i) => baseX + (runT + 0.45 + i * (endRun - runT - 0.6) / 5 - runT) * 70 + 10);
  flowersX.forEach((x, i) => {
    const sx = x - cam;
    if (sx < -10 || sx > LW + 10) return;
    flower(b, sx, HY - 1, MEM_FLOWERS[i + 1][0], 0);
    const met = runT + 0.45 + i * (endRun - runT - 0.6) / 5;
    if (t > met) heart(b, sx - 2, HY - 16 - (t - met) * 10, "#ff5a7a");
  });
  let P;
  if (t < pickT - 0.4) P = poseRun(tr.x, t, 0.8);
  else if (t < pickT + 0.45) P = posePick(prog(t, pickT - 0.35, pickT) - prog(t, pickT + 0.05, pickT + 0.45));
  else if (t < runT) { P = poseStand(t); P.hands = [P.hands[0], [2.4, -2.8]]; P.elbows = ["back", "down"]; P.mouth = "open"; P.eyes = "happy"; P.blush = 1; }
  else P = poseRun(tr.x, t, 1);
  heroAt(b, tr.x - cam, P, 1, t);
  // сорванный подснежник: от земли в руку, потом герой держит его над головой
  if (between(t, pickT, runT + 0.05)) {
    const hx7 = tr.x - cam, handX = hx7 + 4.5, handY = HY - 17.4 - 2.8; // кисть поднятой ближней руки (poseStand)
    const u = smooth(prog(t, pickT, pickT + 0.45));
    const fx7 = lerp(snowX0 - cam, handX, u), fy7 = lerp(HY - 1, handY + 2, u);
    flower(b, fx7, fy7, "snow", 0, 1);
  }
  // в руке после срыва — подснежник
  const hud = { leaves: leavesAt(t), banner: ["ВОСПОМИНАНИЕ", t0 + 0.1, "#2c3a5a"] };
  return {
    zoom: t < runT ? 1.7 : 1.4, fx: tr.x - cam + 14, fy: HY - 24, hud, band: { cam },
    over: (g, tt) => drawCollection(g, tt, pickT, runT, endRun),
  };
}
// панель коллекции цветов (в воспоминании и зимой)
function drawCollection(g, t, pickT, runT, endRun) {
  const x0 = 1920 - 28 - 6 * 70 - 8, y0 = 24;
  panelBox(g, x0, y0, 6 * 70 + 8, 56, "#2c3a5a");
  MEM_FLOWERS.forEach((f, i) => {
    const got = i === 0 ? pickT : runT + 0.45 + (i - 1) * (endRun - runT - 0.6) / 5;
    const x = x0 + 8 + i * 70, y = y0 + 6;
    g.fillStyle = "#1a2236"; g.fillRect(x, y, 60, 44);
    if (t > got) {
      const k = springPop((t - got) * 2.2), s = R(lerp(1, 4, clamp(k)));
      // цветок значком: стебель и венчик
      const col = { snow: "#ffffff", bell: "#6a6ae8", daisy: "#ffffff", poppy: "#e83a3a", camomile: "#ffffff", aster: "#a85ad8" }[f[0]];
      g.fillStyle = "#4a8a3a"; g.fillRect(x + 28, y + 18, s, s * 5);
      g.fillStyle = col; g.fillRect(x + 22, y + 8, s * 4, s * 3); g.fillRect(x + 26, y + 4, s * 2, s * 5);
      g.fillStyle = "#ffd23f"; g.fillRect(x + 28, y + 12, s, s);
    }
  });
}

// ===================== 8. «Что им сказала душа… В зимние ночи и дни!» =====================
function sc8(b, t) {
  const winT = L(31) - 0.25;
  if (t < winT) {
    // разговор с цветами на летней поляне
    const cam = 300;
    forest(b, t, { cam, season: "summer", cover: 0, bare: 0 });
    const fl = ["bell", "daisy", "poppy", "camomile", "aster"];
    fl.forEach((k, i) => {
      const sw = Math.sin(t * 3 + i) * (t > L(30) ? 0.25 : 0.08);
      flower(b, 168 + i * 9, HY - 1, k, sw < 0 ? 0 : sw);
    });
    const P8 = poseCrouch(prog(t, L(29) - 0.3, L(29) + 0.2), 0.1, [CROUCH_TALK[0] + Math.sin(t * 3.4) * 0.6, CROUCH_TALK[1] + Math.cos(t * 3.4) * 0.6]); // дальняя рука жестикулирует
    P8.tilt = 0.25 + Math.sin(t * 4.2) * 0.25; P8.mouth = Math.floor(t * 5) % 2 ? "open" : "smile"; P8.eyes = t > L(30) ? "happy" : "open";
    P8.hands[1] = [P8.hands[1][0] + Math.sin(t * 3) * 0.8, P8.hands[1][1] - 1.5 + Math.sin(t * 3) * 0.6];
    heroAt(b, 140, P8, 1, t);
    // пузыри: герой — сердце и нота; цветы — ноты и сердца в ответ
    const bk = springPop((t - L(29) - 0.1) * 2);
    if (t > L(29) && t < L(30) + 0.3) { bubble(b, 132, HY - 52 + R((1 - clamp(bk)) * 6), 22, 12, 140); heart(b, 136, HY - 48, "#ff5a7a"); note(b, 146, HY - 50, "#ffb21b"); }
    if (t > L(30)) {
      for (let i = 0; i < 5; i++) {
        const st = L(30) + i * 0.25, k = springPop((t - st) * 2);
        if (k <= 0) continue;
        const x = 162 + i * 9, y = HY - 34 - (i % 2) * 10 - R((1 - clamp(k)) * 4);
        bubble(b, x, y, 10, 9, x + 4);
        if (i % 2) note(b, x + 3, y + 1, "#ffb21b"); else heart(b, x + 3, y + 2, "#ff5a7a");
      }
    }
    return { zoom: 1.7, fx: 170, fy: HY - 30, hud: { leaves: leavesAt(t), banner: ["ВОСПОМИНАНИЕ", L(25) - 0.2, "#2c3a5a"] }, band: { cam }, over: (g, tt) => drawCollection(g, tt, -1, -1, 0) };
  }
  // зимняя ночь: изба, окно с тёплым светом, внутри герой с альбомом цветов
  const dayK = between(t, W("dni") - 0.6, W("dni") + 0.9) ? Math.sin(Math.PI * prog(t, W("dni") - 0.6, W("dni") + 0.9)) : 0;
  const night = dayK < 0.5;
  drawSky(b, { t, night, season: "winter", cam: 0 });
  if (!night) { rect(b, 0, 0, LW, WH, "#a8cce8"); disc(b, 60, 30, 10, "#fff6d0"); }
  drawFar(b, { t, cam: 0, season: "winter", night });
  rect(b, 0, GY - 4, LW, WH, night ? "#c8d4e8" : "#eef4fa");
  // изба
  const hx0 = 96, hw = 140;
  for (let j = 0; j < 9; j++) { rect(b, hx0, 54 + j * 9, hw, 8, j % 2 ? "#6a4228" : "#7a4c2c"); rect(b, hx0, 61 + j * 9, hw, 1, "#3e2618"); }
  poly(b, [[hx0 - 12, 56], [hx0 + hw / 2, 20], [hx0 + hw + 12, 56]], "#4e3020");
  poly(b, [[hx0 - 12, 56], [hx0 + hw / 2, 20], [hx0 + hw + 12, 56], [hx0 + hw / 2, 26]], "#f4f8ff");
  // окно
  const wx = 136, wy = 66, ww = 60, wh = 44;
  rect(b, wx - 4, wy - 4, ww + 8, wh + 8, "#efe6d0");
  const glow = 0.85 + 0.15 * Math.sin(t * 3);
  rect(b, wx, wy, ww, wh, mix("#e8a040", "#ffd27a", glow));
  rect(b, wx, wy + wh - 10, ww, 10, "#c87a38");
  // лампа
  disc(b, wx + 48, wy + 10, 3, "#fff6c0"); rect(b, wx + 47, wy + 2, 2, 6, "#5a3a20");
  // герой у окна с альбомом
  b.save(); b.beginPath(); b.rect(wx * K, wy * K, ww * K, wh * K); b.clip();
  // альбом с цветами — перед героем, кисти лежат на его краях
  const pk = prog(t, W("vspomnyu"), W("vspomnyu") + 0.5);
  rect(b, wx + 21, wy + wh - 23, 14, 10, "#a03030"); rect(b, wx + 22, wy + wh - 22, 12, 8, "#fff6e0"); rect(b, wx + 28, wy + wh - 22, 1, 8, "#d8c8a8");
  if (pk > 0) { flower(b, wx + 25, wy + wh - 15, "snow", 0, pk); flower(b, wx + 31, wy + wh - 15, "aster", 0, pk); }
  drawHero(b, wx + 16, wy + wh - 6, poseSit(t, true), 1, t);
  b.restore();
  // рама, подоконник со снегом
  rect(b, wx + ww / 2 - 1, wy, 2, wh, "#efe6d0"); rect(b, wx, wy + wh / 2 - 1, ww, 2, "#efe6d0");
  rect(b, wx - 6, wy + wh + 4, ww + 12, 3, "#f4f8ff");
  // снег
  for (let i = 0; i < 70; i++) {
    const sp = 10 + hash(i) * 14, y = ((t * sp + hash(i * 3) * 200) % 170) - 10, x = (hash(i * 7) * 360 + Math.sin(t + i) * 5) % 340 - 10;
    px(b, x, y, "#ffffff"); if (i % 3 === 0) px(b, x + 1, y, "#dfe8f8");
  }
  const z = lerp(1.3, 1.9, smooth(prog(t, winT, W("dysha"))));
  return {
    zoom: z, fx: wx + ww / 2, fy: wy + wh / 2 + 6, band: { night: true },
    hud: { leaves: leavesAt(t), banner: ["СОХРАНЕНО", W("vspomnyu"), "#2c3a5a"] },
    over: (g, tt) => drawCollection(g, tt, -1, -1, 0),
  };
}

// ===================== финал: герой сидит на куче листьев, название крупно =====================
function scFinal(b, t) {
  const cam = 600 + (t - W("fin")) * 4;
  forest(b, t, { cam, cover: 1, bare: 0.5 });
  leafPile(b, 160, HY + 1, 24, 8, 1);
  drawHero(b, 156, HY - 6, poseSit(t), 1, t);
  drawFalling(b, { t, cam }, 30);
  return {
    zoom: 1.5, fx: 160, fy: 96, hud: { hidden: true }, band: { cam },
    over: (g, tt) => {
      drawTitle(g, "ОСЕНЬ", 960, 110, 18, tt, W("fin") + 0.1);
      const ka = springPop((tt - W("fin") - 0.7) * 1.4);
      if (ka > 0) {
        const s = "Аполлон Николаевич Майков", w = textWidth(s) * 5;
        g.globalAlpha = clamp(ka);
        drawText(g, s, R((1920 - w) / 2), 340 + R((1 - ka) * 40), "#fff6e0", 5, { edge: "#2a1206", shadow: "#2a1206" });
        g.globalAlpha = 1;
      }
    },
  };
}

// [функция, время начала, переход на входе: leaf — вихрь листьев, mos — пиксельное растворение]
const SCENES = [
  [sc1, 0], [sc2, L(5) - 0.15, "leaf"], [sc3, L(9) - 0.3, "leaf"], [sc4, L(13) - 0.3, "leaf"], [sc5, L(17) - 0.3, "leaf"],
  [sc6, L(21) - 0.3, "leaf"], [sc7, L(25) - 0.3, "mos"], [sc8, L(29) - 0.3, "none"], [sc9, L(33) - 0.3, "leaf"], [scFinal, W("fin"), "leaf"],
];

// ---------- Склейка: буфер мира → экран с зумом камеры, полоса строк, HUD, переходы ----------
const cv = document.getElementById("scene");
const g = cv.getContext("2d", { alpha: false });
g.imageSmoothingEnabled = false;
const buf = document.createElement("canvas"); buf.width = LW * K; buf.height = WH * K;
const b = buf.getContext("2d", { alpha: false });
b.imageSmoothingEnabled = false;
const TOTAL = CFG.total;
const VIEW = { sx: 0, sy: 0, k: SC };
// точка буфера мира → экран (после зума)
const scr = (x, y) => [(x - VIEW.sx) * VIEW.k, (y - VIEW.sy) * VIEW.k];

// переход «вихрь листьев»: полоса крупных пиксельных листьев пролетает через экран; u 0…1
function leafWipe(g, u) {
  if (u <= 0 || u >= 1) return;
  const P = SC * 2;
  for (let i = 0; i < 260; i++) {
    const row = i % 16, k = Math.floor(i / 16);
    const y = row * 56 + R(hash(i * 1.7) * 30) - 20;
    const x = R(lerp(2300, -900, u) + k * 70 + hash(i * 3.1) * 90 + Math.sin(i + u * 9) * 30);
    if (x < -60 || x > 1980 || y > BAND_Y - P * 2) continue;
    g.fillStyle = LEAFC[i % LEAFC.length];
    g.fillRect(R(x / SC) * SC, R(y / SC) * SC, P * 2, P);
    g.fillRect(R(x / SC) * SC + P, R(y / SC) * SC - P, P, P);
  }
  // сплошное ядро вихря закрывает смену кадра
  const cx = lerp(2300, -900, u) + 400;
  g.fillStyle = "#e8901a";
  g.fillRect(R((cx - 260) / SC) * SC, 0, 520, BAND_Y);
  g.fillStyle = "#ffd23f";
  g.fillRect(R((cx - 180) / SC) * SC, 0, 360, BAND_Y);
}
// пиксельное растворение (для воспоминания): мозаика всего кадра
const tmp = document.createElement("canvas"); tmp.width = 1920; tmp.height = 1080;
const tg = tmp.getContext("2d"); tg.imageSmoothingEnabled = false;
function mosaic(level) {
  const sc = Math.max(1, R(level)); if (sc <= 1) return;
  const w = Math.ceil(1920 / sc), h = Math.ceil(1080 / sc);
  tg.drawImage(cv, 0, 0, 1920, 1080, 0, 0, w, h); g.drawImage(tmp, 0, 0, w, h, 0, 0, w * sc, h * sc);
}

function render(t) {
  let i = 0;
  while (i + 1 < SCENES.length && t >= SCENES[i + 1][1]) i++;
  const [fn, start, kind] = SCENES[i];
  b.setTransform(1, 0, 0, 1, 0, 0);
  b.globalAlpha = 1;
  const v = fn(b, t, t - start) || {};
  // мир на экран с зумом: crop вокруг фокуса
  const z = v.zoom || 1;
  const sw = LW / z, sh = WH / z;
  const fx = v.fx === undefined ? LW / 2 : v.fx, fy = v.fy === undefined ? WH / 2 : v.fy;
  const sx = clamp(fx - sw / 2, 0, LW - sw), sy = clamp(fy - sh / 2, 0, WH - sh);
  VIEW.sx = sx; VIEW.sy = sy; VIEW.k = 1920 / sw;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.imageSmoothingEnabled = false;
  if (v.dull) g.filter = `saturate(${(1 - v.dull * 0.75).toFixed(3)}) brightness(${(1 - v.dull * 0.18).toFixed(3)})`;
  if (v.shake) { const a = v.shake; g.drawImage(buf, sx * K, sy * K, sw * K, sh * K, R(Math.sin(t * 70) * a) * SC, R(Math.cos(t * 53) * a) * SC, 1920, BAND_Y); }
  else g.drawImage(buf, sx * K, sy * K, sw * K, sh * K, 0, 0, 1920, BAND_Y);
  g.filter = "none";
  if (v.screen) v.screen(g, t);
  drawBand(g, t, v.band);
  drawVerse(g, t);
  drawHud(g, t, v.hud);
  if (v.over) v.over(g, t);
  // переходы
  const next = SCENES[i + 1], till = next ? next[1] - t : 99, nk = next && next[2];
  const u0 = t - start;
  if (kind === "leaf" && u0 < 0.35) leafWipe(g, 0.5 + u0 / 0.35 * 0.5);
  if (nk === "leaf" && till < 0.35) leafWipe(g, 0.5 - till / 0.35 * 0.5);
  if (kind === "mos" && u0 < 0.4) mosaic(lerp(40, 1, u0 / 0.4));
  if (nk === "mos" && till < 0.4) mosaic(lerp(1, 40, 1 - till / 0.4));
  if (t > TOTAL - 0.8) { g.fillStyle = "#000"; g.globalAlpha = clamp((t - TOTAL + 0.8) / 0.7); g.fillRect(0, 0, 1920, 1080); g.globalAlpha = 1; }
}

window.addEventListener("hf-seek", (e) => render(e.detail.time));
render(0);

      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, CFG.total);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
