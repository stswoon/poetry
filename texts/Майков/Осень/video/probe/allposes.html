<!doctype html><html><head><meta charset="utf-8"><script src="../lib/motion.js"></script>
<style>body{margin:0;background:#b8d4e6}canvas{image-rendering:pixelated;width:1920px;height:1080px;display:block}</style></head><body>
<canvas id="cv" width="1152" height="648"></canvas>
<script src="cfg.js"></script>
<script src="../src/font.js"></script><script src="../src/gfx.js"></script><script src="../src/hero.js"></script><script src="../src/poses.js"></script>
<script src="../src/world.js"></script><script src="../src/hud.js"></script><script src="../src/scenes.js"></script>
<script>
// Проба: вызывает сцены ролика в моменты t и рисует позы героя крупно, по порядку (страница ?page=N, 40 поз на страницу)
const VIEW = { sx: 0, sy: 0, k: 6 }; const scr = (x, y) => [x, y];
const page = +(new URLSearchParams(location.search).get('page') || 0), STEP = +(new URLSearchParams(location.search).get('step') || 0.3);
const real = drawHero; let rec = [];
drawHero = function (c, x, y, P, dir, t) { rec.push({ P: JSON.parse(JSON.stringify(P)), dir }); };
const dummy = document.createElement('canvas'); dummy.width = 320; dummy.height = 150; const db = dummy.getContext('2d');
const items = [];
for (let t = 2.0; t < CFG.total; t += STEP) {
  let i = 0; while (i + 1 < SCENES.length && t >= SCENES[i + 1][1]) i++;
  rec = []; SCENES[i][0](db, t, t - SCENES[i][1]);
  rec.forEach(r => items.push({ t, ...r }));
}
drawHero = real;
const c = document.getElementById('cv').getContext('2d');
c.fillStyle = '#b8d4e6'; c.fillRect(0, 0, 1152, 648);
const list = items.slice(page * 40, page * 40 + 40);
list.forEach((it, k) => {
  const col = k % 8, row = Math.floor(k / 8), x = 24 + col * 48, y = 36 + row * 43;
  rect(c, x - 20, y, 40, 1, '#7a5a3a');
  drawHero(c, x, y, it.P, it.dir, it.t);
  c.fillStyle = '#000'; c.font = '18px monospace'; c.fillText(it.t.toFixed(1), (x - 20) * 3, (y + 7) * 3);
});
document.title = 'items:' + items.length;
</script></body></html>
